<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<link rel="manifest" href="/manifest_admin.json"/>
<meta name="theme-color" content="#1F3A5F"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>Material Depot — Admin Console</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="/md-audit-registry.js"></script>
<script src="/md-pdf.js"></script>
<script src="/md-wp-track.js"></script>
<script src="/md-cat-analytics.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root{
    --navy:#1F3A5F;--navy2:#16294a;--blue:#2E6CA8;--yellow:#F4C20D;
    --ink:#1b2230;--muted:#67748a;--line:#dde3ec;--bg:#eef1f6;--card:#fff;
    --lighter:#eef3f9;--green:#1f7a3f;--greenbg:#e6f3ea;
    --red:#b3261e;--redbg:#fbeae8;--amber:#9a6200;--amberbg:#fdf2da;
    --purple:#5b3aa6;--purplebg:#efeaf8;--teal:#0f6e74;
    --shadow:0 1px 2px rgba(20,40,80,.06),0 4px 14px rgba(20,40,80,.06);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;}
  html,body{overflow-x:hidden;max-width:100%;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;min-height:100vh;}

  header{background:var(--navy);color:#fff;padding:0 20px;display:flex;align-items:center;gap:14px;height:56px;position:sticky;top:0;z-index:50;box-shadow:0 2px 8px rgba(0,0,0,.2);}
  .logo{width:34px;height:34px;border-radius:8px;background:var(--yellow);color:var(--navy);font-weight:800;display:grid;place-items:center;font-size:15px;flex:0 0 auto;}
  .brand-text .t{font-size:10px;color:#9fb2cd;letter-spacing:1px;font-weight:700;}
  .brand-text .h{font-size:15px;font-weight:700;line-height:1.1;}
  .admin-badge{background:var(--yellow);color:var(--navy);font-size:10px;font-weight:800;padding:2px 8px;border-radius:20px;letter-spacing:.5px;}
  .hdr-right{margin-left:auto;display:flex;align-items:center;gap:12px;}
  .user-pill{font-size:13px;color:#cdd8e8;}
  .user-pill b{color:#fff;}
  .signout-btn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#cdd8e8;border-radius:8px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer;}
  .signout-btn:hover{background:rgba(255,255,255,.2);}
  .menu-toggle{display:none;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;width:34px;height:34px;border-radius:8px;font-size:17px;cursor:pointer;flex:0 0 auto;}
  .rail-overlay{display:none;position:fixed;inset:0;background:rgba(10,15,25,.45);z-index:59;}

  .layout{display:flex;min-height:calc(100vh - 56px);}

  .rail{width:210px;background:#fff;border-right:1px solid var(--line);padding:12px 8px;flex:0 0 auto;display:flex;flex-direction:column;}
  .rail-section{font-size:10px;letter-spacing:.8px;color:var(--muted);font-weight:800;margin:14px 10px 5px;text-transform:uppercase;}
  .nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;color:var(--ink);font-weight:600;font-size:13.5px;cursor:pointer;border:0;background:transparent;width:100%;text-align:left;}
  .nav-item .ico{width:18px;text-align:center;flex:0 0 auto;}
  .nav-item:hover{background:var(--lighter);}
  .nav-item.active{background:var(--navy);color:#fff;}
  .nav-badge{margin-left:auto;font-size:11px;background:var(--lighter);color:var(--navy);border-radius:20px;padding:1px 7px;font-weight:800;}
  .nav-item.active .nav-badge{background:rgba(255,255,255,.18);color:#fff;}
  body.sm-analytics-only .admin-only{display:none;}

  main{flex:1;min-width:0;padding:22px 24px 60px;overflow:auto;}
  .page-head{margin-bottom:20px;}
  .page-head h1{font-size:22px;font-weight:800;color:var(--navy);letter-spacing:-.4px;}
  .page-head p{color:var(--muted);font-size:13px;margin-top:3px;}

  .stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px;margin-bottom:20px;}
  .stat-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow);min-width:0;overflow:hidden;}
  .stat-card .val{font-size:28px;font-weight:800;color:var(--navy);letter-spacing:-.5px;}
  .stat-card .lbl{font-size:12px;color:var(--muted);font-weight:700;margin-top:2px;}
  .stat-card .bar{height:3px;border-radius:3px;margin-top:10px;background:var(--line);overflow:hidden;}
  .stat-card .bar-fill{height:100%;border-radius:3px;}
  .stat-card.clickable{cursor:pointer;transition:box-shadow .15s,border-color .15s;}
  .stat-card.clickable:hover{border-color:var(--blue);box-shadow:0 2px 10px rgba(46,108,168,.15);}
  .stat-card.clickable.active{border-color:var(--navy);background:var(--navy);}
  .stat-card.clickable.active .val,.stat-card.clickable.active .lbl{color:#fff;}

  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;}
  .card-head{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;}
  .card-head h2{font-size:15px;font-weight:800;color:var(--navy);}

  .toolbar{display:flex;gap:8px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap;}
  .search-wrap{position:relative;flex:1;min-width:180px;}
  .search-wrap input{width:100%;padding:8px 10px 8px 30px;border:1px solid var(--line);border-radius:8px;font-size:13px;background:#fff;color:var(--ink);}
  .search-wrap input:focus{outline:none;border-color:var(--blue);}
  .search-ico{position:absolute;left:9px;top:9px;color:var(--muted);font-size:13px;}

  table{width:100%;border-collapse:collapse;}
  thead th{background:#f7f9fc;text-align:left;font-size:10.5px;letter-spacing:.5px;color:var(--muted);font-weight:800;padding:10px 14px;border-bottom:1px solid var(--line);text-transform:uppercase;white-space:nowrap;}
  tbody td{padding:11px 14px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle;}
  tbody tr:last-child td{border-bottom:0;}
  tbody tr:hover td{background:#fafbfd;}

  .role-badge{display:inline-flex;align-items:center;font-size:11px;font-weight:800;border-radius:20px;padding:4px 10px;white-space:nowrap;}
  .rb-admin{background:var(--purplebg);color:var(--purple);}
  .rb-service_mgr{background:#e3edf7;color:var(--navy);}
  .rb-site_auditor{background:#e4f0fb;color:var(--blue);}
  .rb-installer{background:var(--greenbg);color:var(--green);}
  .rb-auditor_installer{background:#e0f4f4;color:#0f6e74;}
  .rb-store_staff{background:var(--amberbg);color:var(--amber);}
  .rb-bm{background:var(--redbg);color:var(--red);}
  .rb-coe{background:#e0f4f4;color:#0f6e74;}
  .rb-content_team{background:var(--redbg);color:var(--red);}

  .chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;border-radius:20px;padding:4px 10px;white-space:nowrap;}
  .chip .dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:0 0 auto;}
  .c-pending{background:#eef1f6;color:#5a6b86;}
  .c-scheduled{background:#e4f0fb;color:var(--blue);}
  .c-onway{background:var(--amberbg);color:var(--amber);}
  .c-atsite{background:#fff4d6;color:#7a5800;}
  .c-partial{background:#fff4e0;color:#7a5200;}
  .c-completed{background:var(--greenbg);color:var(--green);}
  .c-reschedule{background:var(--redbg);color:var(--red);}

  .btn-icon{background:transparent;border:1px solid var(--line);border-radius:7px;padding:5px 9px;font-size:12px;cursor:pointer;color:var(--muted);font-weight:700;}
  .btn-icon:hover{border-color:var(--blue);color:var(--blue);}
  .btn-icon.del:hover{border-color:var(--red);color:var(--red);}
  .btn-primary{background:var(--navy);color:#fff;border:0;border-radius:9px;padding:9px 16px;font-size:13px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
  .btn-primary:hover{background:var(--navy2);}
  .btn-primary:disabled{opacity:.5;cursor:not-allowed;}

  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;display:none;align-items:center;justify-content:center;padding:20px;}
  .modal{background:#fff;border-radius:16px;width:100%;max-width:440px;box-shadow:0 20px 60px rgba(0,0,0,.3);overflow:hidden;}
  .modal.wide{max-width:720px;max-height:88vh;overflow-y:auto;}
  .jd-head{display:flex;align-items:center;gap:12px;padding:20px 24px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:2;}
  .jd-pi{font-size:15px;font-weight:800;color:var(--navy);flex:1;}
  .jd-info{padding:14px 24px;display:flex;flex-direction:column;gap:7px;border-bottom:1px solid var(--line);}
  .jd-row{display:flex;gap:10px;font-size:13px;align-items:flex-start;}
  .jd-label{color:var(--muted);font-weight:700;min-width:88px;flex-shrink:0;font-size:12px;}
  .jd-section{padding:14px 24px;border-bottom:1px solid var(--line);}
  .jd-sec-head{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:10px;}
  .jc-room{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px;}
  .jc-room-head{font-size:12px;font-weight:800;color:var(--navy);margin-bottom:6px;}
  .jc-kvs{display:flex;flex-wrap:wrap;gap:4px 16px;}
  .jc-kv{font-size:12px;line-height:1.4;}
  .jc-k{color:var(--muted);font-size:11px;}
  .jc-v{font-weight:700;}
  .jc-photos{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;}
  .jd-log{display:flex;flex-direction:column;gap:5px;}
  .jd-tl{font-size:12px;padding:4px 0;border-bottom:1px solid var(--line);}
  .jd-tl:last-child{border-bottom:none;}
  .jd-tl-t{font-weight:600;color:var(--ink);}
  .jd-tl-d{color:var(--muted);font-size:11px;margin-top:1px;}
  .jd-btns{padding:16px 24px 20px;display:flex;gap:10px;flex-wrap:wrap;}
  .btn-ghost{background:#f0f2f5;border:0;border-radius:9px;padding:9px 16px;font-size:13px;font-weight:700;cursor:pointer;color:var(--ink);}
  .btn-ghost:hover{background:#e0e4ea;}
  .modal-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;}
  .modal-head h3{font-size:16px;font-weight:800;color:var(--navy);}
  .modal-close{margin-left:auto;background:transparent;border:0;font-size:22px;cursor:pointer;color:var(--muted);line-height:1;padding:0 4px;}
  .modal-body{padding:20px;}
  .form-group{margin-bottom:14px;}
  .form-group label{display:block;font-size:11px;font-weight:800;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.4px;}
  .form-group input,.form-group select{width:100%;padding:10px 12px;border:2px solid var(--line);border-radius:9px;font-size:14px;color:var(--ink);background:#fff;}
  .form-group input:focus,.form-group select:focus{outline:none;border-color:var(--blue);}
  .form-error{background:var(--redbg);color:var(--red);border-radius:8px;padding:9px 12px;font-size:12.5px;font-weight:600;margin-top:10px;display:none;}
  .form-error.show{display:block;}
  .modal-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;}
  .btn-cancel{background:#f0f2f5;border:0;border-radius:9px;padding:9px 16px;font-size:13px;font-weight:700;cursor:pointer;color:var(--ink);}

  .role-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:20px;}
  .role-card{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:18px;cursor:pointer;text-align:center;transition:border-color .15s;}
  .role-card:hover{border-color:var(--blue);}
  .role-card.active{border-color:var(--navy);background:var(--navy);color:#fff;}
  .role-card .rc-ico{font-size:28px;margin-bottom:8px;}
  .role-card .rc-name{font-weight:800;font-size:14px;}
  .role-card .rc-desc{font-size:12px;color:var(--muted);margin-top:4px;}
  .role-card.active .rc-desc{color:#9fb2cd;}
  .iframe-wrap{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;height:620px;}
  .iframe-wrap iframe{width:100%;height:100%;border:0;}

  .perf-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;}
  .perf-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow);}
  .perf-card .pc-head{display:flex;align-items:center;gap:11px;margin-bottom:14px;}
  .pc-av{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-weight:800;font-size:14px;color:#fff;flex:0 0 auto;}
  .pc-name{font-weight:800;font-size:14px;}
  .pc-role{font-size:11.5px;color:var(--muted);}
  .perf-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px;}
  .perf-row:last-child{border-bottom:0;}
  .pr-val{font-weight:800;color:var(--navy);}

  .user-av{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;font-weight:800;font-size:12px;color:#fff;flex:0 0 auto;}

  .empty{text-align:center;padding:48px 20px;color:var(--muted);}
  .empty .e-ico{font-size:36px;margin-bottom:10px;}
  .empty .e-msg{font-size:14px;font-weight:600;}

  .spinner{display:inline-block;width:18px;height:18px;border:2px solid rgba(31,58,95,.15);border-top-color:var(--navy);border-radius:50%;animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg)}}
  .loading-row{text-align:center;padding:40px;color:var(--muted);}

  /* Analytics */
  .an-section{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:20px;}
  .an-section-head{display:flex;align-items:center;gap:14px;padding:16px 20px;border-bottom:1px solid var(--line);background:#f8f9fc;}
  .an-section-ico{font-size:24px;flex:0 0 auto;}
  .an-section-title{font-size:16px;font-weight:800;color:var(--navy);}
  .an-section-sub{font-size:12px;color:var(--muted);margin-top:2px;}
  .an-hero{margin-left:auto;text-align:right;flex:0 0 auto;}
  .an-hero-val{font-size:40px;font-weight:900;color:var(--navy);line-height:1;}
  .an-hero-label{font-size:11px;color:var(--muted);margin-top:2px;}
  .an-grid{display:grid;grid-template-columns:repeat(3,1fr);}
  .an-grid .an-card:nth-child(3n){border-right:none;}
  .an-grid4{display:grid;grid-template-columns:repeat(4,1fr);}
  .an-grid4 .an-card:nth-child(4n){border-right:none;}
  .an-card{padding:16px 18px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-height:110px;}
  .an-card-na{background:#fafbfc;}
  .an-label{font-size:10.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:7px;}
  .an-val{font-size:30px;font-weight:900;line-height:1;margin-bottom:5px;}
  .an-bar{height:4px;background:var(--lighter,#e8edf4);border-radius:2px;margin:5px 0 6px;}
  .an-bar-fill{height:100%;border-radius:2px;}
  .an-sub{font-size:11.5px;color:var(--muted);}
  .an-sub2{font-size:11px;color:var(--muted);margin-top:2px;}
  .an-stars{font-size:19px;color:var(--amber,#9a6200);margin:4px 0 3px;letter-spacing:1px;}
  .an-nps-row{display:flex;flex-direction:column;gap:2px;margin:5px 0 4px;font-size:11.5px;font-weight:700;}
  .an-nps-p{color:var(--green);}
  .an-nps-n{color:var(--muted);font-weight:500;}
  .an-nps-d{color:var(--red);}
  /* Analytics V2 additions */
  .an-date-row{display:flex;align-items:center;gap:10px;margin-bottom:22px;flex-wrap:wrap;}
  .an-date-label{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;}
  .an-date-inp{padding:7px 10px;border:1.5px solid var(--line);border-radius:8px;font-size:13px;color:var(--navy);background:#fff;font-weight:600;cursor:pointer;}
  .an-date-inp:focus{outline:none;border-color:var(--navy);}
  .an-apply-btn{padding:7px 16px;background:var(--navy);color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;}
  .an-sub-head{padding:10px 18px;background:#f9fafc;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);}
  .an-inst-table{width:100%;border-collapse:collapse;font-size:12.5px;}
  .an-inst-table thead th{padding:9px 14px;text-align:left;font-size:9.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;border-bottom:1.5px solid var(--line);white-space:nowrap;background:#f8f9fc;}
  .an-inst-table tbody td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:middle;}
  .an-inst-table tbody tr:last-child td{border-bottom:none;}
  .an-inst-table tbody tr:hover td{background:#f8fbff;}
  .an-inst-table small{font-size:9px;color:var(--muted);font-weight:400;display:block;margin-top:2px;}
  .an-deliv-row{display:flex;gap:24px;flex-wrap:wrap;padding:14px 20px;border-bottom:1px solid var(--line);align-items:center;}
  .an-deliv-stat{display:flex;flex-direction:column;gap:3px;}
  .an-deliv-val{font-size:26px;font-weight:800;line-height:1.1;}
  .an-deliv-lbl{font-size:11px;color:var(--muted);font-weight:600;}
  .an-na-note{padding:20px;text-align:center;color:var(--muted);font-size:13px;border-bottom:1px solid var(--line);}
  .an-footer{font-size:11.5px;color:var(--muted);padding:14px 20px;background:#f8f9fc;border-radius:10px;border:1px solid var(--line);line-height:1.8;margin-top:4px;}
  /* ── Analytics V3: category & commercial tabs (see md-cat-analytics.js) ────────────── */
  .an-tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px;border-bottom:1px solid var(--line);padding-bottom:0;}
  .an-tab{border:1px solid var(--line);border-bottom:0;background:#f8f9fc;color:var(--muted);border-radius:10px 10px 0 0;
    padding:9px 15px;font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:7px;position:relative;top:1px;}
  .an-tab:hover{background:#fff;color:var(--ink);}
  .an-tab.active{background:#fff;color:var(--navy);border-color:var(--line);border-bottom:1px solid #fff;box-shadow:0 -2px 0 var(--navy) inset;}
  .an-tab small{display:block;font-size:10px;font-weight:600;color:var(--muted);}
  .an-filter{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);
    border-radius:12px;padding:12px 14px;margin:0 0 16px;}
  .an-filter label{font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:3px;}
  .an-note-row{font-size:11.5px;color:var(--muted);line-height:1.65;background:#f8f9fc;border:1px solid var(--line);
    border-radius:10px;padding:10px 14px;margin:0 0 16px;}
  .an-kpi{display:grid;grid-template-columns:1.6fr repeat(4,1fr);gap:12px;margin:0 0 16px;}
  .an-kpi-hero,.an-kpi-tile{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0;}
  .an-kpi-lbl{font-size:10.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;}
  .an-hero-fig{font-size:48px;font-weight:800;color:var(--navy);line-height:1.05;margin:6px 0 4px;letter-spacing:-1px;}
  .an-kpi-val{font-size:26px;font-weight:800;color:var(--ink);line-height:1.1;margin:6px 0 3px;}
  .an-kpi-sub{font-size:11.5px;color:var(--muted);line-height:1.5;}
  .an-catgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px;}
  .an-catcard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 15px;display:flex;flex-direction:column;gap:9px;}
  .an-catcard-head{display:flex;align-items:flex-start;gap:9px;}

let SESSION = null;

/* Role Viewer preview identity. loadRvIframe() impersonates the previewed person in
   localStorage only long enough for the iframe's FIRST paint, then restores the admin's own
   session (so a reload can never strand an admin inside someone else's account). That means a
   real page navigation *inside* the preview — the `<a href="Admin.html">Analytics</a>` link in
   both SM dashboards, and BM/COE's link to the Shadower app — used to re-read localStorage and
   find the ADMIN session, rendering the full Admin Console instead of what the previewed role
   actually gets. The parent frame publishes who it is previewing on window.__mdRolePreview;
   any page that can be navigated to from inside a preview prefers it over localStorage.
   Same-origin only, and never consulted when this page is the top-level window. */
function rvPreviewSession(){
  try{
    if(window.top===window.self)return null;
    const p=window.parent&&window.parent.__mdRolePreview;
    return (p&&p.role)?{name:p.name,email:p.email,role:p.role}:null;
  }catch(e){return null;}   /* cross-origin parent — not one of our previews */
}

/* ────────────────────────────────────────────────────────────────────────────────────────────
   TARGET ALERT (added 2026-08-18 with the Analytics V3 revamp)
   Computes "is any store failing its target this month" once at boot, so the answer is visible on
   the rail and on the Overview page rather than only to someone who thinks to open Analytics →
   Targets. Scope is the CURRENT month to date (clamped to the data window while the commercial
   source is the dummy generator), which is the window a manager can still act on.
   ──────────────────────────────────────────────────────────────────────────────────────────── */
let _anAlert=null;
async function anLoadAlert(){
  if(SESSION&&SESSION.role!=='admin')return null;   // commercial targets are admin-scope
  try{
    if(!_anCatDs)_anCatDs=await mdAnDataset();
    if(!anTargets){const st=await _loadSetting('cat_analytics_targets');_anTargetsId=st.id;anTargets=mdAnTargetsMerge(st.value);}
    const t=new Date();
    let to=_anClamp(_anDstr(t)), from=_anClamp(_anDstr(new Date(t.getFullYear(),t.getMonth(),1)));
    if(from>to)from=to;
    const f={from:from,to:to,store:'all',city:'all'};
    const ev=mdAnEvaluate(_anCatDs,f,mdAnAggregate(_anCatDs,f),anTargets);
    _anAlert={from:from,to:to,risk:ev.risk.length,watch:ev.watch.length,pairs:ev.pairs,
      stores:ev.storesAtRisk,top:ev.bad.slice(0,5)};
  }catch(e){_anAlert=null;}
  anPaintAlertBadge();
  return _anAlert;
}
function anPaintAlertBadge(){
  const b=document.getElementById('an-alert-badge');
  if(!b)return;
  if(!_anAlert||!_anAlert.risk){b.style.display='none';return;}
  b.style.display='';
  b.textContent='⚠ '+_anAlert.risk;
  b.title=_anAlert.risk+' target check'+(_anAlert.risk===1?'':'s')+' at risk this month across '+_anAlert.pairs+' store–category pair'+(_anAlert.pairs===1?'':'s');
}
// The Overview card. Returns '' when nothing is failing — an always-on banner that usually says
// "fine" is a banner people stop reading.
function anAlertCardHtml(){
  const a=_anAlert;
  if(!a||(!a.risk&&!a.watch))return '';
  const fmt=r=>{
    const f=r.unit==='₹'?mdAnRup:(r.unit==='%'?(v=>mdAnPct(v,true)):mdAnNum);
    return `<tr><td style="padding:5px 8px;font-weight:700">${r.storeLabel}</td><td style="padding:5px 8px">${r.catLabel}</td>
      <td style="padding:5px 8px;color:var(--muted)">${r.metric}</td>
      <td style="padding:5px 8px;text-align:right;font-weight:700">${f(r.actual)}</td>
      <td style="padding:5px 8px;text-align:right;color:var(--muted)">of ${f(r.target)}</td>
      <td style="padding:5px 8px;text-align:right;font-weight:800;color:${MD_AN_LEVELS[r.level].col}">${Math.round(r.pct)}%</td></tr>`;
  };
  return `<div class="card" style="border:1.5px solid ${a.risk?'#e6b3ad':'#e8c97a'};margin-bottom:18px">
    <div class="card-head"><h2 style="color:${a.risk?'var(--red)':'var(--amber)'}">${a.risk?'⚠':'▲'} Category targets — ${a.from.slice(8)}–${a.to.slice(8)} ${['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+a.to.slice(5,7)-1]} ${a.to.slice(0,4)}</h2>
      <button class="btn-primary" style="margin-left:auto" onclick="navigate('analytics');anSetTab('targets')">Open Targets →</button></div>
    <div style="padding:0 4px 6px;font-size:13px;color:var(--muted);line-height:1.6">
      <b style="color:${a.risk?'var(--red)':'var(--amber)'}">${a.risk} check${a.risk===1?'':'s'} at risk</b>${a.watch?` and ${a.watch} to watch`:''}
      across <b>${a.pairs}</b> store–category pair${a.pairs===1?'':'s'}, measured against this month's target pro-rated to ${a.from} → ${a.to}.
      ${a.stores.length?`Stores at risk: <b>${a.stores.map(mdAnStoreLabel).join(', ')}</b>.`:''}
    </div>
    <table style="width:100%;border-collapse:collapse;font-size:12.5px">
      <thead><tr style="text-align:left;color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.4px">
        <th style="padding:5px 8px">Store</th><th style="padding:5px 8px">Category</th><th style="padding:5px 8px">Metric</th>
        <th style="padding:5px 8px;text-align:right">Actual</th><th style="padding:5px 8px;text-align:right">Target</th><th style="padding:5px 8px;text-align:right">Achieved</th>
      </tr></thead><tbody>${a.top.map(fmt).join('')}</tbody></table>
  </div>`;
}

/* ---- OVERVIEW ---- */
async function renderOverview(m){
  m.innerHTML='<div class="loading-row"><span class="spinner"></span></div>';
  const [users,auditActive,installActive]=await Promise.all([
    sbGet('profiles?select=*&order=created_at.desc'),
    sbGet('audit_orders?status=in.(assigned,onway,atsite)&select=id'),
    sbGet('install_orders?status=in.(scheduled,onway,atsite)&select=id'),
  ]);
  const list=Array.isArray(users)?users:[];
  const c={admin:0,service_mgr:0,site_auditor:0,installer:0,auditor_installer:0,store_staff:0,bm:0,coe:0,content_team:0};

let usersCache=[], usersQ='';
async function renderUsers(m){
  m.innerHTML='<div class="loading-row"><span class="spinner"></span></div>';
  const res=await sbGet('profiles?select=*&order=created_at.desc');
  if(!Array.isArray(res)){
    m.innerHTML=`<div class="card" style="padding:24px"><div class="notice">⚠️ Could not load users. Make sure you've run the setup SQL in Supabase.</div></div>`;
    return;
  }
  usersCache=res;
  document.getElementById('users-count').textContent=res.length;
  drawUsersTable(m);
}

  const q=usersQ.toLowerCase();
  const filtered=usersCache.filter(u=>!q||(u.name+u.email+u.role).toLowerCase().includes(q));
  m.innerHTML=`
    <div class="page-head"><h1>Users</h1><p>Manage who has access and what role they hold.</p></div>

      <div class="toolbar">
        <div class="search-wrap">

        <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Passcode</th><th>Added</th><th>Actions</th></tr></thead>
        <tbody>
          ${filtered.length?filtered.map(u=>`
            <tr>
              <td><div style="display:flex;align-items:center;gap:9px"><div class="user-av" style="background:${ROLES[u.role]?.color||'#999'}">${initials(u.name)}</div><b>${u.name}</b></div></td>
              <td style="color:var(--muted);font-family:monospace;font-size:12px">${u.email}</td>
              <td>${roleBadge(u.role)}${u.role==='installer'?`<span style="font-size:11px;color:var(--muted);margin-left:6px">${(u.installer_type||'flooring')==='wallpaper'?'Wallpaper':'Flooring'}</span>`:''}</td>
              <td>${u.passcode?`<code style="background:var(--amberbg);color:var(--amber);border-radius:6px;padding:2px 8px;font-size:13px;font-weight:800">${u.passcode}</code>`:'<span style="color:var(--muted)">—</span>'}</td>
              <td style="color:var(--muted)">${fmtDate(u.created_at)}</td>
              <td><div style="display:flex;gap:6px">
                <button class="btn-icon" onclick='openEditRole(${JSON.stringify(u)})'>✏️ Edit Role</button>
                <button class="btn-icon del" onclick="confirmDelete('${u.id}','${u.name.replace(/'/g,"\\'")}')">🗑</button>
              </div></td>

}

async function submitAddUser(){
  const name=document.getElementById('f-name').value.trim();
  const email=document.getElementById('f-email').value.trim().toLowerCase();
  const role=document.getElementById('f-role').value;
  const err=document.getElementById('f-err');
  const btn=document.getElementById('f-submit');
  err.classList.remove('show');
  if(!name){err.textContent='Please enter a full name.';err.classList.add('show');return;}
  if(!email||!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){err.textContent='Please enter a valid email address.';err.classList.add('show');return;}
  if(!role){err.textContent='Please select a role.';err.classList.add('show');return;}
  const itypeEl=document.getElementById('f-itype');
  const installer_type=(role==='installer'||role==='auditor_installer')&&itypeEl?itypeEl.value:'flooring';
  btn.disabled=true;btn.textContent='Adding…';
  try{
    const cityEl=document.getElementById('f-city');
    await sbPost('profiles',{name,email,role,installer_type,...(CITY_ENABLED&&cityEl?{city:cityEl.value}:{})});
    closeModal();
    toast(`✓ ${name} added as ${ROLES[role]?.label||role}`);
    await renderUsers(document.getElementById('main'));
  }catch(e){
    btn.disabled=false;btn.textContent='Add User';
    const msg=e.message||'';
    err.textContent=msg.includes('unique')||msg.includes('duplicate')?'This email is already added.':msg.includes('violates')||msg.includes('check')?'Role not allowed — ask IT to run the DB constraint update.':msg||'Something went wrong.';
    err.classList.add('show');
  }
}

async function resetPasscode(id,name){

  closeModal();

async function submitEditRole(id,name){
  const role=document.getElementById('e-role').value;
  const itypeEl=document.getElementById('e-itype');
  const isInst=(role==='installer'||role==='auditor_installer');
  const installer_type=isInst&&itypeEl?itypeEl.value:'flooring';
  const cityEl=document.getElementById('e-city');
  // Payout override: numeric fields kept; a fully-blank override is stored as null (falls back to global).
  let pay_rates=undefined;
  if(isInst){
    const rd=eid=>{const el=document.getElementById(eid);if(!el||el.value==='')return null;const v=parseFloat(el.value);return isNaN(v)?null:v;};
    const pr={fl_sqft:rd('e-pr-fl'),wp_std_roll:rd('e-pr-wpstd'),wp_custom_sqft:rd('e-pr-wpcust'),wpnl_sqft:rd('e-pr-wpnl')};
    pay_rates=(pr.fl_sqft==null&&pr.wp_std_roll==null&&pr.wp_custom_sqft==null&&pr.wpnl_sqft==null)?null:pr;
  }
  try{
    await sbPatch('profiles',id,{role,installer_type,...(pay_rates!==undefined?{pay_rates}:{}),...(CITY_ENABLED&&cityEl?{city:cityEl.value}:{})});
    closeModal();
    toast(`✓ ${name}'s role updated to ${ROLES[role]?.label||role}`);
    await renderUsers(document.getElementById('main'));
  }catch(e){
    const msg=e.message||'';
    toast('Error: '+(msg.includes('violates')||msg.includes('check')?'Role not allowed — run the DB constraint update in Supabase SQL Editor.':msg||'Unknown error'));
  }
}

/* ---- ROLE VIEWER ---- */
let rvRole=null, rvPersonEmail=null, rvPersons={}, rvSmTab='audit', rvAiTab='auditor';

async function renderRoleViewer(m){
  m.innerHTML='<div class="loading-row"><span class="spinner"></span></div>';
  const users=await sbGet('profiles?role=neq.admin&select=id,name,email,role&order=name.asc');
  rvPersons={};
  if(Array.isArray(users)) users.forEach(u=>{if(!rvPersons[u.role])rvPersons[u.role]=[];rvPersons[u.role].push(u);});
  drawRoleViewer(m);
}

function drawRoleViewer(m){
  const persons=rvRole?(rvPersons[rvRole]||[]):[];
  let frameHtml='';
  if(rvRole&&!ROLES[rvRole].file&&!['service_mgr','auditor_installer'].includes(rvRole)){
    // A real role that has no dashboard to preview yet. Listed here so Admin can still see
    // who's on the team, but there is nothing to put in the iframe.
    frameHtml=`<div class="card"><div class="empty"><div class="e-ico">${ROLE_ICONS[rvRole]||'👥'}</div>
      <div class="e-msg">${ROLES[rvRole].label} has no dashboard yet — ${persons.length} member${persons.length===1?'':'s'} on the team.</div></div></div>`;
  } else if(rvRole&&rvPersonEmail){
    const p=persons.find(x=>x.email===rvPersonEmail);
    const smTabs=rvRole==='service_mgr'?`<div style="display:flex;gap:8px;margin-bottom:12px">
      <button class="filt-btn${rvSmTab==='audit'?' active':''}" onclick="setSmTab('audit')">Audit Dashboard</button>
      <button class="filt-btn${rvSmTab==='install'?' active':''}" onclick="setSmTab('install')">Install Dashboard</button>
    </div>`:rvRole==='auditor_installer'?`<div style="display:flex;gap:8px;margin-bottom:12px">
      <button class="filt-btn${rvAiTab==='auditor'?' active':''}" onclick="setAiTab('auditor')">Site Auditor App</button>
      <button class="filt-btn${rvAiTab==='installer'?' active':''}" onclick="setAiTab('installer')">Installer App</button>
    </div>`:'';
    frameHtml=smTabs+`<div class="iframe-wrap" id="rv-iframe-wrap">
      <div class="loading-row"><span class="spinner"></span> Loading ${p?p.name+"'s":'their'} view…</div>
    </div>`;
  } else if(rvRole&&!persons.length){
    frameHtml=`<div class="card"><div class="empty"><div class="e-ico">👥</div><div class="e-msg">No ${ROLES[rvRole].label}s found. Add team members in Users.</div></div></div>`;
  } else {
    frameHtml=`<div class="card"><div class="empty"><div class="e-ico">👆</div><div class="e-msg">${rvRole?'Select a person above to view their dashboard':'Select a role above to preview their dashboard'}</div></div></div>`;
  }

  m.innerHTML=`
    <div class="page-head"><h1>Role Viewer</h1><p>Preview exactly what each role sees when they log in.</p></div>
    <div class="role-cards">
      ${['service_mgr','site_auditor','installer','auditor_installer','store_staff','bm','coe','content_team'].map(k=>{
        const cnt=(rvPersons[k]||[]).length;
        return `<div class="role-card${rvRole===k?' active':''}" onclick="setRoleView('${k}')">
          <div class="rc-ico">${ROLE_ICONS[k]}</div>
          <div class="rc-name">${ROLES[k].label}</div>
          <div class="rc-desc">${cnt} ${cnt===1?'member':'members'}</div>
        </div>`;
      }).join('')}
    </div>
    ${rvRole&&persons.length?`<div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap">
      ${persons.map(p=>`<button class="filt-btn${rvPersonEmail===p.email?' active':''}" onclick="setRvPerson('${p.email}')">${p.name}</button>`).join('')}
    </div>`:''}
    <div id="rv-frame">${frameHtml}</div>`;

  if(rvRole&&rvPersonEmail) loadRvIframe();
}

function loadRvIframe(){
  const persons=rvPersons[rvRole]||[];
  const person=persons.find(p=>p.email===rvPersonEmail);
  if(!person) return;
  const wrap=document.getElementById('rv-iframe-wrap');
  if(!wrap) return;
  const file=rvRole==='service_mgr'
    ?(rvSmTab==='audit'?'SM_Audit_Dashboard.html':'SM_Install_Dashboard.html')
    :rvRole==='auditor_installer'
    ?(rvAiTab==='auditor'?'Site_Auditor_App.html':'Site_Installer_App.html')
    :ROLES[rvRole].file;
  if(!file) return;   // role has no dashboard yet — nothing to preview
  // Survives the localStorage restore below, so navigations *within* the preview stay in
  // character — see rvPreviewSession().
  window.__mdRolePreview={name:person.name,email:person.email,role:rvRole};
  const adminSession=localStorage.getItem('md_user');
  localStorage.setItem('md_user',JSON.stringify({name:person.name,email:person.email,role:rvRole}));
  const iframe=document.createElement('iframe');
  iframe.style.cssText='width:100%;height:100%;border:0';
  iframe.onload=()=>{ localStorage.setItem('md_user',adminSession); };
  iframe.src=file;
  wrap.innerHTML='';
  wrap.appendChild(iframe);
}

function setRoleView(k){rvRole=k;rvPersonEmail=null;window.__mdRolePreview=null;drawRoleViewer(document.getElementById('main'));}
function setRvPerson(email){rvPersonEmail=email;drawRoleViewer(document.getElementById('main'));}
function setSmTab(tab){rvSmTab=tab;drawRoleViewer(document.getElementById('main'));}
function setAiTab(tab){rvAiTab=tab;drawRoleViewer(document.getElementById('main'));}

/* ---- JOBS OVERVIEW ---- */
// jobsType (Audit/Install) and jobsFilter (status/stat-tile category) are independent,
// combinable dimensions (added 2026-07-29) — e.g. Unassigned + Audit narrows to just the
// unassigned audits, without losing the Unassigned scope the way a single shared filter would.
let jobsType='all',jobsFilter='all',jobsDateFrom='',jobsDateTo='',jobsSearch='';
// City is a SCOPE, not another filter: the header stat tiles count within it too, so the
// numbers always match their own drill-down (note 82). Seeded from / persisted to the
// app-wide md_city key, same as the Analytics tab, so switching tabs keeps one city.
let jobsCity=localStorage.getItem('md_city')||'all';
function setJobDateFrom(d){jobsDateFrom=d;drawJobs(document.getElementById('main'));}
function setJobDateTo(d){jobsDateTo=d;drawJobs(document.getElementById('main'));}
function clearJobDateRange(){jobsDateFrom='';jobsDateTo='';drawJobs(document.getElementById('main'));}

function _hhmmVal(s){if(!s)return 9999;const r=String(s).match(/^(\d{1,2}):(\d{2})$/);return r?(+r[1])*60+(+r[2]):9999;}
function fmtJobTime(s){if(!s)return '—';const r=String(s).match(/^(\d{1,2}):(\d{2})$/);if(!r)return s;const h=+r[1],mn=+r[2],ap=h>=12?'PM':'AM',h12=h%12||12;return h12+':'+(mn<10?'0':'')+mn+' '+ap;}
let _realJobsAudit=[], _realJobsInstall=[], _jobsAuditFailed=false, _jobsInstallFailed=false;
async function _loadJobsData(m){
  // Re-probe while disabled so a transient boot-probe failure self-heals on the next poll
  // instead of hiding the city column for the whole session (the Store Team / SM pattern).
  if(!CITY_ENABLED)await detectCity();
  const cityCol=CITY_ENABLED?',city':'';
  const [auditRes,installRes,profileRes]=await Promise.all([
    sbGet('audit_orders?select=pi,customer_name,addr,auditor_name,auditor_email,status,date,slot'+cityCol+'&status=not.in.(deleted,slot_reserved,slot_converted)&order=created_at.desc'),
    sbGetLong('install_orders_slim?select=pi,customer_name,addr,subjobs,status,delivery_date'+cityCol+'&status=neq.deleted&order=created_at.desc'),
    sbGet('profiles?select=name,email&role=neq.admin'),
  ]);
  if(Array.isArray(profileRes)) profileRes.forEach(p=>{_jobsNameMap[p.email]=p.name;});

  if(Array.isArray(auditRes)){
    _realJobsAudit=auditRes.map(r=>({
      id:r.pi||'—', type:'audit',
      customer:r.customer_name||'—', addr:r.addr||'—',
      assignee:r.auditor_name||(r.auditor_email?_jobsNameMap[r.auditor_email]:null),
      status:r.status||'pending', date:r.date||null, time:r.slot||null,
      city:r.city||null,
    }));
    _jobsAuditFailed=false;
  }else{
    console.error('[_loadJobsData] audit_orders fetch failed (non-array response) — keeping last known audit jobs',auditRes);
    if(!_jobsAuditFailed){toast('⚠ Could not refresh site audit jobs — showing last known data');_jobsAuditFailed=true;}
  }

  if(Array.isArray(installRes)){
    _realJobsInstall=installRes.map(r=>{
      const emails=[...new Set((r.subjobs||[]).flatMap(sj=>{
        if(sj.assignments&&sj.assignments.length)return sj.assignments.map(a=>a.installer_email).filter(Boolean);
        return sj.installer_email?[sj.installer_email]:[];
      }))];
      const installDates=[...new Set((r.subjobs||[]).flatMap(sj=>{
        const asgns=sj.assignments&&sj.assignments.length?sj.assignments:(sj.installer?[{date:sj.date,mode:'standard',dates:[]}]:[]);
        return asgns.flatMap(a=>a.mode==='custom'?(a.dates||[]):(a.date?[a.date]:[]));
      }))];
      const times=[...new Set((r.subjobs||[]).flatMap(sj=>{
        const asgns=sj.assignments&&sj.assignments.length?sj.assignments:(sj.slot?[{slots:[sj.slot]}]:[]);
        return asgns.flatMap(a=>a.slots||[]);
      }))];
      const time=times.length?times.reduce((min,t)=>_hhmmVal(t)<_hhmmVal(min)?t:min):null;
      return {
        id:r.pi||'—', type:'install',
        customer:r.customer_name||'—', addr:r.addr||'—',
        assignee:emails.length?emails.map(e=>_jobsNameMap[e]||e.split('@')[0]).join(', '):null,
        status:r.status||'pending', date:r.delivery_date||null, time,
        city:r.city||null,
        installDates,
      };
    });
    _jobsInstallFailed=false;
  }else{
    console.error('[_loadJobsData] install_orders_slim fetch failed (non-array response) — keeping last known install jobs',installRes);
    if(!_jobsInstallFailed){toast('⚠ Could not refresh installation jobs — showing last known data');_jobsInstallFailed=true;}
  }

  realJobs=_realJobsAudit.concat(_realJobsInstall);
  if(m)drawJobs(m);
}

async function renderJobs(m){
  m.innerHTML='<div class="loading-row"><span class="spinner"></span></div>';
  await _loadJobsData(m);
  if(_jobsPollTid)clearInterval(_jobsPollTid);
  _jobsPollTid=setInterval(()=>{
    if(currentView==='jobs'&&!document.hidden)_loadJobsData(document.getElementById('main'));
  },30000);
}

// City scope, applied before everything else — including the header stat-tile counts, so a
// tile's number always equals the row count you get by clicking it. Rows with no city yet
// (pre-migration orders) read as Bengaluru, matching how the Analytics tab treats them.
function cityScopedJobs(){
  if(!CITY_ENABLED||jobsCity==='all')return realJobs;
  return realJobs.filter(j=>(j.city||'Bengaluru')===jobsCity);
}
function getFilteredJobs(){
  return cityScopedJobs().filter(j=>{
    if(jobsType==='audit')return j.type==='audit';
    if(jobsType==='install')return j.type==='install';
    return true;
  }).filter(j=>{
    if(jobsFilter==='active')return ['assigned','onway','atsite','scheduled'].includes(j.status);
    if(jobsFilter==='unassigned')return !j.assignee;
    if(JOB_STATUS[jobsFilter])return j.status===jobsFilter;
    return true;
  }).filter(j=>{
    if(!jobsDateFrom&&!jobsDateTo)return true;
    const dates=j.type==='audit'?(j.date?[j.date]:[]):(j.installDates||[]);
    if(!dates.length)return false;
    return dates.some(d=>(!jobsDateFrom||d>=jobsDateFrom)&&(!jobsDateTo||d<=jobsDateTo));
  }).filter(j=>{
    if(!jobsSearch)return true;
    const q=jobsSearch.toLowerCase();
    return j.id.toLowerCase().includes(q)||j.customer.toLowerCase().includes(q);
  }).sort((a,b)=>_hhmmVal(a.time)-_hhmmVal(b.time));
}
function _csvEscape(v){const s=String(v==null?'':v);return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}
function downloadJobsCSV(){
  const rows=getFilteredJobs();
  if(!rows.length){toast('No jobs to export for the current filters');return;}
  const header=['Job ID','Type','Customer'].concat(CITY_ENABLED?['City']:[]).concat(['Location','Assigned To','Status','Time','Date']);
  const lines=[header.join(',')].concat(rows.map(j=>[
    j.id,j.type==='audit'?'Audit':'Install',j.customer
  ].concat(CITY_ENABLED?[j.city||'']:[]).concat([
    j.addr,j.assignee||'Unassigned',JOB_STATUS[j.status]?.l||j.status,fmtJobTime(j.time),j.date||''
  ]).map(_csvEscape).join(',')));
  const blob=new Blob(['﻿'+lines.join('\r\n')],{type:'text/csv;charset=utf-8;'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='job-overview'+(jobsDateFrom||jobsDateTo?`_${jobsDateFrom||'start'}_to_${jobsDateTo||'end'}`:'')+'.csv';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

function drawJobs(m){
  const scoped=cityScopedJobs();
  const jc={total:scoped.length,active:0,done:0,unassigned:0};
  scoped.forEach(j=>{
    if(['assigned','onway','atsite','scheduled'].includes(j.status))jc.active++;
    if(j.status==='completed')jc.done++;
    if(!j.assignee)jc.unassigned++;
  });
  const filtered=getFilteredJobs();

  m.innerHTML=`
    <div class="page-head"><h1>Jobs Overview</h1><p>All audit and installation jobs across your team.</p></div>
    <div class="stats" style="grid-template-columns:repeat(auto-fit,minmax(130px,1fr))">
      <div class="stat-card clickable${jobsType==='all'&&jobsFilter==='all'?' active':''}" onclick="setJobStatFilter('all')"><div class="val">${jc.total}</div><div class="lbl">Total Jobs</div></div>
      <div class="stat-card clickable${jobsType==='all'&&jobsFilter==='active'?' active':''}" onclick="setJobStatFilter('active')"><div class="val">${jc.active}</div><div class="lbl">Active Now</div></div>
      <div class="stat-card clickable${jobsType==='all'&&jobsFilter==='completed'?' active':''}" onclick="setJobStatFilter('completed')"><div class="val">${jc.done}</div><div class="lbl">Completed</div></div>
      <div class="stat-card clickable${jobsType==='all'&&jobsFilter==='unassigned'?' active':''}" onclick="setJobStatFilter('unassigned')"><div class="val">${jc.unassigned}</div><div class="lbl">Unassigned</div></div>
    </div>
    ${!realJobs.length?'<div class="card"><div class="empty"><div class="e-ico">📋</div><div class="e-msg">No jobs yet — orders will appear here once Service Managers start adding them.</div></div></div>':`
    <div class="card">
      <div class="toolbar">
        <div class="search-wrap" style="max-width:280px;min-width:180px;flex-shrink:0">
          <span class="search-ico">🔍</span>
          <input id="jobsSearchInput" type="text" placeholder="Search Enquiry ID or customer…" value="${jobsSearch}" oninput="jobsSearch=this.value;drawJobs(document.getElementById('main'))">
        </div>
        <div style="display:flex;gap:6px;flex-wrap:wrap">
          ${['all','audit','install'].map(t=>`
            <button class="filt-btn${jobsType===t?' active':''}" onclick="setJobType('${t}')">
              ${t==='all'?'All Types':t==='audit'?'Audit':'Install'}
            </button>`).join('')}
          ${CITY_ENABLED?`<span style="width:1px;background:var(--line);margin:2px 4px"></span>
          ${['all','Bengaluru','Hyderabad'].map(c=>`
            <button class="filt-btn${jobsCity===c?' active':''}" onclick="setJobCity('${c}')">
              ${c==='all'?'All Cities':c}
            </button>`).join('')}`:''}
          <span style="width:1px;background:var(--line);margin:2px 4px"></span>
          ${['all','active','unassigned','pending','assigned','scheduled','onway','atsite','completed','reschedule'].map(f=>`
            <button class="filt-btn${jobsFilter===f?' active':''}" onclick="setJobFilter('${f}')">
              ${f==='all'?'All Jobs':f==='active'?'Active Now':f==='unassigned'?'Unassigned':JOB_STATUS[f]?.l||f}
            </button>`).join('')}
        </div>
        <div style="display:flex;align-items:center;gap:6px;margin-left:auto;flex-shrink:0;flex-wrap:wrap">
          <input type="date" value="${jobsDateFrom}" title="From date" onchange="setJobDateFrom(this.value)" style="border:1.5px solid ${jobsDateFrom?'var(--blue)':'var(--line)'};border-radius:9px;padding:6px 10px;font-size:13px;font-weight:600;color:${jobsDateFrom?'var(--navy)':'var(--muted)'};background:#fff;cursor:pointer;outline:none">
          <span style="color:var(--muted);font-size:12px">to</span>
          <input type="date" value="${jobsDateTo}" title="To date" onchange="setJobDateTo(this.value)" style="border:1.5px solid ${jobsDateTo?'var(--blue)':'var(--line)'};border-radius:9px;padding:6px 10px;font-size:13px;font-weight:600;color:${jobsDateTo?'var(--navy)':'var(--muted)'};background:#fff;cursor:pointer;outline:none">
          ${(jobsDateFrom||jobsDateTo)?`<button onclick="clearJobDateRange()" style="border:0;background:var(--redbg);color:var(--red);border-radius:7px;padding:5px 10px;font-weight:800;font-size:12px;cursor:pointer;white-space:nowrap">✕ Clear</button>`:''}
          <button onclick="downloadJobsCSV()" style="border:0;background:var(--navy);color:#fff;border-radius:7px;padding:6px 12px;font-weight:800;font-size:12px;cursor:pointer;white-space:nowrap">⬇ Download CSV</button>
        </div>
      </div>
      <table>
        <thead><tr><th>Job ID</th><th>Type</th><th>Customer</th>${CITY_ENABLED?'<th>City</th>':''}<th>Location</th><th>Assigned To</th><th>Status</th><th>Time</th><th>Date</th></tr></thead>
        <tbody>
          ${filtered.length?filtered.map(j=>`
            <tr style="cursor:pointer" onclick="openJobDetail('${j.id}','${j.type}')">
              <td><b style="font-family:monospace;font-size:12px;color:var(--navy)">${j.id}</b></td>
              <td><span style="background:${j.type==='audit'?'#fff4d6':'var(--greenbg)'};color:${j.type==='audit'?'#7a5800':'var(--green)'};border-radius:6px;padding:3px 8px;font-size:11px;font-weight:800">${j.type==='audit'?'Audit':'Install'}</span></td>
              <td><b>${j.customer}</b></td>
              ${CITY_ENABLED?`<td style="font-size:12px">${j.city||'<span style="color:var(--muted)">—</span>'}</td>`:''}
              <td style="color:var(--muted);font-size:12px">${j.addr}</td>
              <td>${j.assignee||'<span style="color:var(--red);font-weight:700">Unassigned</span>'}</td>
              <td>${jobChip(j.status)}</td>
              <td style="color:var(--muted)">${fmtJobTime(j.time)}</td>
              <td style="color:var(--muted)">${j.date||'—'}</td>
            </tr>`).join('')
          :`<tr><td colspan="${CITY_ENABLED?9:8}"><div class="empty"><div class="e-ico">🔍</div><div class="e-msg">No jobs match this filter</div></div></td></tr>`}
        </tbody>
      </table>
    </div>`}`;
  if(jobsSearch){const si=document.getElementById('jobsSearchInput');if(si){si.focus();si.setSelectionRange(jobsSearch.length,jobsSearch.length);}}
}
function setJobFilter(f){jobsFilter=f;drawJobs(document.getElementById('main'));}
// Type (Audit/Install) is a separate, combinable dimension from the status pills above — doesn't
// reset jobsFilter/date/search, so e.g. picking Audit while already on the Unassigned tab narrows
// to just the unassigned audits instead of replacing the Unassigned scope entirely.
function setJobType(t){jobsType=t;drawJobs(document.getElementById('main'));}
// City is a SCOPE rather than a pill filter: it also narrows the 4 header numbers, so it is
// deliberately NOT cleared by a stat-card click (unlike type/date/search below). Persisted to
// the app-wide md_city key so the Analytics tab and the SM dashboards stay on the same city.
function setJobCity(c){jobsCity=c;localStorage.setItem('md_city',c);drawJobs(document.getElementById('main'));}
// Stat-card clicks: the 4 header numbers are computed over every job in the current CITY scope,
// across both types (see jc in drawJobs), so jumping to one of them also resets the type filter
// and clears any active date range/search — otherwise clicking "380 Total Jobs" while, say, Audit
// was still selected would show fewer than 380 rows.
function setJobStatFilter(f){jobsFilter=f;jobsType='all';jobsDateFrom='';jobsDateTo='';jobsSearch='';drawJobs(document.getElementById('main'));}
function setJobSearch(v){jobsSearch=v;drawJobs(document.getElementById('main'));}

/* ---- JOB DETAIL MODAL ---- */
/* Legacy on-screen audit field dicts removed (note 98) — jdRoomCard now uses mdAuditRoomHtml. */
function jdRoomCard(r,i){return mdAuditRoomHtml(r,i);}
function fmtLog(d){if(!d)return '—';const dt=new Date(d);if(isNaN(dt.getTime())){const m=String(d).match(/\d{1,2}:\d{2}\s*(?:[AP]M)?/i);return m?m[0]+' (date unknown)':'—';}const ts=dt.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});return dt.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})+' · '+ts;}
function jdLog(log){return(log||[]).slice().reverse().slice(0,10).map(l=>{
  const mapLink=l.lat&&l.lng?`<a href="https://maps.google.com/?q=${l.lat},${l.lng}" target="_blank" rel="noopener" style="color:var(--blue);font-size:11px;margin-left:6px">📍 Map</a>`:'';
  const photo=l.arrivalPhoto?`<img src="${l.arrivalPhoto}" style="width:56px;height:42px;object-fit:cover;border-radius:5px;margin-top:5px;display:block;cursor:pointer" onclick="window.open(this.src)" alt="Arrival photo">`:'';
  return `<div class="jd-tl"><div class="jd-tl-t">${(l.who?'<span style="color:var(--navy);font-weight:800">'+l.who+'</span> &middot; ':'')+l.t+mapLink}</div><div class="jd-tl-d">${fmtLog(l.d)}${l.by==='auto'?' · installer/auditor':l.by==='manual'?' · SM':''}</div>${photo}</div>`;
}).join('');}
// Read-only mirror of SM_Install_Dashboard.html's custom wallpaper production stepper (note 62).
// Admin never advances stages — view only — so this only needs to render, not wire buttons.
const CWP_STAGES_RO=[
  {k:"placed",l:"Order Placement"},{k:"draft",l:"Draft Generation"},
  {k:"approval",l:"Customer Approval"},{k:"warehouse",l:"At Warehouse"},
  {k:"delivsched",l:"Delivery Schedule"},{k:"deliv",l:"Delivery"},{k:"install",l:"Installation"}
];
const CWP_STAGE_RANK_RO={draft:1,approval:2,warehouse:3};
function adminCwpSection(o){
  const stage=o.custom_wp_stage||'draft';const meta=o.custom_wp_meta||{};
  const subjobs=o.subjobs||[];
  const terminal=stage==='warehouse'&&!!meta.warehouseReceivedAt;
  const backHalfDone=k=>{
    if(k==='delivsched')return !!o.delivery_date;
    if(k==='deliv')return !['pending','call_na','deliv_delayed'].includes(o.status);
    if(k==='install')return !!(subjobs.length&&subjobs.every(sj=>sj.status==='completed'));
    return false;
  };
  const nodes=CWP_STAGES_RO.map(s=>{
    let state='';
    if(s.k==='placed')state='done';
    else if(CWP_STAGE_RANK_RO[s.k]){
      if(terminal)state='done';
      else if(CWP_STAGE_RANK_RO[stage]>CWP_STAGE_RANK_RO[s.k])state='done';
      else if(stage===s.k)state='cur';
    } else state=backHalfDone(s.k)?'done':'';
    return {...s,state};
  });
  const dotStyle=(st)=>st==='done'?'background:var(--green,#1f7a3f);color:#fff':st==='cur'?'background:var(--navy,#1F3A5F);color:#fff':'background:#e4e8f0;color:#67748a';
  const track=nodes.map((n,i)=>`${i>0?`<div style="flex:0 0 16px;height:2px;margin-top:9px;background:${nodes[i-1].state==='done'?'var(--green,#1f7a3f)':'#e4e8f0'}"></div>`:''}<div style="display:flex;flex-direction:column;align-items:center;flex:0 0 74px;font-size:9.5px;text-align:center;font-weight:700;color:${n.state==='done'?'var(--green,#1f7a3f)':n.state==='cur'?'var(--navy,#1F3A5F)':'#67748a'}"><div style="width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;margin-bottom:5px;${dotStyle(n.state)}">${n.state==='done'?'&#10003;':i+1}</div>${n.l}</div>`).join('');
  const renderPreview=meta.renderUrl?(meta.renderIsImage?`<img src="${meta.renderUrl}" style="max-width:160px;border-radius:8px;margin-top:8px;display:block">`:`<a href="${meta.renderUrl}" target="_blank" rel="noopener" style="font-size:12px">View render link</a>`):'';
  return `<div class="jd-section"><div class="jd-sec-head">Custom Wallpaper Journey</div>
    <div style="display:flex;align-items:flex-start;gap:0;margin:8px 0;overflow-x:auto">${track}</div>
    <div class="jd-row"><span class="jd-label">Vendor</span><span>${meta.vendor||'—'}</span></div>
    <div class="jd-row"><span class="jd-label">Revisions</span><span>${meta.revisionCount||0}</span></div>
    ${renderPreview}
    ${terminal?`<div style="font-size:12px;color:var(--green,#1f7a3f);margin-top:6px">&#10003; Received at warehouse on ${fmtLog(meta.warehouseReceivedAt)}</div>`:''}
  </div>`;
}
async function openJobDetail(pi,type){
  const m=document.getElementById('modal');m.className='modal wide';
  showModal('<div class="loading-row" style="padding:40px 0"><span class="spinner"></span></div>');
  try{
    const fdt=ds=>{if(!ds)return '—';const d=new Date(ds+'T00:00');return d.toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short',year:'numeric'});};
    if(type==='audit'){
      const rows=await sbGet('audit_orders?pi=eq.'+encodeURIComponent(pi)+'&select=*&limit=1');
      if(!Array.isArray(rows)||!rows[0]){showModal('<div style="padding:24px">Order not found.</div>');return;}
      const o=rows[0];const at=o.audit_ticked;
      const rooms=(at&&at.rooms)||[];
      const hasSign=at&&at.sign&&at.sign.img;
      const isDraft=at&&!Array.isArray(at)&&at.draft&&!hasSign;
      const hasCard=rooms.length||hasSign;
      const history=Array.isArray(o.audit_ticked_history)?o.audit_ticked_history:[];
      window._jdAudit={order:o,ticked:at};
      window._jdAuditHistory=history;
      const roomsHtml=rooms.map((r,i)=>jdRoomCard(r,i)).join('');
      const signHtml=hasSign?`<div style="font-size:13px;margin-top:6px">Signed by <b>${at.sign.name||'—'}</b>${at.sign.ratings?` · ⭐ ${at.sign.ratings.q1}/10 · 👤 ${at.sign.ratings.q2}/10 · 🧹 ${at.sign.ratings.q3||'—'}/10`:''}</div>`:'';
      const jcSection=isDraft
        ?`<div class="jd-section"><div class="jd-sec-head" style="color:var(--amber)">⚠️ Job Card Draft — ${rooms.length} room${rooms.length!==1?'s':''} recorded, client sign-off not yet completed</div>${history.length?`<div style="font-size:12.5px;color:var(--amber);margin-bottom:8px">This order was previously completed and signed — see Completed Job Card History below.</div>`:''}${roomsHtml}</div>`
        :rooms.length?`<div class="jd-section"><div class="jd-sec-head">Job Card — ${rooms.length} room${rooms.length!==1?'s':''} audited</div>${roomsHtml}${signHtml}</div>`
        :'<div class="jd-section" style="color:var(--muted);font-size:13px">No job card data found for this order.</div>';
      const historyHtml=history.length?`<div class="jd-section"><div class="jd-sec-head">📜 Completed Job Card History (${history.length})</div>
        ${history.map((h,i)=>i).reverse().map(idx=>{const h=history[idx];const dt=h.archivedAt?new Date(h.archivedAt).toLocaleString('en-IN',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}):'—';
          return `<div class="jd-row" style="align-items:center">
            <span class="jd-label">${dt}</span>
            <span>Signed by <b>${(h.sign&&h.sign.name)||'—'}</b> · ${(h.rooms||[]).length} room(s)${h.sign&&h.sign.ratings?` · ⭐ ${h.sign.ratings.q1}/10`:''}
              <button class="btn-ghost" style="font-size:11px;padding:4px 8px;margin-left:8px" onclick="downloadHistoricalPDF(${idx})">📥 PDF</button>
            </span>
          </div>`;}).join('')}
        </div>`:'';
      // Customer Journey (BM Dashboard) — read-only here; BM/SM add entries from their own dashboards.
      const journeyHtml=(Array.isArray(o.bm_journey)&&o.bm_journey.length)?`<div class="jd-section"><div class="jd-sec-head">🧭 Customer Journey</div>${window.mdJourneyHtml(o.bm_journey)}</div>`:'';
      document.getElementById('modal').innerHTML=`

async function renderPerf(m){
  m.innerHTML='<div class="loading-row"><span class="spinner"></span></div>';
  const [usersRes,auditRes,installRes]=await Promise.all([
    sbGet('profiles?select=*&role=neq.admin&order=name.asc'),
    sbGet('audit_orders?select=auditor_email,status,created_at,created_by_email&status=not.in.(deleted,slot_reserved,slot_converted)'),
    sbGet('install_orders?select=subjobs,status,created_at,created_by_email'),
  ]);
  const field=Array.isArray(usersRes)?usersRes.filter(u=>u.role!=='admin'):[];
  if(!field.length){
    m.innerHTML=`<div class="page-head"><h1>Performance</h1></div><div class="card"><div class="empty"><div class="e-ico">📊</div><div class="e-msg">No field staff found. Add users with Site Auditor or Installer roles first.</div></div></div>`;
    return;
  }
  const auditOrders=Array.isArray(auditRes)?auditRes:[];
  const installOrders=Array.isArray(installRes)?installRes:[];
  const now=new Date();
  const ym=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;

  const statsFor=u=>{
    if(u.role==='site_auditor'||u.role==='auditor_installer'){
      const mine=auditOrders.filter(o=>o.auditor_email===u.email);
      const atotal=mine.length, adone=mine.filter(o=>o.status==='completed').length;
      const amonthly=mine.filter(o=>(o.created_at||'').startsWith(ym)).length;
      if(u.role==='site_auditor') return {total:atotal,done:adone,pending:atotal-adone,monthly:amonthly,pct:atotal?Math.round(adone/atotal*100):0};
      // auditor_installer: combine audit + install stats
      let itotal=0,idone=0,imonthly=0;
      installOrders.forEach(o=>{
        (o.subjobs||[]).forEach(sj=>{
          const asgn=sj.assignments||[];
          const inAsgn=asgn.length?asgn.some(a=>a.installer_email===u.email):sj.installer_email===u.email;
          if(inAsgn){itotal++;if(sj.status==='completed')idone++;if((o.created_at||'').startsWith(ym))imonthly++;}
        });
      });
      const total=atotal+itotal,done=adone+idone,monthly=amonthly+imonthly;
      return {total,done,pending:total-done,monthly,pct:total?Math.round(done/total*100):0};
    }
    if(u.role==='installer'){
      let total=0,done=0,monthly=0;
      installOrders.forEach(o=>{
        (o.subjobs||[]).forEach(sj=>{
          if(sj.installer_email===u.email){
            total++;
            if(sj.status==='completed')done++;
            if((o.created_at||'').startsWith(ym))monthly++;
          }
        });
      });
      return {total,done,pending:total-done,monthly,pct:total?Math.round(done/total*100):0};
    }
    // service_mgr: orders they created
    const myA=auditOrders.filter(o=>o.created_by_email===u.email);
    const myI=installOrders.filter(o=>o.created_by_email===u.email);
    const total=myA.length+myI.length;
    const done=myA.filter(o=>o.status==='completed').length+myI.filter(o=>o.status==='completed').length;
    const monthly=myA.filter(o=>(o.created_at||'').startsWith(ym)).length+myI.filter(o=>(o.created_at||'').startsWith(ym)).length;
    return {total,done,pending:total-done,monthly,pct:total?Math.round(done/total*100):0};
  };

  m.innerHTML=`
    <div class="page-head"><h1>Performance</h1><p>Completion stats per team member, computed from live order data.</p></div>
    <div class="perf-grid">
      ${field.map(u=>{
        const color=ROLES[u.role]?.color||'#999';
        const s=statsFor(u);
        const pctColor=s.pct>=90?'var(--green)':s.pct>=75?'var(--amber)':'var(--red)';
        const pctDisplay=s.total?s.pct+'%':'—';
        return `<div class="perf-card">
          <div class="pc-head">
            <div class="pc-av" style="background:${color}">${initials(u.name)}</div>
            <div><div class="pc-name">${u.name}</div><div class="pc-role">${ROLES[u.role]?.label||u.role}</div></div>
          </div>
          <div class="perf-row"><span>Total Jobs</span><span class="pr-val">${s.total}</span></div>
          <div class="perf-row"><span>Completed</span><span class="pr-val" style="color:var(--green)">${s.done}</span></div>
          <div class="perf-row"><span>Pending</span><span class="pr-val" style="color:var(--amber)">${s.pending}</span></div>
          <div class="perf-row"><span>This Month</span><span class="pr-val">${s.monthly}</span></div>
          <div class="perf-row"><span>Completion Rate</span><span class="pr-val" style="color:${s.total?pctColor:'var(--muted)'}">${pctDisplay}</span></div>
          ${s.total?`<div style="height:5px;background:var(--line);border-radius:5px;margin-top:10px;overflow:hidden">
            <div style="height:100%;width:${s.pct}%;background:${pctColor};border-radius:5px;transition:width .5s"></div>
          </div>`:''}
        </div>`;
      }).join('')}
    </div>`;
}

function imgFmtA(d){if(/webp/i.test(d.slice(0,20)))return 'WEBP';return /png/i.test(d.slice(0,20))?'PNG':'JPEG';}
function renderSketchA(r){
  if(!r.sketchStrokes||!r.sketchStrokes.length)return null;
  const W=1000,H=500;const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
  x.fillStyle='#fff';x.fillRect(0,0,W,H);const s=Math.round(22*(W/360));x.fillStyle='#b2b8c1';
  for(let yy=s;yy<H;yy+=s)for(let xx=s;xx<W;xx+=s){x.beginPath();x.arc(xx,yy,2,0,7);x.fill();}
  x.strokeStyle='#1F3A5F';x.lineWidth=3.2;x.lineJoin='round';x.lineCap='round';
  for(const st of r.sketchStrokes){if(st.length<1)continue;x.beginPath();st.forEach((p,i)=>{const X=p.x*W,Y=p.y*H;i?x.lineTo(X,Y):x.moveTo(X,Y);});x.stroke();}
  return c.toDataURL('image/jpeg',0.85);
}
function fmtDateA(ds){if(!ds)return '—';const d=new Date(ds+'T00:00');return d.toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'});}
async function _compressAdmin(dataUrl){
  if(!dataUrl)return null;
  return new Promise(res=>{const im=new Image();if(dataUrl.startsWith('http'))im.crossOrigin='anonymous';im.onload=()=>{try{const s=Math.min(1,1600/Math.max(im.width,im.height));const w=Math.round(im.width*s),h=Math.round(im.height*s);const cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(im,0,0,w,h);res(cv.toDataURL('image/jpeg',0.88));}catch(e){res(null);}};im.onerror=()=>res(null);im.src=dataUrl;});
}

/* ---- ANALYTICS V2 ---- */
// Site Audit and Site Installation each get their own independent date range (added 2026-07-29,
// CLAUDE.md note 77) — they used to share one analyticsFrom/analyticsTo pair, which forced picking
// a single range for both sections even though an SM/admin often wants to look at a different
// window for each (e.g. audits this week vs installs this month).
let analyticsAuditFrom='', analyticsAuditTo='', analyticsInstallFrom='', analyticsInstallTo='', _anPollTid=null;
// Analytics city segregation (Bengaluru/Hyderabad) — 'all' | 'Bengaluru' | 'Hyderabad'. Scopes BOTH
// the Site Audit and Site Installation sections. Persisted to the app-wide md_city key so an SM who
// picked a city in the SM dashboards lands here on the same city. Only honoured when CITY_ENABLED.
let analyticsCity=(function(){try{return localStorage.getItem('md_city')||'all';}catch(e){return 'all';}})();
function setAnalyticsCity(c){anSetCity(c);}

function _anDstr(d){const z=n=>n<10?'0'+n:n;return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate());}
function _anToIST(iso){return new Date(new Date(iso).getTime()+19800000);}
function _anDateIST(iso){return _anToIST(iso).toISOString().substring(0,10);}
function _anMinsIST(iso){const d=_anToIST(iso);return d.getUTCHours()*60+d.getUTCMinutes();}
function _anParseDateText(text){
  const m=text.match(/(\d{1,2})\s+(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\s+(\d{4})/i);
  if(!m)return null;
  const mn={jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
  return _anDstr(new Date(+m[3],mn[m[2].toLowerCase()],+m[1]));
}

// Fetches fresh analytics data into window._anData. Returns true on success, false on failure —
// never touches the DOM itself, so it's safe to call silently from the background poll below as
// well as from the initial renderAnalytics load. All-time arrays (installs/audits) are always
// fetched in full regardless of the selected date range, since several metrics (Material Depot
// Audit %, Site Audit → Order Conversion %) intentionally phone-match against all-time data —
// re-running this later is what lets a conversion that only happens days after the audit show up.
/* ============================================================================
   INSTALLER PAYOUTS  (plan: ~/.claude/plans/payout-foam-slot-cutoff.md)
   Self-contained on purpose — does NOT reuse _anInstallCanon/_anInstallerMap:
   those credit the FULL sqft to every co-installer and treat 'partial' as
   not-done. Payout instead splits a job's area EQUALLY across co-assigned
   installers (600 sqft / 3 installers = 200 each) and pays partial work too.
   ============================================================================ */
let payoutFrom='', payoutTo='', payoutCity='all';
const _PAY_DEF={fl_sqft:0,wp_std_roll:0,wp_custom_sqft:0,wpnl_sqft:0};
let _payoutGlobal={..._PAY_DEF}, _payoutGlobalId=null, _payoutOverrides={};

// app_settings is a tiny key→jsonb table (see the SQL in the plan). knownId lets a re-save skip the lookup.
async function _loadSetting(key){
  try{const r=await sbGet('app_settings?key=eq.'+encodeURIComponent(key)+'&select=id,value');
    if(Array.isArray(r)&&r.length)return{id:r[0].id,value:r[0].value||{}};}catch(e){}
  return{id:null,value:{}};
}
async function _saveSetting(key,value,knownId){
  if(knownId){await sbPatch('app_settings',knownId,{value,updated_at:new Date().toISOString()});return knownId;}
  const ex=await sbGet('app_settings?key=eq.'+encodeURIComponent(key)+'&select=id').catch(()=>null);
  if(Array.isArray(ex)&&ex.length){await sbPatch('app_settings',ex[0].id,{value,updated_at:new Date().toISOString()});return ex[0].id;}
  const c=await sbPost('app_settings',{key,value});return Array.isArray(c)&&c[0]?c[0].id:null;
}

// A wallpaper sub-job is custom if its own flag is set (split/mixed orders), else the order-level flag.
function _payIsCustomWp(o,sj){if(sj.type!=='wallpaper')return false;if(sj.customWp!==undefined&&sj.customWp!==null)return !!sj.customWp;return !!o.custom_wp;}
// Real assignments; else a legacy single-installer sub-job; else nobody (unassigned — no one to pay).
function _payAssignments(sj){
  if(Array.isArray(sj.assignments)&&sj.assignments.length)return sj.assignments;
  if(sj.installer_email||sj.installer||sj.installer_name)return[{installer_email:sj.installer_email||'',installer_name:sj.installer_name||sj.installer||''}];
  return[];
}
// Effective ₹ rate for an installer+field = their per-person override if numeric, else the global default.
function _payRate(email,name,field){
  const ov=_payoutOverrides[(email||'').toLowerCase()]||_payoutOverrides['name:'+(name||'').toLowerCase()];
  if(ov&&ov[field]!=null&&ov[field]!==''&&!isNaN(+ov[field]))return +ov[field];
  return +(_payoutGlobal[field]||0);
}
// One row per DONE sub-job (completed OR partial) whose completion date lands in [from,to].
// Completion date = the max "…installation (partially )completed" log entry (IST); falls back to
// partialAt, then the latest scheduled date. (Orders created before 2026-07-01 carry no log in
// _anData — same accepted analytics limitation — and fall back to scheduled date.)
function _payoutRows(installs,from,to,city){
  const rows=[];
  for(const o of installs){
    if(city&&city!=='all'&&(o.city||'Bengaluru')!==city)continue;
    for(const sj of(o.subjobs||[])){
      if(sj.status!=='completed'&&sj.status!=='partial')continue;
      const isPartial=sj.status==='partial';
      const key=(sj.type==='wallpaper'?'Wallpaper':sj.type==='wallpanel'?'Wall Panels':'Flooring')+' installation '+(isPartial?'partially completed':'completed');
      let cd=null;
      for(const l of(o.log||[])){if(l.t&&l.d&&l.t.startsWith(key)){const d=_anDateIST(l.d);if(!cd||d>cd)cd=d;}}
      if(!cd&&isPartial&&sj.jobcard&&sj.jobcard.partialAt)cd=_anDateIST(sj.jobcard.partialAt);
      if(!cd){const sc=[];if(sj.date)sc.push(sj.date);for(const a of(sj.assignments||[])){if(a.mode==='custom')(a.dates||[]).forEach(d=>sc.push(d));else if(a.date)sc.push(a.date);}cd=sc.length?sc.sort().slice(-1)[0]:null;}
      if(!cd||cd<from||cd>to)continue;
      rows.push({o,sj,date:cd,isPartial});
    }
  }
  return rows;
}
// Sum per installer. Area/rolls are split equally across the sub-job's co-assigned installers.
function _payoutAggregate(rows){
  const map={};
  for(const r of rows){
    const sj=r.sj,o=r.o,asg=_payAssignments(sj);
    if(!asg.length)continue;
    const n=asg.length;
    const totalSqft=(sj.items||[]).reduce((s,it)=>s+(parseFloat(it.sqft)||0),0);
    const totalRolls=(sj.items||[]).reduce((s,it)=>{const q=parseFloat(it.sqft)||0;return s+(q?Math.ceil(q/SQFT_PER_ROLL):0);},0);
    const shareSqft=totalSqft/n, shareRolls=totalRolls/n;
    const isFl=sj.type==='flooring', isWpl=sj.type==='wallpanel', isCustom=!isWpl&&_payIsCustomWp(o,sj);
    for(const a of asg){
      const email=a.installer_email||'', name=a.installer_name||a.installer||email||'—';
      const k=(email||('name:'+name)).toLowerCase();
      if(!map[k])map[k]={name,email,jobs:new Set(),fl_sqft:0,fl_amt:0,wpstd_rolls:0,wpstd_amt:0,wpcust_sqft:0,wpcust_amt:0,wpnl_sqft:0,wpnl_amt:0,total:0,lines:[]};
      const M=map[k];M.jobs.add(o.pi);
      const line={pi:o.pi,date:r.date,cat:isFl?'Flooring':isWpl?'Wall Panels':(isCustom?'Custom WP':'Std WP'),partial:r.isPartial,co:n,share:0,unit:'',rate:0,amt:0};
      let amt=0;
      if(isFl){const rate=_payRate(email,name,'fl_sqft');amt=shareSqft*rate;M.fl_sqft+=shareSqft;M.fl_amt+=amt;line.share=shareSqft;line.unit='sqft';line.rate=rate;}
      else if(isWpl){const rate=_payRate(email,name,'wpnl_sqft');amt=shareSqft*rate;M.wpnl_sqft+=shareSqft;M.wpnl_amt+=amt;line.share=shareSqft;line.unit='sqft';line.rate=rate;}
      else if(isCustom){const rate=_payRate(email,name,'wp_custom_sqft');amt=shareSqft*rate;M.wpcust_sqft+=shareSqft;M.wpcust_amt+=amt;line.share=shareSqft;line.unit='sqft';line.rate=rate;}
      else{const rate=_payRate(email,name,'wp_std_roll');amt=shareRolls*rate;M.wpstd_rolls+=shareRolls;M.wpstd_amt+=amt;line.share=shareRolls;line.unit='rolls';line.rate=rate;}
      line.amt=amt;M.total+=amt;M.lines.push(line);
    }
  }
  return Object.values(map).map(m=>({...m,jobs:m.jobs.size})).sort((a,b)=>b.total-a.total);
}

async function renderPayouts(m){
  m.innerHTML='<div class="loading-row"><span class="spinner"></span></div>';
  if(!payoutFrom){const t=new Date();payoutFrom=_anDstr(new Date(t.getFullYear(),t.getMonth(),1));payoutTo=_anDstr(t);}
  try{
    const g=await _loadSetting('payout_rates');_payoutGlobalId=g.id;_payoutGlobal={..._PAY_DEF,...(g.value||{})};
    const profs=await sbGet('profiles?select=name,email,pay_rates&role=in.(installer,auditor_installer)').catch(()=>[]);
    _payoutOverrides={};
    if(Array.isArray(profs))for(const p of profs){if(p.pay_rates){if(p.email)_payoutOverrides[p.email.toLowerCase()]=p.pay_rates;if(p.name)_payoutOverrides['name:'+p.name.toLowerCase()]=p.pay_rates;}}
    if(!window._anData||!window._anData.installs)await _anFetchData();
    const installs=(window._anData&&window._anData.installs)?window._anData.installs:[];
    // _anData's install select omits custom_wp (and city) — fetch just those and merge by pi (mirrors the original_delivery_date merge above).

  }catch(e){m.innerHTML='<div style="padding:30px;color:var(--red)">Could not load payout data — '+(e.message||'try again')+'</div>';return;}
  drawPayouts(m);

  const blob=new Blob(['﻿'+lines.join('\r\n')],{type:'text/csv;charset=utf-8;'});

async function _anFetchData(){
  // Use install_orders_slim (no photos in subjobs) to avoid MB-scale payload timeouts.
  // original_delivery_date is not in the slim view — fetch it separately (tiny query).
  // log columns are excluded — pre-July arrival photos were stored as base64 in log, causing MB-scale payloads.
  let installRes,auditRes,ratingsRes;
  try{
    [installRes,auditRes,ratingsRes]=await Promise.all([
      // bm, customer_name, phone are all plain short text columns already exposed by
      // install_orders_slim (see docs/supabase_slim_views.sql) — safe to select directly, no
      // separate query needed. Fixed 2026-07-25 (CLAUDE.md note 67) after phone-matching was
      // found to silently exclude install orders created before 1 Jul 2026 — that restriction
      // was only ever needed for `log` below, not for these fields.
      sbGetLong('install_orders_slim?select=id,pi,status,subjobs,service,delivery_date,created_at,bm,customer_name,phone'+(CITY_ENABLED?',city':'')+'&status=neq.deleted'),
      sbGetLong('audit_orders?select=id,pi,status,date,slot,auditor_name,auditor_email,phone,log,created_at,bm,customer_name'+(CITY_ENABLED?',city':'')+'&status=not.in.(deleted,slot_reserved,slot_converted)'),
      sbGetLong('ratings?select=order_type,pi,order_id,q1_score,q2_score,q3_score,created_at,staff_name,staff_email'),
    ]);
  }catch(e){
    return false;
  }
  // Fallback for q3_score column not yet in DB
  if(!Array.isArray(ratingsRes)) ratingsRes=await sbGetLong('ratings?select=order_type,pi,order_id,q1_score,q2_score,created_at,staff_name,staff_email').catch(()=>[]);
  // Merge original_delivery_date from a lightweight separate query
  const delivMeta=await sbGetLong('install_orders?select=pi,original_delivery_date&status=neq.deleted').catch(()=>[]);
  if(Array.isArray(installRes)&&Array.isArray(delivMeta)){
    const dm={};for(const r of delivMeta)dm[r.pi]=r.original_delivery_date||null;
    for(const o of installRes)o.original_delivery_date=dm[o.pi]||null;
  }
  // `log` is the real timeout risk (pre-storage-migration entries can embed multi-MB base64
  // photos in old log entries) — this one genuinely needs to stay date-restricted. Only used for
  // the log-based "delay mentioned" metric, which is documented as a distinct, narrower limitation.
  const installLogRes=await sbGetLong('install_orders?select=pi,log&status=neq.deleted&created_at=gte.2026-07-01').catch(()=>[]);
  if(Array.isArray(installLogRes)&&Array.isArray(installRes)){
    const lm={};for(const r of installLogRes)lm[r.pi]=r.log||[];
    for(const o of installRes)o.log=lm[o.pi]||[];
  }
  window._anData={
    installs:Array.isArray(installRes)?installRes:[],
    audits:Array.isArray(auditRes)?auditRes:[],
    ratings:Array.isArray(ratingsRes)?ratingsRes:[],
  };
  window._anLastFetch=Date.now();
  return true;
}

/* ────────────────────────────────────────────────────────────────────────────────────────────
   ANALYTICS V3 — one tab per question (added 2026-08-18, see CLAUDE.md note 111)
   The Analytics view is now a tab bar over one shared date/store/city filter:
     Category · Execution · Week on week · Penetration · Targets
   'Execution' is the pre-existing V2 content (site audit / site installation operations, straight
   off the ops DB in Supabase) PLUS the new bookings-vs-executions and TAT sections. Every other
   tab is COMMERCIAL — carts, orders, order value, attach rate, audit→order conversion, store
   penetration, targets — and reads the order book through md-cat-analytics.js, which is currently
   served by a dummy generator seeded from the Jun–Aug 2026 category workbook and swaps to the
   Metabase question by implementing MD_AN_SOURCE.metabase(). The two halves are deliberately kept
   apart: an order lives in Metabase, a site visit lives in Supabase, and the only bridge between
   them is the customer phone number.
   `service_mgr` sessions are scoped to the Execution tab only — the commercial tabs carry revenue
   and target data that role does not get (same reasoning as the .admin-only rail items).
   ──────────────────────────────────────────────────────────────────────────────────────────── */
let anTab=(function(){try{return localStorage.getItem('md_an_tab')||'category';}catch(e){return 'category';}})();

// above it must survive a redraw (they hold the controls that triggered it).
function _anBody(){return document.getElementById('anTabBody')||document.getElementById('main');}
function _anIsExec(){return anTab==='execution';}
function _anClamp(d){
  // The dummy source only holds 1 Jun – 17 Aug 2026. Clamping the pickers to it stops an empty
  // "last 7 days" (today is past the data cut) reading as a broken dashboard.
  if(window.MD_AN_SOURCE&&window.MD_AN_SOURCE.mode!=='dummy')return d;
  if(d<MD_AN_DATA_FROM)return MD_AN_DATA_FROM;
  if(d>MD_AN_DATA_TO)return MD_AN_DATA_TO;

}
function anFilter(){return {from:anCatFrom,to:anCatTo,store:anCatStore,city:CITY_ENABLED?analyticsCity:'all'};}

async function renderAnalytics(m){
  if(SESSION&&SESSION.role==='service_mgr')anTab='execution';
