<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<link rel="manifest" href="/manifest_admin.json"/>
<meta name="theme-color" content="#1F3A5F"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>Material Depot — Admin Console</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root{
    --navy:#1F3A5F;--navy2:#16294a;--blue:#2E6CA8;--yellow:#F4C20D;
    --ink:#1b2230;--muted:#67748a;--line:#dde3ec;--bg:#eef1f6;--card:#fff;
    --lighter:#eef3f9;--green:#1f7a3f;--greenbg:#e6f3ea;
    --red:#b3261e;--redbg:#fbeae8;--amber:#9a6200;--amberbg:#fdf2da;
    --purple:#5b3aa6;--purplebg:#efeaf8;--teal:#0f6e74;
    --shadow:0 1px 2px rgba(20,40,80,.06),0 4px 14px rgba(20,40,80,.06);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;}
  html,body{overflow-x:hidden;max-width:100%;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;min-height:100vh;}

  header{background:var(--navy);color:#fff;padding:0 20px;display:flex;align-items:center;gap:14px;height:56px;position:sticky;top:0;z-index:50;box-shadow:0 2px 8px rgba(0,0,0,.2);}
  .logo{width:34px;height:34px;border-radius:8px;background:var(--yellow);color:var(--navy);font-weight:800;display:grid;place-items:center;font-size:15px;flex:0 0 auto;}
  .brand-text .t{font-size:10px;color:#9fb2cd;letter-spacing:1px;font-weight:700;}
  .brand-text .h{font-size:15px;font-weight:700;line-height:1.1;}
  .admin-badge{background:var(--yellow);color:var(--navy);font-size:10px;font-weight:800;padding:2px 8px;border-radius:20px;letter-spacing:.5px;}
  .hdr-right{margin-left:auto;display:flex;align-items:center;gap:12px;}
  .user-pill{font-size:13px;color:#cdd8e8;}
  .user-pill b{color:#fff;}
  .signout-btn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#cdd8e8;border-radius:8px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer;}
  .signout-btn:hover{background:rgba(255,255,255,.2);}
  .menu-toggle{display:none;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;width:34px;height:34px;border-radius:8px;font-size:17px;cursor:pointer;flex:0 0 auto;}
  .rail-overlay{display:none;position:fixed;inset:0;background:rgba(10,15,25,.45);z-index:59;}

  .layout{display:flex;min-height:calc(100vh - 56px);}

  .rail{width:210px;background:#fff;border-right:1px solid var(--line);padding:12px 8px;flex:0 0 auto;display:flex;flex-direction:column;}
  .rail-section{font-size:10px;letter-spacing:.8px;color:var(--muted);font-weight:800;margin:14px 10px 5px;text-transform:uppercase;}
  .nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;color:var(--ink);font-weight:600;font-size:13.5px;cursor:pointer;border:0;background:transparent;width:100%;text-align:left;}
  .nav-item .ico{width:18px;text-align:center;flex:0 0 auto;}
  .nav-item:hover{background:var(--lighter);}
  .nav-item.active{background:var(--navy);color:#fff;}
  .nav-badge{margin-left:auto;font-size:11px;background:var(--lighter);color:var(--navy);border-radius:20px;padding:1px 7px;font-weight:800;}
  .nav-item.active .nav-badge{background:rgba(255,255,255,.18);color:#fff;}
  body.sm-analytics-only .admin-only{display:none;}

  main{flex:1;min-width:0;padding:22px 24px 60px;overflow:auto;}
  .page-head{margin-bottom:20px;}
  .page-head h1{font-size:22px;font-weight:800;color:var(--navy);letter-spacing:-.4px;}
  .page-head p{color:var(--muted);font-size:13px;margin-top:3px;}

  .stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px;margin-bottom:20px;}
  .stat-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow);min-width:0;overflow:hidden;}
  .stat-card .val{font-size:28px;font-weight:800;color:var(--navy);letter-spacing:-.5px;}
  .stat-card .lbl{font-size:12px;color:var(--muted);font-weight:700;margin-top:2px;}
  .stat-card .bar{height:3px;border-radius:3px;margin-top:10px;background:var(--line);overflow:hidden;}
  .stat-card .bar-fill{height:100%;border-radius:3px;}
  .stat-card.clickable{cursor:pointer;transition:box-shadow .15s,border-color .15s;}
  .stat-card.clickable:hover{border-color:var(--blue);box-shadow:0 2px 10px rgba(46,108,168,.15);}
  .stat-card.clickable.active{border-color:var(--navy);background:var(--navy);}
  .stat-card.clickable.active .val,.stat-card.clickable.active .lbl{color:#fff;}

  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;}
  .card-head{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;}
  .card-head h2{font-size:15px;font-weight:800;color:var(--navy);}

  .toolbar{display:flex;gap:8px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap;}
  .search-wrap{position:relative;flex:1;min-width:180px;}
  .search-wrap input{width:100%;padding:8px 10px 8px 30px;border:1px solid var(--line);border-radius:8px;font-size:13px;background:#fff;color:var(--ink);}
  .search-wrap input:focus{outline:none;border-color:var(--blue);}
  .search-ico{position:absolute;left:9px;top:9px;color:var(--muted);font-size:13px;}

  table{width:100%;border-collapse:collapse;}
  thead th{background:#f7f9fc;text-align:left;font-size:10.5px;letter-spacing:.5px;color:var(--muted);font-weight:800;padding:10px 14px;border-bottom:1px solid var(--line);text-transform:uppercase;white-space:nowrap;}
  tbody td{padding:11px 14px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle;}
  tbody tr:last-child td{border-bottom:0;}
  tbody tr:hover td{background:#fafbfd;}

  .role-badge{display:inline-flex;align-items:center;font-size:11px;font-weight:800;border-radius:20px;padding:4px 10px;white-space:nowrap;}
  .rb-admin{background:var(--purplebg);color:var(--purple);}
  .rb-service_mgr{background:#e3edf7;color:var(--navy);}
  .rb-site_auditor{background:#e4f0fb;color:var(--blue);}
  .rb-installer{background:var(--greenbg);color:var(--green);}
  .rb-auditor_installer{background:#e0f4f4;color:#0f6e74;}
  .rb-store_staff{background:var(--amberbg);color:var(--amber);}

  .chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;border-radius:20px;padding:4px 10px;white-space:nowrap;}
  .chip .dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:0 0 auto;}
  .c-pending{background:#eef1f6;color:#5a6b86;}
  .c-scheduled{background:#e4f0fb;color:var(--blue);}
  .c-onway{background:var(--amberbg);color:var(--amber);}
  .c-atsite{background:#fff4d6;color:#7a5800;}
  .c-completed{background:var(--greenbg);color:var(--green);}
  .c-reschedule{background:var(--redbg);color:var(--red);}

  .btn-icon{background:transparent;border:1px solid var(--line);border-radius:7px;padding:5px 9px;font-size:12px;cursor:pointer;color:var(--muted);font-weight:700;}
  .btn-icon:hover{border-color:var(--blue);color:var(--blue);}
  .btn-icon.del:hover{border-color:var(--red);color:var(--red);}
  .btn-primary{background:var(--navy);color:#fff;border:0;border-radius:9px;padding:9px 16px;font-size:13px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
  .btn-primary:hover{background:var(--navy2);}
  .btn-primary:disabled{opacity:.5;cursor:not-allowed;}

  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;display:none;align-items:center;justify-content:center;padding:20px;}
  .modal{background:#fff;border-radius:16px;width:100%;max-width:440px;box-shadow:0 20px 60px rgba(0,0,0,.3);overflow:hidden;}
  .modal.wide{max-width:720px;max-height:88vh;overflow-y:auto;}
  .jd-head{display:flex;align-items:center;gap:12px;padding:20px 24px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:2;}
  .jd-pi{font-size:15px;font-weight:800;color:var(--navy);flex:1;}
  .jd-info{padding:14px 24px;display:flex;flex-direction:column;gap:7px;border-bottom:1px solid var(--line);}
  .jd-row{display:flex;gap:10px;font-size:13px;align-items:flex-start;}
  .jd-label{color:var(--muted);font-weight:700;min-width:88px;flex-shrink:0;font-size:12px;}
  .jd-section{padding:14px 24px;border-bottom:1px solid var(--line);}
  .jd-sec-head{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:10px;}
  .jc-room{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px;}
  .jc-room-head{font-size:12px;font-weight:800;color:var(--navy);margin-bottom:6px;}
  .jc-kvs{display:flex;flex-wrap:wrap;gap:4px 16px;}
  .jc-kv{font-size:12px;line-height:1.4;}
  .jc-k{color:var(--muted);font-size:11px;}
  .jc-v{font-weight:700;}
  .jc-photos{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;}
  .jd-log{display:flex;flex-direction:column;gap:5px;}
  .jd-tl{font-size:12px;padding:4px 0;border-bottom:1px solid var(--line);}
  .jd-tl:last-child{border-bottom:none;}
  .jd-tl-t{font-weight:600;color:var(--ink);}
  .jd-tl-d{color:var(--muted);font-size:11px;margin-top:1px;}
  .jd-btns{padding:16px 24px 20px;display:flex;gap:10px;flex-wrap:wrap;}
  .btn-ghost{background:#f0f2f5;border:0;border-radius:9px;padding:9px 16px;font-size:13px;font-weight:700;cursor:pointer;color:var(--ink);}
  .btn-ghost:hover{background:#e0e4ea;}
  .modal-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;}
  .modal-head h3{font-size:16px;font-weight:800;color:var(--navy);}
  .modal-close{margin-left:auto;background:transparent;border:0;font-size:22px;cursor:pointer;color:var(--muted);line-height:1;padding:0 4px;}
  .modal-body{padding:20px;}
  .form-group{margin-bottom:14px;}
  .form-group label{display:block;font-size:11px;font-weight:800;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.4px;}
  .form-group input,.form-group select{width:100%;padding:10px 12px;border:2px solid var(--line);border-radius:9px;font-size:14px;color:var(--ink);background:#fff;}
  .form-group input:focus,.form-group select:focus{outline:none;border-color:var(--blue);}
  .form-error{background:var(--redbg);color:var(--red);border-radius:8px;padding:9px 12px;font-size:12.5px;font-weight:600;margin-top:10px;display:none;}
  .form-error.show{display:block;}
  .modal-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;}
  .btn-cancel{background:#f0f2f5;border:0;border-radius:9px;padding:9px 16px;font-size:13px;font-weight:700;cursor:pointer;color:var(--ink);}

  .role-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:20px;}
  .role-card{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:18px;cursor:pointer;text-align:center;transition:border-color .15s;}
  .role-card:hover{border-color:var(--blue);}
  .role-card.active{border-color:var(--navy);background:var(--navy);color:#fff;}
  .role-card .rc-ico{font-size:28px;margin-bottom:8px;}
  .role-card .rc-name{font-weight:800;font-size:14px;}
  .role-card .rc-desc{font-size:12px;color:var(--muted);margin-top:4px;}
  .role-card.active .rc-desc{color:#9fb2cd;}
  .iframe-wrap{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;height:620px;}
  .iframe-wrap iframe{width:100%;height:100%;border:0;}

  .perf-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;}
  .perf-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow);}
  .perf-card .pc-head{display:flex;align-items:center;gap:11px;margin-bottom:14px;}
  .pc-av{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-weight:800;font-size:14px;color:#fff;flex:0 0 auto;}
  .pc-name{font-weight:800;font-size:14px;}
  .pc-role{font-size:11.5px;color:var(--muted);}
  .perf-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px;}
  .perf-row:last-child{border-bottom:0;}
  .pr-val{font-weight:800;color:var(--navy);}

  .user-av{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;font-weight:800;font-size:12px;color:#fff;flex:0 0 auto;}

  .empty{text-align:center;padding:48px 20px;color:var(--muted);}
  .empty .e-ico{font-size:36px;margin-bottom:10px;}
  .empty .e-msg{font-size:14px;font-weight:600;}

  .spinner{display:inline-block;width:18px;height:18px;border:2px solid rgba(31,58,95,.15);border-top-color:var(--navy);border-radius:50%;animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg)}}
  .loading-row{text-align:center;padding:40px;color:var(--muted);}

  /* Analytics */
  .an-section{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:20px;}
  .an-section-head{display:flex;align-items:center;gap:14px;padding:16px 20px;border-bottom:1px solid var(--line);background:#f8f9fc;}
  .an-section-ico{font-size:24px;flex:0 0 auto;}
  .an-section-title{font-size:16px;font-weight:800;color:var(--navy);}
  .an-section-sub{font-size:12px;color:var(--muted);margin-top:2px;}
  .an-hero{margin-left:auto;text-align:right;flex:0 0 auto;}
  .an-hero-val{font-size:40px;font-weight:900;color:var(--navy);line-height:1;}
  .an-hero-label{font-size:11px;color:var(--muted);margin-top:2px;}
  .an-grid{display:grid;grid-template-columns:repeat(3,1fr);}
  .an-grid .an-card:nth-child(3n){border-right:none;}
  .an-grid4{display:grid;grid-template-columns:repeat(4,1fr);}
  .an-grid4 .an-card:nth-child(4n){border-right:none;}
  .an-card{padding:16px 18px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-height:110px;}
  .an-card-na{background:#fafbfc;}
  .an-label{font-size:10.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:7px;}
  .an-val{font-size:30px;font-weight:900;line-height:1;margin-bottom:5px;}
  .an-bar{height:4px;background:var(--lighter,#e8edf4);border-radius:2px;margin:5px 0 6px;}
  .an-bar-fill{height:100%;border-radius:2px;}
  .an-sub{font-size:11.5px;color:var(--muted);}
  .an-sub2{font-size:11px;color:var(--muted);margin-top:2px;}
  .an-stars{font-size:19px;color:var(--amber,#9a6200);margin:4px 0 3px;letter-spacing:1px;}
  .an-nps-row{display:flex;flex-direction:column;gap:2px;margin:5px 0 4px;font-size:11.5px;font-weight:700;}
  .an-nps-p{color:var(--green);}
  .an-nps-n{color:var(--muted);font-weight:500;}
  .an-nps-d{color:var(--red);}
  /* Analytics V2 additions */
  .an-date-row{display:flex;align-items:center;gap:10px;margin-bottom:22px;flex-wrap:wrap;}
  .an-date-label{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;}
  .an-date-inp{padding:7px 10px;border:1.5px solid var(--line);border-radius:8px;font-size:13px;color:var(--navy);background:#fff;font-weight:600;cursor:pointer;}
  .an-date-inp:focus{outline:none;border-color:var(--navy);}
  .an-apply-btn{padding:7px 16px;background:var(--navy);color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;}
  .an-sub-head{padding:10px 18px;background:#f9fafc;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);}
  .an-inst-table{width:100%;border-collapse:collapse;font-size:12.5px;}
  .an-inst-table thead th{padding:9px 14px;text-align:left;font-size:9.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;border-bottom:1.5px solid var(--line);white-space:nowrap;background:#f8f9fc;}
  .an-inst-table tbody td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:middle;}
  .an-inst-table tbody tr:last-child td{border-bottom:none;}
  .an-inst-table tbody tr:hover td{background:#f8fbff;}
  .an-inst-table small{font-size:9px;color:var(--muted);font-weight:400;display:block;margin-top:2px;}
  .an-deliv-row{display:flex;gap:24px;flex-wrap:wrap;padding:14px 20px;border-bottom:1px solid var(--line);align-items:center;}
  .an-deliv-stat{display:flex;flex-direction:column;gap:3px;}
  .an-deliv-val{font-size:26px;font-weight:800;line-height:1.1;}
  .an-deliv-lbl{font-size:11px;color:var(--muted);font-weight:600;}
  .an-na-note{padding:20px;text-align:center;color:var(--muted);font-size:13px;border-bottom:1px solid var(--line);}
  .an-footer{font-size:11.5px;color:var(--muted);padding:14px 20px;background:#f8f9fc;border-radius:10px;border:1px solid var(--line);line-height:1.8;margin-top:4px;}
  @media(max-width:780px){
    .an-grid{grid-template-columns:repeat(2,1fr);}
    .an-grid .an-card:nth-child(3n){border-right:1px solid var(--line);}
    .an-grid .an-card:nth-child(2n){border-right:none;}
    .an-grid4{grid-template-columns:repeat(2,1fr);}
    .an-grid4 .an-card:nth-child(4n){border-right:1px solid var(--line);}
    .an-grid4 .an-card:nth-child(2n){border-right:none;}
  }

  /* ── Mobile shell: sidebar becomes a slide-out drawer instead of squeezing content ── */
  @media(max-width:900px){
    .menu-toggle{display:block;}
    .brand-text .h{font-size:14px;}
    .brand-text .t{display:none;}
    .user-pill{display:none;}
    header{padding:0 12px;gap:10px;}
    .rail{position:fixed;top:56px;left:0;bottom:0;z-index:60;width:230px;max-width:80vw;
      transform:translateX(-100%);transition:transform .22s ease;box-shadow:2px 0 16px rgba(0,0,0,.18);overflow-y:auto;}
    .rail.open{transform:translateX(0);}
    .rail-overlay.show{display:block;}
    main{padding:16px 14px 60px;}
  }

  #toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;border-radius:10px;padding:10px 18px;font-size:13.5px;font-weight:600;opacity:0;transition:all .25s;pointer-events:none;z-index:200;white-space:nowrap;}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  .notice{background:var(--amberbg);border:1px solid #e8c97a;border-radius:9px;padding:10px 14px;font-size:12.5px;color:var(--amber);font-weight:600;margin-bottom:16px;display:flex;align-items:center;gap:8px;}
  .filt-btn{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:7px;padding:6px 12px;font-size:12.5px;font-weight:700;cursor:pointer;}
  .filt-btn.active{background:var(--navy);color:#fff;border-color:var(--navy);}
</style>
</head>
<body>

<div id="app" hidden>
  <header>
    <button class="menu-toggle" id="menuToggle" aria-label="Open menu">☰</button>
    <div class="logo">MD</div>
    <div class="brand-text">
      <div class="t">MATERIAL DEPOT</div>
      <div class="h" id="hdr-subtitle">Admin Console</div>
    </div>
    <span class="admin-badge" id="hdr-badge">ADMIN</span>
    <div class="hdr-right">
      <span class="user-pill">Signed in as <b id="hdr-name">—</b></span>
      <button class="signout-btn" onclick="signOut()">Sign out</button>
    </div>
  </header>

  <div class="rail-overlay" id="railOverlay"></div>

  <div class="layout">
    <nav class="rail">
      <div class="rail-section admin-only">Dashboard</div>
      <button class="nav-item active admin-only" data-view="overview"><span class="ico">🏠</span>Overview</button>
      <div class="rail-section admin-only">Manage</div>

    return;
  }
  usersCache=res;
  document.getElementById('users-count').textContent=res.length;
  drawUsersTable(m);
}

async function submitAddUser(){
  const name=document.getElementById('f-name').value.trim();
  const email=document.getElementById('f-email').value.trim().toLowerCase();
  const role=document.getElementById('f-role').value;
  const err=document.getElementById('f-err');
  const btn=document.getElementById('f-submit');
  err.classList.remove('show');
  if(!name){err.textContent='Please enter a full name.';err.classList.add('show');return;}
  if(!email||!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){err.textContent='Please enter a valid email address.';err.classList.add('show');return;}
  if(!role){err.textContent='Please select a role.';err.classList.add('show');return;}
  const itypeEl=document.getElementById('f-itype');
  const installer_type=(role==='installer'||role==='auditor_installer')&&itypeEl?itypeEl.value:'flooring';
  btn.disabled=true;btn.textContent='Adding…';
  try{
    await sbPost('profiles',{name,email,role,installer_type});
    closeModal();
    toast(`✓ ${name} added as ${ROLES[role]?.label||role}`);
    await renderUsers(document.getElementById('main'));
  }catch(e){
    btn.disabled=false;btn.textContent='Add User';
    const msg=e.message||'';
    err.textContent=msg.includes('unique')||msg.includes('duplicate')?'This email is already added.':msg.includes('violates')||msg.includes('check')?'Role not allowed — ask IT to run the DB constraint update.':msg||'Something went wrong.';
    err.classList.add('show');
  }
}

  const role=document.getElementById('e-role').value;

function _hhmmVal(s){if(!s)return 9999;const r=String(s).match(/^(\d{1,2}):(\d{2})$/);return r?(+r[1])*60+(+r[2]):9999;}
function fmtJobTime(s){if(!s)return '—';const r=String(s).match(/^(\d{1,2}):(\d{2})$/);if(!r)return s;const h=+r[1],mn=+r[2],ap=h>=12?'PM':'AM',h12=h%12||12;return h12+':'+(mn<10?'0':'')+mn+' '+ap;}
let _realJobsAudit=[], _realJobsInstall=[], _jobsAuditFailed=false, _jobsInstallFailed=false;
async function _loadJobsData(m){
  const [auditRes,installRes,profileRes]=await Promise.all([
    sbGet('audit_orders?select=pi,customer_name,addr,auditor_name,auditor_email,status,date,slot&status=not.in.(deleted,slot_reserved,slot_converted)&order=created_at.desc'),
    sbGetLong('install_orders_slim?select=pi,customer_name,addr,subjobs,status,delivery_date&status=neq.deleted&order=created_at.desc'),
    sbGet('profiles?select=name,email&role=neq.admin'),
  ]);
  if(Array.isArray(profileRes)) profileRes.forEach(p=>{_jobsNameMap[p.email]=p.name;});

  if(Array.isArray(auditRes)){
    _realJobsAudit=auditRes.map(r=>({
      id:r.pi||'—', type:'audit',
      customer:r.customer_name||'—', addr:r.addr||'—',
      assignee:r.auditor_name||(r.auditor_email?_jobsNameMap[r.auditor_email]:null),
      status:r.status||'pending', date:r.date||null, time:r.slot||null,
    }));
    _jobsAuditFailed=false;
  }else{
    console.error('[_loadJobsData] audit_orders fetch failed (non-array response) — keeping last known audit jobs',auditRes);
    if(!_jobsAuditFailed){toast('⚠ Could not refresh site audit jobs — showing last known data');_jobsAuditFailed=true;}
  }

  if(Array.isArray(installRes)){
    _realJobsInstall=installRes.map(r=>{
      const emails=[...new Set((r.subjobs||[]).flatMap(sj=>{
        if(sj.assignments&&sj.assignments.length)return sj.assignments.map(a=>a.installer_email).filter(Boolean);
        return sj.installer_email?[sj.installer_email]:[];
      }))];
      const installDates=[...new Set((r.subjobs||[]).flatMap(sj=>{
        const asgns=sj.assignments&&sj.assignments.length?sj.assignments:(sj.installer?[{date:sj.date,mode:'standard',dates:[]}]:[]);
        return asgns.flatMap(a=>a.mode==='custom'?(a.dates||[]):(a.date?[a.date]:[]));
      }))];
      const times=[...new Set((r.subjobs||[]).flatMap(sj=>{
        const asgns=sj.assignments&&sj.assignments.length?sj.assignments:(sj.slot?[{slots:[sj.slot]}]:[]);
        return asgns.flatMap(a=>a.slots||[]);
      }))];
      const time=times.length?times.reduce((min,t)=>_hhmmVal(t)<_hhmmVal(min)?t:min):null;
      return {
        id:r.pi||'—', type:'install',
        customer:r.customer_name||'—', addr:r.addr||'—',
        assignee:emails.length?emails.map(e=>_jobsNameMap[e]||e.split('@')[0]).join(', '):null,
        status:r.status||'pending', date:r.delivery_date||null, time,
        installDates,
      };
    });
    _jobsInstallFailed=false;
  }else{
    console.error('[_loadJobsData] install_orders_slim fetch failed (non-array response) — keeping last known install jobs',installRes);
    if(!_jobsInstallFailed){toast('⚠ Could not refresh installation jobs — showing last known data');_jobsInstallFailed=true;}
  }

  realJobs=_realJobsAudit.concat(_realJobsInstall);
  if(m)drawJobs(m);
}

async function renderJobs(m){
  m.innerHTML='<div class="loading-row"><span class="spinner"></span></div>';
  await _loadJobsData(m);
  if(_jobsPollTid)clearInterval(_jobsPollTid);
  _jobsPollTid=setInterval(()=>{
    if(currentView==='jobs'&&!document.hidden)_loadJobsData(document.getElementById('main'));
  },30000);
}

function getFilteredJobs(){
  return realJobs.filter(j=>{
    if(jobsFilter==='audit')return j.type==='audit';
    if(jobsFilter==='install')return j.type==='install';
    if(jobsFilter==='active')return ['assigned','onway','atsite','scheduled'].includes(j.status);
    if(jobsFilter==='unassigned')return !j.assignee;
    if(JOB_STATUS[jobsFilter])return j.status===jobsFilter;
    return true;
  }).filter(j=>{
    if(!jobsDateFrom&&!jobsDateTo)return true;
    const dates=j.type==='audit'?(j.date?[j.date]:[]):(j.installDates||[]);
    if(!dates.length)return false;
    return dates.some(d=>(!jobsDateFrom||d>=jobsDateFrom)&&(!jobsDateTo||d<=jobsDateTo));
  }).filter(j=>{
    if(!jobsSearch)return true;
    const q=jobsSearch.toLowerCase();
    return j.id.toLowerCase().includes(q)||j.customer.toLowerCase().includes(q);
  }).sort((a,b)=>_hhmmVal(a.time)-_hhmmVal(b.time));
}
function _csvEscape(v){const s=String(v==null?'':v);return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}
function downloadJobsCSV(){
  const rows=getFilteredJobs();
  if(!rows.length){toast('No jobs to export for the current filters');return;}
  const header=['Job ID','Type','Customer','Location','Assigned To','Status','Time','Date'];
  const lines=[header.join(',')].concat(rows.map(j=>[
    j.id,j.type==='audit'?'Audit':'Install',j.customer,j.addr,j.assignee||'Unassigned',JOB_STATUS[j.status]?.l||j.status,fmtJobTime(j.time),j.date||''
  ].map(_csvEscape).join(',')));
  const blob=new Blob(['﻿'+lines.join('\r\n')],{type:'text/csv;charset=utf-8;'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='job-overview'+(jobsDateFrom||jobsDateTo?`_${jobsDateFrom||'start'}_to_${jobsDateTo||'end'}`:'')+'.csv';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

const AUDIT_WP_FIELDS=[['Wall area (sq.ft)','warea'],['No. of rolls','rolls'],['Pattern repeat (mm)','repeat'],['Match type','match'],['Adhesive (packs)','adh'],['Primer','primer']];

function fmtLog(d){if(!d)return '—';const dt=new Date(d);if(isNaN(dt.getTime())){const m=String(d).match(/\d{1,2}:\d{2}\s*(?:[AP]M)?/i);return m?m[0]+' (date unknown)':'—';}const ts=dt.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});return dt.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})+' · '+ts;}

  return `<div class="jd-tl"><div class="jd-tl-t">${(l.who?'<span style="color:var(--navy);font-weight:800">'+l.who+'</span> &middot; ':'')+l.t+mapLink}</div><div class="jd-tl-d">${fmtLog(l.d)}${l.by==='auto'?' · installer/auditor':l.by==='manual'?' · SM':''}</div>${photo}</div>`;
}).join('');}
// Read-only mirror of SM_Install_Dashboard.html's custom wallpaper production stepper (note 62).
// Admin never advances stages — view only — so this only needs to render, not wire buttons.
const CWP_STAGES_RO=[
  {k:"placed",l:"Order Placement"},{k:"draft",l:"Draft Generation"},
  {k:"approval",l:"Customer Approval"},{k:"warehouse",l:"At Warehouse"},
  {k:"delivsched",l:"Delivery Schedule"},{k:"deliv",l:"Delivery"},{k:"install",l:"Installation"}
];
const CWP_STAGE_RANK_RO={draft:1,approval:2,warehouse:3};
function adminCwpSection(o){
  const stage=o.custom_wp_stage||'draft';const meta=o.custom_wp_meta||{};
  const subjobs=o.subjobs||[];
  const terminal=stage==='warehouse'&&!!meta.warehouseReceivedAt;
  const backHalfDone=k=>{
    if(k==='delivsched')return !!o.delivery_date;
    if(k==='deliv')return !['pending','call_na','deliv_delayed'].includes(o.status);
    if(k==='install')return !!(subjobs.length&&subjobs.every(sj=>sj.status==='completed'));
    return false;
  };
  const nodes=CWP_STAGES_RO.map(s=>{
    let state='';
    if(s.k==='placed')state='done';
    else if(CWP_STAGE_RANK_RO[s.k]){
      if(terminal)state='done';
      else if(CWP_STAGE_RANK_RO[stage]>CWP_STAGE_RANK_RO[s.k])state='done';
      else if(stage===s.k)state='cur';
    } else state=backHalfDone(s.k)?'done':'';
    return {...s,state};
  });
  const dotStyle=(st)=>st==='done'?'background:var(--green,#1f7a3f);color:#fff':st==='cur'?'background:var(--navy,#1F3A5F);color:#fff':'background:#e4e8f0;color:#67748a';
  const track=nodes.map((n,i)=>`${i>0?`<div style="flex:0 0 16px;height:2px;margin-top:9px;background:${nodes[i-1].state==='done'?'var(--green,#1f7a3f)':'#e4e8f0'}"></div>`:''}<div style="display:flex;flex-direction:column;align-items:center;flex:0 0 74px;font-size:9.5px;text-align:center;font-weight:700;color:${n.state==='done'?'var(--green,#1f7a3f)':n.state==='cur'?'var(--navy,#1F3A5F)':'#67748a'}"><div style="width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;margin-bottom:5px;${dotStyle(n.state)}">${n.state==='done'?'&#10003;':i+1}</div>${n.l}</div>`).join('');
  const renderPreview=meta.renderUrl?(meta.renderIsImage?`<img src="${meta.renderUrl}" style="max-width:160px;border-radius:8px;margin-top:8px;display:block">`:`<a href="${meta.renderUrl}" target="_blank" rel="noopener" style="font-size:12px">View render link</a>`):'';
  return `<div class="jd-section"><div class="jd-sec-head">Custom Wallpaper Journey</div>
    <div style="display:flex;align-items:flex-start;gap:0;margin:8px 0;overflow-x:auto">${track}</div>
    <div class="jd-row"><span class="jd-label">Vendor</span><span>${meta.vendor||'—'}</span></div>
    <div class="jd-row"><span class="jd-label">Revisions</span><span>${meta.revisionCount||0}</span></div>
    ${renderPreview}
    ${terminal?`<div style="font-size:12px;color:var(--green,#1f7a3f);margin-top:6px">&#10003; Received at warehouse on ${fmtLog(meta.warehouseReceivedAt)}</div>`:''}
  </div>`;
}

/* ---- PERFORMANCE ---- */
async function renderPerf(m){
  m.innerHTML='<div class="loading-row"><span class="spinner"></span></div>';
  const [usersRes,auditRes,installRes]=await Promise.all([
    sbGet('profiles?select=*&role=neq.admin&order=name.asc'),
    sbGet('audit_orders?select=auditor_email,status,created_at,created_by_email&status=not.in.(deleted,slot_reserved,slot_converted)'),
    sbGet('install_orders?select=subjobs,status,created_at,created_by_email'),
  ]);
  const field=Array.isArray(usersRes)?usersRes.filter(u=>u.role!=='admin'):[];
  if(!field.length){
    m.innerHTML=`<div class="page-head"><h1>Performance</h1></div><div class="card"><div class="empty"><div class="e-ico">📊</div><div class="e-msg">No field staff found. Add users with Site Auditor or Installer roles first.</div></div></div>`;
    return;
  }
  const auditOrders=Array.isArray(auditRes)?auditRes:[];
  const installOrders=Array.isArray(installRes)?installRes:[];
  const now=new Date();
  const ym=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;

  const statsFor=u=>{
    if(u.role==='site_auditor'||u.role==='auditor_installer'){
      const mine=auditOrders.filter(o=>o.auditor_email===u.email);
      const atotal=mine.length, adone=mine.filter(o=>o.status==='completed').length;
      const amonthly=mine.filter(o=>(o.created_at||'').startsWith(ym)).length;
      if(u.role==='site_auditor') return {total:atotal,done:adone,pending:atotal-adone,monthly:amonthly,pct:atotal?Math.round(adone/atotal*100):0};
      // auditor_installer: combine audit + install stats
      let itotal=0,idone=0,imonthly=0;
      installOrders.forEach(o=>{
        (o.subjobs||[]).forEach(sj=>{
          const asgn=sj.assignments||[];
          const inAsgn=asgn.length?asgn.some(a=>a.installer_email===u.email):sj.installer_email===u.email;
          if(inAsgn){itotal++;if(sj.status==='completed')idone++;if((o.created_at||'').startsWith(ym))imonthly++;}
        });
      });
      const total=atotal+itotal,done=adone+idone,monthly=amonthly+imonthly;
      return {total,done,pending:total-done,monthly,pct:total?Math.round(done/total*100):0};
    }
    if(u.role==='installer'){
      let total=0,done=0,monthly=0;
      installOrders.forEach(o=>{
        (o.subjobs||[]).forEach(sj=>{
          if(sj.installer_email===u.email){
            total++;
            if(sj.status==='completed')done++;
            if((o.created_at||'').startsWith(ym))monthly++;
          }
        });
      });
      return {total,done,pending:total-done,monthly,pct:total?Math.round(done/total*100):0};
    }
    // service_mgr: orders they created
    const myA=auditOrders.filter(o=>o.created_by_email===u.email);
    const myI=installOrders.filter(o=>o.created_by_email===u.email);
    const total=myA.length+myI.length;
    const done=myA.filter(o=>o.status==='completed').length+myI.filter(o=>o.status==='completed').length;
    const monthly=myA.filter(o=>(o.created_at||'').startsWith(ym)).length+myI.filter(o=>(o.created_at||'').startsWith(ym)).length;
    return {total,done,pending:total-done,monthly,pct:total?Math.round(done/total*100):0};
  };

  m.innerHTML=`
    <div class="page-head"><h1>Performance</h1><p>Completion stats per team member, computed from live order data.</p></div>
    <div class="perf-grid">
      ${field.map(u=>{
        const color=ROLES[u.role]?.color||'#999';
        const s=statsFor(u);
        const pctColor=s.pct>=90?'var(--green)':s.pct>=75?'var(--amber)':'var(--red)';
        const pctDisplay=s.total?s.pct+'%':'—';
        return `<div class="perf-card">
          <div class="pc-head">
            <div class="pc-av" style="background:${color}">${initials(u.name)}</div>
            <div><div class="pc-name">${u.name}</div><div class="pc-role">${ROLES[u.role]?.label||u.role}</div></div>
          </div>
          <div class="perf-row"><span>Total Jobs</span><span class="pr-val">${s.total}</span></div>
          <div class="perf-row"><span>Completed</span><span class="pr-val" style="color:var(--green)">${s.done}</span></div>
          <div class="perf-row"><span>Pending</span><span class="pr-val" style="color:var(--amber)">${s.pending}</span></div>
          <div class="perf-row"><span>This Month</span><span class="pr-val">${s.monthly}</span></div>
          <div class="perf-row"><span>Completion Rate</span><span class="pr-val" style="color:${s.total?pctColor:'var(--muted)'}">${pctDisplay}</span></div>
          ${s.total?`<div style="height:5px;background:var(--line);border-radius:5px;margin-top:10px;overflow:hidden">
            <div style="height:100%;width:${s.pct}%;background:${pctColor};border-radius:5px;transition:width .5s"></div>
          </div>`:''}
        </div>`;
      }).join('')}
    </div>`;
}

const FLOOR_FIELDS_A=[{k:'area',label:'Area (sq.ft)'},{k:'boxes',label:'Boxes'},{k:'skirt',label:'Skirting (nos)'},{k:'skirtH',label:'Skirting height (mm)'},{k:'lprof',label:'L-profile (nos)'},{k:'rprof',label:'R-profile / Reducer (nos)'},{k:'tprof',label:'T-profile (nos)'},{k:'corner',label:'Corner beading (nos)'}];
const WALL_FIELDS_A=[{k:'warea',label:'Wall area (sq.ft)'},{k:'rolls',label:'No. of rolls'},{k:'repeat',label:'Pattern repeat (mm)'},{k:'match',label:'Match type'},{k:'adh',label:'Adhesive (packs)'},{k:'primer',label:'Primer needed'}];
function fieldsForA(t){return t==='wallpaper'?WALL_FIELDS_A:FLOOR_FIELDS_A;}
function imgFmtA(d){if(/webp/i.test(d.slice(0,20)))return 'WEBP';return /png/i.test(d.slice(0,20))?'PNG':'JPEG';}
function renderSketchA(r){
  if(!r.sketchStrokes||!r.sketchStrokes.length)return null;
  const W=1000,H=500;const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
  x.fillStyle='#fff';x.fillRect(0,0,W,H);const s=Math.round(22*(W/360));x.fillStyle='#b2b8c1';
  for(let yy=s;yy<H;yy+=s)for(let xx=s;xx<W;xx+=s){x.beginPath();x.arc(xx,yy,2,0,7);x.fill();}
  x.strokeStyle='#1F3A5F';x.lineWidth=3.2;x.lineJoin='round';x.lineCap='round';
  for(const st of r.sketchStrokes){if(st.length<1)continue;x.beginPath();st.forEach((p,i)=>{const X=p.x*W,Y=p.y*H;i?x.lineTo(X,Y):x.moveTo(X,Y);});x.stroke();}
  return c.toDataURL('image/jpeg',0.85);
}
function fmtDateA(ds){if(!ds)return '—';const d=new Date(ds+'T00:00');return d.toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'});}
async function _compressAdmin(dataUrl){
  if(!dataUrl)return null;
  return new Promise(res=>{const im=new Image();if(dataUrl.startsWith('http'))im.crossOrigin='anonymous';im.onload=()=>{try{const s=Math.min(1,1600/Math.max(im.width,im.height));const w=Math.round(im.width*s),h=Math.round(im.height*s);const cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(im,0,0,w,h);res(cv.toDataURL('image/jpeg',0.88));}catch(e){res(null);}};im.onerror=()=>res(null);im.src=dataUrl;});
}

/* ---- ANALYTICS V2 ---- */
// Site Audit and Site Installation each get their own independent date range (added 2026-07-29,
// CLAUDE.md note 77) — they used to share one analyticsFrom/analyticsTo pair, which forced picking
// a single range for both sections even though an SM/admin often wants to look at a different
// window for each (e.g. audits this week vs installs this month).
let analyticsAuditFrom='', analyticsAuditTo='', analyticsInstallFrom='', analyticsInstallTo='', _anPollTid=null;

function _anDstr(d){const z=n=>n<10?'0'+n:n;return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate());}
function _anToIST(iso){return new Date(new Date(iso).getTime()+19800000);}
function _anDateIST(iso){return _anToIST(iso).toISOString().substring(0,10);}
function _anMinsIST(iso){const d=_anToIST(iso);return d.getUTCHours()*60+d.getUTCMinutes();}
function _anParseDateText(text){
  const m=text.match(/(\d{1,2})\s+(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\s+(\d{4})/i);
  if(!m)return null;
  const mn={jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
  return _anDstr(new Date(+m[3],mn[m[2].toLowerCase()],+m[1]));
}

// Fetches fresh analytics data into window._anData. Returns true on success, false on failure —
// never touches the DOM itself, so it's safe to call silently from the background poll below as
// well as from the initial renderAnalytics load. All-time arrays (installs/audits) are always
// fetched in full regardless of the selected date range, since several metrics (Material Depot
// Audit %, Site Audit → Order Conversion %) intentionally phone-match against all-time data —
// re-running this later is what lets a conversion that only happens days after the audit show up.
async function _anFetchData(){
  // Use install_orders_slim (no photos in subjobs) to avoid MB-scale payload timeouts.
  // original_delivery_date is not in the slim view — fetch it separately (tiny query).
  // log columns are excluded — pre-July arrival photos were stored as base64 in log, causing MB-scale payloads.
  let installRes,auditRes,ratingsRes;
  try{
    [installRes,auditRes,ratingsRes]=await Promise.all([
      // bm, customer_name, phone are all plain short text columns already exposed by
      // install_orders_slim (see docs/supabase_slim_views.sql) — safe to select directly, no
      // separate query needed. Fixed 2026-07-25 (CLAUDE.md note 67) after phone-matching was
      // found to silently exclude install orders created before 1 Jul 2026 — that restriction
      // was only ever needed for `log` below, not for these fields.
      sbGetLong('install_orders_slim?select=id,pi,status,subjobs,service,delivery_date,created_at,bm,customer_name,phone&status=neq.deleted'),
      sbGetLong('audit_orders?select=id,pi,status,date,slot,auditor_name,auditor_email,phone,log,created_at,bm,customer_name&status=not.in.(deleted,slot_reserved,slot_converted)'),
      sbGetLong('ratings?select=order_type,pi,order_id,q1_score,q2_score,q3_score,created_at,staff_name,staff_email'),
    ]);
  }catch(e){
    return false;
  }
  // Fallback for q3_score column not yet in DB
  if(!Array.isArray(ratingsRes)) ratingsRes=await sbGetLong('ratings?select=order_type,pi,order_id,q1_score,q2_score,created_at,staff_name,staff_email').catch(()=>[]);
  // Merge original_delivery_date from a lightweight separate query
  const delivMeta=await sbGetLong('install_orders?select=pi,original_delivery_date&status=neq.deleted').catch(()=>[]);
  if(Array.isArray(installRes)&&Array.isArray(delivMeta)){
    const dm={};for(const r of delivMeta)dm[r.pi]=r.original_delivery_date||null;
    for(const o of installRes)o.original_delivery_date=dm[o.pi]||null;
  }
  // `log` is the real timeout risk (pre-storage-migration entries can embed multi-MB base64
  // photos in old log entries) — this one genuinely needs to stay date-restricted. Only used for
  // the log-based "delay mentioned" metric, which is documented as a distinct, narrower limitation.
  const installLogRes=await sbGetLong('install_orders?select=pi,log&status=neq.deleted&created_at=gte.2026-07-01').catch(()=>[]);
  if(Array.isArray(installLogRes)&&Array.isArray(installRes)){
    const lm={};for(const r of installLogRes)lm[r.pi]=r.log||[];
    for(const o of installRes)o.log=lm[o.pi]||[];
  }
  window._anData={
    installs:Array.isArray(installRes)?installRes:[],
    audits:Array.isArray(auditRes)?auditRes:[],
    ratings:Array.isArray(ratingsRes)?ratingsRes:[],
  };
  window._anLastFetch=Date.now();
  return true;
}

async function renderAnalytics(m){
  m.innerHTML='<div class="loading-row"><span class="spinner"></span></div>';
  if(!analyticsAuditFrom){
    const t=new Date();
    analyticsAuditTo=_anDstr(t);
    t.setDate(t.getDate()-6);
    analyticsAuditFrom=_anDstr(t);
  }
  if(!analyticsInstallFrom){
    const t=new Date();
    analyticsInstallTo=_anDstr(t);
    t.setDate(t.getDate()-6);
    analyticsInstallFrom=_anDstr(t);
  }
  const ok=await _anFetchData();
  if(!ok){
    m.innerHTML=`<div class="page-head"><h1>Analytics</h1></div><div style="padding:24px;color:var(--red);font-weight:600">⚠ Failed to load analytics data — network timeout. Please try again.</div>`;
    return;
  }
  try{drawAnalytics(m);}catch(e){
    m.innerHTML=`<div class="page-head"><h1>Analytics</h1></div><div style="padding:24px;color:var(--red);font-weight:600">⚠ Analytics render error: ${e.message}. Please reload.</div>`;
  }
  // Auto-refresh: re-fetch every 60s while this tab is active and visible, so a metric like
  // Site Audit → Order Conversion % picks up conversions that happen days after the audit
  // without the admin needing to leave and re-enter the Analytics view. Silent — no spinner —
  // so it doesn't interrupt someone mid-read; skipped while a date-range input is focused so it
  // never clobbers an in-progress (not-yet-applied) edit.
  if(_anPollTid)clearInterval(_anPollTid);
  _anPollTid=setInterval(async()=>{
    if(currentView!=='analytics'||document.hidden)return;
    const active=document.activeElement;
    if(active&&['anAuditFrom','anAuditTo','anInstallFrom','anInstallTo'].includes(active.id))return;
    const fresh=await _anFetchData();
    if(fresh&&currentView==='analytics')drawAnalytics(document.getElementById('main'));
  },60000);
}

// Returns one canonical row per subjob within [from,to] — never more than one, regardless of
// reschedule history or multi-day span. Completed/partial: keyed on completion-log date (or latest
// known scheduled date if no log match). Not-done: keyed on current scheduled date(s) — membership
// is "any of its current dates overlaps the range", but only ONE row is ever emitted per subjob.
function _anInstallCanon(installs,from,to){
  const out=[];
  for(const o of installs){
    for(const sj of (o.subjobs||[])){
      const isDone=['completed','partial'].includes(sj.status);
      let repDate=null,matched=false;

      // Scheduled date candidate(s) — always computed, regardless of completion status. Used for
      // display/status/delivery-tracking date (repDate) when not yet done, and separately as the
      // arrival-matching date for done jobs (arrival can land a day before the completion log is
      // written on a multi-day job, so it must not require an exact match against the completion date).
      const schedCand=[];
      if(sj.date) schedCand.push(sj.date);
      for(const a of (sj.assignments||[])){
        if(a.mode==='custom')(a.dates||[]).forEach(d=>schedCand.push(d));
        else if(a.date) schedCand.push(a.date);
      }

      if(isDone){
        const complKey=(sj.type==='wallpaper'?'Wallpaper':'Flooring')+' installation completed';
        let cd=null;
        for(const l of (o.log||[])){
          if(l.t&&l.d&&l.t.startsWith(complKey)){const d=_anDateIST(l.d);if(!cd||d>cd)cd=d;}
        }
        if(!cd) cd=schedCand.length?schedCand.sort().slice(-1)[0]:null;
        repDate=cd;
        matched=!!repDate&&repDate>=from&&repDate<=to;
      }else{
        if(schedCand.length){
          matched=schedCand.some(d=>d>=from&&d<=to);
          const inRange=schedCand.filter(d=>d>=from&&d<=to).sort();
          repDate=inRange.length?inRange[0]:schedCand.sort()[0];
        }
      }
      if(!matched) continue;

      const asgns=(sj.assignments||[]).filter(a=>a.mode==='custom'?(a.dates||[]).includes(repDate):a.date===repDate);
      const useAsgns=asgns.length?asgns:(sj.assignments||[]);
      const primary=useAsgns.find(a=>a.primary)||useAsgns[0]||null;

      out.push({
        pi:o.pi, orderId:o.id, sjId:sj.id, type:sj.type, status:sj.status, date:repDate,
        schedDates:schedCand,
        slot:primary?(primary.slots&&primary.slots[0])||'':sj.slot||'',
        installers:useAsgns, items:sj.items||[],
        hasDelay:!!(o.original_delivery_date&&o.delivery_date&&o.original_delivery_date!==o.delivery_date),
        logDelay:(o.log||[]).some(l=>l.t&&/delay/i.test(l.t)),
        originalDelivery:o.original_delivery_date||null,
        currentDelivery:o.delivery_date||null,
        order:o,
      });
    }
  }
  return out;
}

// Row-level "did this specific job's assigned actor(s) arrive on time?" resolver.
// Matches an "arrived at site" log entry to THIS row only (same date, name among this row's actors) —
// not an independent scan of the whole raw array, so results can never drift from the canonical total.
function _anArrivalBucket(slot,logIso){
  if(!slot||!/^\d{1,2}:\d{2}$/.test(slot)) return null;
  const [sh,sm]=slot.split(':').map(Number);
  return (_anMinsIST(logIso)-(sh*60+sm))>3?'late':'onTime';
}
// Recovers a 24h "HH:MM" from a log message's trailing 12h time (e.g. "...· 2:00 PM") — these are
// the display-formatted strings slotLabel()/fmtDate() write into log text; there is no raw HH:MM
// stored alongside them, so this is the only way to reconstruct what slot was in effect at a given
// point in an order's history. Returns null if no such time is found at the end of the string.
function _anParseSlotTime12h(str){
  const m=str.match(/(\d{1,2}):(\d{2})\s*(AM|PM)\s*$/i);
  if(!m)return null;
  let h=parseInt(m[1],10);const mm=m[2];const ap=m[3].toUpperCase();
  if(ap==='PM'&&h!==12)h+=12;
  if(ap==='AM'&&h===12)h=0;
  return String(h).padStart(2,'0')+':'+mm;
}
// Replays one install order's log chronologically to recover EVERY real "installer arrived at
// site" event, tied to whichever installer+slot were actually in effect at that moment — not just
// the subjob's CURRENT assignment. This matters because reassignment overwrites sj.assignments[]
// in place (SM_Install_Dashboard.html's saveAssign: `sj.assignments=valid`) with no history kept on
// the live document — the only surviving record of "who was assigned before" is the log text itself
// (added 2026-07-29, CLAUDE.md note 79, per explicit user request: a job reassigned mid-flight
// should credit/debit EACH installer's own real attempt at their own assigned time, not silently
// drop the earlier one just because someone else now holds the subjob).
// Returns {flooring:[{name,slot,d,bucket}], wallpaper:[...]} — only for types actually present.
function _anInstallOrderAttempts(order){
  const types=[...new Set((order.subjobs||[]).map(sj=>sj.type).filter(Boolean))];
  if(!types.length)return {};
  const logs=(order.log||[]).slice().sort((a,b)=>new Date(a.d)-new Date(b.d));
  const state={};types.forEach(t=>{state[t]={names:new Set(),slot:null};});
  const out={};types.forEach(t=>{out[t]=[];});
  for(const l of logs){
    if(!l.t)continue;
    const tl=l.t.toLowerCase();
    for(const type of types){
      const st=state[type];
      if(tl.startsWith(type+' slot cleared')){st.names=new Set();st.slot=null;}
      else if(tl.startsWith(type+' assigned')||tl.startsWith(type+' rescheduled')){
        const namePart=l.t.split(': ').slice(1).join(': ');
        st.names=new Set(namePart.split(',').map(s=>s.trim()).filter(Boolean));
      }else if(tl.startsWith(type+' slot booked')||tl.startsWith(type+' slot rescheduled')){
        const slot=_anParseSlotTime12h(l.t);if(slot)st.slot=slot;
      }
    }
    if(l.t.toLowerCase().includes('arrived at site')&&l.who){
      for(const type of types){
        const st=state[type];
        if(!st.names.has(l.who)||!st.slot)continue;
        // Dedupe repeat "arrived at site" writes for the same person on the same day (e.g. a
        // network retry re-firing the confirm) — these are one real visit, not two attempts.
        const dayKey=l.who+'|'+_anDateIST(l.d);
        if(st.seenDays&&st.seenDays.has(dayKey))continue;
        st.seenDays=st.seenDays||new Set();st.seenDays.add(dayKey);
        out[type].push({name:l.who,slot:st.slot,d:l.d,bucket:_anArrivalBucket(st.slot,l.d)});
      }
    }
  }
  return out;
}
// Same idea as _anInstallOrderAttempts but for a single-type audit order — one auditor field, no
// per-type split. Any "slot booked/updated/rebooked" message updates the slot; only ones that
// literally say "auditor cleared" also reset the auditor. Checking the substring rather than a
// fixed prefix matters here: a live order (ENQ2026070177346, found 2026-07-29 while verifying this
// feature) carries a log entry reading "Slot rebooked: Sat, 4 Jul · 9:00 AM — Client preference" —
// an older log-message format from before SM_Audit_Dashboard.html's current wording ("Slot rebooked
// — auditor cleared, reassignment needed: ...") existed. That order's auditor was never actually
// disconnected (confirmed live: auditor_name unchanged throughout), so a bare "slot rebooked" must
// NOT be treated as an auditor-clearing signal, or it wrongly orphans a perfectly real arrival.
function _anAuditOrderAttempts(order){
  const logs=(order.log||[]).slice().sort((a,b)=>new Date(a.d)-new Date(b.d));
  let names=new Set(),slot=null;
  const seenDays=new Set();
  const out=[];
  for(const l of logs){
    if(!l.t)continue;
    const tl=l.t.toLowerCase();
    if(tl.startsWith('auditor assigned')){
      let namePart=l.t.split(': ').slice(1).join(': ');
      namePart=namePart.split(' · ')[0].split(' ⚠')[0].trim();
      names=new Set([namePart].filter(Boolean));
    }else if(tl.startsWith('slot booked')||tl.startsWith('slot updated')||tl.startsWith('slot rebooked')||tl.startsWith('date/time updated')){
      const s=_anParseSlotTime12h(l.t);if(s)slot=s;
      if(tl.includes('auditor cleared'))names=new Set();
    }else if(tl.includes('arrived at site')&&l.who&&names.has(l.who)&&slot){
      // Dedupe repeat writes for the same auditor on the same day — one real visit, not two.
      const dayKey=l.who+'|'+_anDateIST(l.d);
      if(seenDays.has(dayKey))continue;
      seenDays.add(dayKey);
      out.push({name:l.who,slot,d:l.d,bucket:_anArrivalBucket(slot,l.d)});
    }
  }
  return out;
}
// installs: full all-time array (not pre-filtered) — attempts are scoped by from/to on each
// attempt's OWN arrival date, independent of the parent subjob's current status/date, since a real
// visit's punctuality doesn't stop being real just because the job was later reassigned/rescheduled.
// reachedRows: the existing "reached site" canonical rows (note 74) — used ONLY to emit a visible
// "no arrival log matched" placeholder for eligible jobs that got zero real attempts (e.g. an SM
// override or a broken/empty log, see CLAUDE.md note 78) — never counted toward onTime/late.
function _anInstallArrivalStats(installs,from,to,reachedRows){
  const byName={};let onTime=0,late=0;const tagged=[];
  const matchedKeys=new Set();
  for(const order of installs){
    const byType=_anInstallOrderAttempts(order);
    for(const type of Object.keys(byType)){
      for(const att of byType[type]){
        const d=_anDateIST(att.d);
        if(d<from||d>to)continue;
        matchedKeys.add(order.pi+'|'+type);
        tagged.push({pi:order.pi,date:d,order,type,name:att.name,bucket:att.bucket});
        if(!att.bucket)continue;
        if(att.bucket==='late')late++;else onTime++;
        if(!byName[att.name])byName[att.name]={onTime:0,late:0};
        byName[att.name][att.bucket]++;
      }
    }
  }
  for(const row of reachedRows){
    if(matchedKeys.has(row.pi+'|'+row.type))continue;
    tagged.push({pi:row.pi,date:row.date,order:row.order,type:row.type,name:null,bucket:null});
  }
  return {agg:{onTime,late},byName,tagged};
}
// audits: full all-time array; reachedRows: existing "reached site" (completed) canonical rows —
// same placeholder-only role as _anInstallArrivalStats' reachedRows above.
function _anAuditArrivalStats(audits,from,to,reachedRows){
  const byName={};let onTime=0,late=0;const tagged=[];
  const matchedPIs=new Set();
  for(const o of audits){
    const attempts=_anAuditOrderAttempts(o);
    for(const att of attempts){
      const d=_anDateIST(att.d);
      if(d<from||d>to)continue;
      matchedPIs.add(o.pi);
      tagged.push({pi:o.pi,date:d,order:o,name:att.name,bucket:att.bucket});
      if(!att.bucket)continue;
      if(att.bucket==='late')late++;else onTime++;
      if(!byName[att.name])byName[att.name]={onTime:0,late:0};
      byName[att.name][att.bucket]++;
    }
  }
  for(const o of reachedRows){
    if(matchedPIs.has(o.pi))continue;
    tagged.push({pi:o.pi,date:o.date,order:o,name:null,bucket:null});
  }
  return {agg:{onTime,late},byName,tagged};
}

// Ratings join — audit: unambiguous via order_id (1 audit order = 1 rating max).
// Returns a Map from audit-order-row -> rating (only for rows that actually have one).
function _anAttachAuditRatings(completedRows,ratings){
  const byOrder={};
  for(const r of ratings){ if(r.order_type==='audit'&&r.order_id) byOrder[r.order_id]=r; }
  const byPi={}; // legacy fallback for rating rows written before order_id existed
  for(const r of ratings){ if(r.order_type==='audit'&&!r.order_id) byPi[r.pi]=r; }
  const map=new Map();
  for(const o of completedRows){
    const r=byOrder[o.id]||byPi[o.pi];
    if(r) map.set(o,r);
  }
  return map;
}
// Ratings join — install: order_id on a rating is the PARENT order id, shared by every subjob on
// that order, so it does NOT disambiguate which subjob a rating belongs to when 2+ are completed on
// the same order. Disambiguate by matching the rating's staff_email against the row's assigned
// installer emails first; if that's still ambiguous (same installer completed 2 subjobs on one
// order), fall back to nearest completion-timestamp. Known limitation, documented in the footer.
function _anAttachInstallRatings(canonRows,ratings){
  const doneRows=canonRows.filter(r=>['completed','partial'].includes(r.status));
  const byOrder={};
  for(const r of ratings){ if(r.order_type==='install'){ const k=r.order_id||('pi:'+r.pi); (byOrder[k]=byOrder[k]||[]).push(r); } }
  const byOrderRows={};
  for(const row of doneRows){ (byOrderRows[row.orderId]=byOrderRows[row.orderId]||[]).push(row); }
  const attached=new Map();
  for(const orderId of Object.keys(byOrderRows)){
    const rows=byOrderRows[orderId];
    const cands=(byOrder[orderId]||[]).slice();
    if(!cands.length) continue;
    if(rows.length===1){
      attached.set(rows[0],cands.sort((a,b)=>(b.created_at||'').localeCompare(a.created_at||''))[0]);
      continue;
    }
    for(const row of rows){
      const emails=new Set((row.installers||[]).map(a=>a.installer_email).filter(Boolean));
      const idx=cands.findIndex(c=>emails.has(c.staff_email));
      if(idx>=0) attached.set(row,cands.splice(idx,1)[0]);
    }
    for(const row of rows.filter(r=>!attached.has(r))){
      if(!cands.length) break;
      let bestI=-1,bestDiff=Infinity;
      cands.forEach((c,i)=>{const d=Math.abs(new Date(c.created_at)-new Date(row.date));if(d<bestDiff){bestDiff=d;bestI=i;}});
      if(bestI>=0) attached.set(row,cands.splice(bestI,1)[0]);
    }
  }
  return attached;
}

function _anInstallerMap(canonRows,ratingMap,arrByName){
  const map={};
  for(const row of canonRows){
    for(const inst of row.installers){
      const k=inst.installer_email||inst.installer_name;
      if(!k) continue;
      if(!map[k]) map[k]={name:inst.installer_name||k,email:inst.installer_email||'',orders:0,completed:0,wfQty:0,wpRolls:0,wpSqft:0,q1:[],q2:[],q3:[]};
      map[k].orders++;
      if(['completed','partial'].includes(row.status)) map[k].completed++;
      for(const it of row.items){
        // SKU items now carry a single sqft measurement (no separate flooring qty / wallpaper rolls field).
        // Roll count is always derived: ceil(sqft/57). parseFloat guards against stray legacy non-numeric values.
        const sqft=parseFloat(it.sqft)||0;
        if(row.type==='flooring') map[k].wfQty+=sqft;
        else{map[k].wpSqft+=sqft;map[k].wpRolls+=sqft?Math.ceil(sqft/SQFT_PER_ROLL):0;}
      }
    }
    const r=ratingMap.get(row);
    if(r){
      for(const inst of row.installers){
        const k=inst.installer_email||inst.installer_name;if(!k||!map[k])continue;
        if(r.q1_score)map[k].q1.push(+r.q1_score);
        if(r.q2_score)map[k].q2.push(+r.q2_score);
        if(r.q3_score)map[k].q3.push(+r.q3_score);
      }
    }
  }
  for(const k of Object.keys(map)){
    const ar=arrByName[map[k].name]||{onTime:0,late:0};
    map[k].arrOnTime=ar.onTime; map[k].arrLate=ar.late;
  }
  // An installer reassigned away from every currently-live subjob (note 79) won't appear in
  // canonRows at all, but their real logged arrival attempt(s) still count toward the aggregate
  // % above — surface them here too so the per-installer table doesn't silently disagree with it.
  for(const name of Object.keys(arrByName)){
    if(Object.values(map).some(m=>m.name===name))continue;
    map[name]={name,email:'',orders:0,completed:0,wfQty:0,wpRolls:0,wpSqft:0,q1:[],q2:[],q3:[],arrOnTime:arrByName[name].onTime,arrLate:arrByName[name].late};
  }
  return Object.values(map).sort((a,b)=>b.orders-a.orders);
}

function _anAuditorMap(auditFiltered,ratingMap,arrByName){
  const map={};
  for(const o of auditFiltered){
    const k=o.auditor_email||o.auditor_name;if(!k) continue;
    if(!map[k]) map[k]={name:o.auditor_name||k,email:o.auditor_email||'',orders:0,completed:0,q1:[],q2:[],q3:[]};
    map[k].orders++;
    if(o.status==='completed') map[k].completed++;
    const r=ratingMap.get(o);
    if(r){
      if(r.q1_score)map[k].q1.push(+r.q1_score);
      if(r.q2_score)map[k].q2.push(+r.q2_score);
      if(r.q3_score)map[k].q3.push(+r.q3_score);
    }
  }
  for(const k of Object.keys(map)){
    const ar=arrByName[map[k].name]||{onTime:0,late:0};
    map[k].arrOnTime=ar.onTime; map[k].arrLate=ar.late;
  }
  // Same reasoning as _anInstallerMap above — an auditor reassigned off every audit in
  // auditFiltered still has their own real attempt(s) counted in the aggregate %.
  for(const name of Object.keys(arrByName)){
    if(Object.values(map).some(m=>m.name===name))continue;
    map[name]={name,email:'',orders:0,completed:0,q1:[],q2:[],q3:[],arrOnTime:arrByName[name].onTime,arrLate:arrByName[name].late};
  }
  return Object.values(map).sort((a,b)=>b.orders-a.orders);
}

/* ---- Analytics metric drill-down (which rows make up a metric's numerator/denominator) ---- */

function downloadDrillCSV(key){
  const d=window._anDrill&&window._anDrill[key];
  if(!d||!d.rows.length){toast('Nothing to export');return;}
  const header=['Enquiry ID','Customer','Phone','BM','Date','Result'];
  const lines=[header.join(',')].concat(d.rows.map(r=>[r.pi||'',r.customer||'',r.phone||'',r.bm||'',r.date||'',r.result].map(_csvEscape).join(',')));
  const blob=new Blob(['﻿'+lines.join('\r\n')],{type:'text/csv;charset=utf-8;'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=(d.title||'metric').replace(/[^a-z0-9]+/gi,'_').toLowerCase()+'.csv';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

// Renders the Apply/Last-7/30/90-days date-range control for one section ('Audit' or 'Install'),
// wired to that section's own analytics{kind}From/To vars — kept as one function instead of two
// near-duplicate blocks so both stay byte-identical apart from which vars/ids they touch.
function _anDateRowHtml(kind){
  const idF='an'+kind+'From', idT='an'+kind+'To';
  const varF='analytics'+kind+'From', varT='analytics'+kind+'To';
  const from=kind==='Audit'?analyticsAuditFrom:analyticsInstallFrom;
  const to=kind==='Audit'?analyticsAuditTo:analyticsInstallTo;
  return `<div class="an-date-row">
    <span class="an-date-label">Date range</span>
    <input type="date" id="${idF}" class="an-date-inp" value="${from}">
    <span style="color:var(--muted);font-size:13px;padding:0 2px">to</span>
    <input type="date" id="${idT}" class="an-date-inp" value="${to}">
    <button class="an-apply-btn" onclick="${varF}=document.getElementById('${idF}').value;${varT}=document.getElementById('${idT}').value;drawAnalytics(document.getElementById('main'))">Apply</button>
    <button class="filt-btn" onclick="(function(){const t=new Date();${varT}=_anDstr(t);t.setDate(t.getDate()-6);${varF}=_anDstr(t);drawAnalytics(document.getElementById('main'))})()">Last 7 days</button>
    <button class="filt-btn" onclick="(function(){const t=new Date();${varT}=_anDstr(t);t.setDate(t.getDate()-29);${varF}=_anDstr(t);drawAnalytics(document.getElementById('main'))})()">Last 30 days</button>
    <button class="filt-btn" onclick="(function(){const t=new Date();${varT}=_anDstr(t);t.setDate(t.getDate()-89);${varF}=_anDstr(t);drawAnalytics(document.getElementById('main'))})()">Last 90 days</button>
  </div>`;
}
function drawAnalytics(m){
  window._anDrill={};
  const {installs,audits,ratings}=window._anData||{installs:[],audits:[],ratings:[]};
  const aFrom=analyticsAuditFrom, aTo=analyticsAuditTo, iFrom=analyticsInstallFrom, iTo=analyticsInstallTo;
  const todayStr=_anDstr(new Date());
  const TRACK_FROM='2026-07-02'; // arrival on time tracking start date

  // Install: one canonical row per subjob in range (no reschedule/multi-day double-counting)
  const iCanon=_anInstallCanon(installs,iFrom,iTo);
  const iTotal=iCanon.length;

  // Audit: completed orders by actual completion date; pending/in-progress by scheduled date
  const aFiltered=audits.filter(o=>o.date&&o.date>=aFrom&&o.date<=aTo);
  const aTotal=aFiltered.length;

  // Install calcs
  const iDone=iCanon.filter(a=>['completed','partial'].includes(a.status)); // "reached site & started work"
  // Log-mention count is a distinct, looser signal from confirmedDelayed below (date-field mismatch) —
  // it catches cases logged as delayed where nobody actually updated delivery_date, and vice versa.
  // Previously this reused the exact same hasDelay/date-comparison boolean as confirmedDelayed, so
  // both stats in the Delivery Date Tracking row always showed an identical number (2026-07-18 fix).
  const iDelayed=iCanon.filter(a=>a.logDelay).length;
  // Material Depot Audit % — fully automated phone-number match (no manual "audit_by" input is
  // consulted); denominator is the full canonical total, not a distinct-PI count.
  const auditPhones=new Set(audits.map(o=>o.phone).filter(Boolean));
  const iMDaudit=iCanon.filter(r=>r.order.phone&&auditPhones.has(r.order.phone)).length;
  const avgA=(arr,k)=>{const vs=arr.filter(r=>r[k]!=null).map(r=>+r[k]);return vs.length?+(vs.reduce((s,v)=>s+v,0)/vs.length).toFixed(1):null;};

  // Audit calcs
  const aCompleted=aFiltered.filter(o=>o.status==='completed').length;
  const aRescheduled=aFiltered.filter(o=>o.status==='reschedule').length;
  // Site Audit → Order Conversion %: distinct audit customers (by phone) in this range who
  // eventually placed an install order, any time — even after the range end.
  const aPhonesInRange=new Set(aFiltered.map(o=>o.phone).filter(Boolean));
  const aConvertedPhones=[...aPhonesInRange].filter(p=>installs.some(io=>io.phone===p));

  // Ratings — attached via completion-derived lookup (order_id / installer-email join), not an
  // independently-scoped ratings.created_at date filter. Count is always ⊆ the completed set.
  const aRatingMap=_anAttachAuditRatings(aFiltered.filter(o=>o.status==='completed'),ratings);
  const iRatingMap=_anAttachInstallRatings(iCanon,ratings);
  const AR=[...aRatingMap.values()];
  const IR=[...iRatingMap.values()];
  const IR_q1=avgA(IR,'q1_score'),IR_q2=avgA(IR,'q2_score'),IR_q3=avgA(IR,'q3_score');
  const IR_prom=IR.filter(r=>r.q1_score>=9).length,IR_det=IR.filter(r=>r.q1_score<=7).length;
  const IR_nps=IR.length?Math.round((IR_prom-IR_det)/IR.length*100):null;
  const AR_q1=avgA(AR,'q1_score'),AR_q2=avgA(AR,'q2_score'),AR_q3=avgA(AR,'q3_score');
  const AR_prom=AR.filter(r=>r.q1_score>=9).length,AR_det=AR.filter(r=>r.q1_score<=7).length;
  const AR_nps=AR.length?Math.round((AR_prom-AR_det)/AR.length*100):null;

  // Arrival on time — denominator is the "reached site" subset of the SAME canonical/filtered set
  // used everywhere else in this section (not an independently-scoped scan of the raw arrays).
  // "Reached site" = completed/partial OR atsite — atsite jobs are still in progress but the
  // "arrived at site" log entry (which is what this metric actually matches against) is written
  // the moment status flips to atsite, so an in-progress atsite job already has real arrival data
  // available. Deliberately broader than iDone/aCompleted (which stay completed/partial-only —
  // those drive Completion %, where an in-progress job must NOT count as done).
  const iTrackFrom=iFrom>TRACK_FROM?iFrom:TRACK_FROM;
  const aTrackFrom=aFrom>TRACK_FROM?aFrom:TRACK_FROM;
  const iArrivalEligible=iCanon.filter(a=>['completed','partial','atsite'].includes(a.status));
  const aArrivalEligible=aFiltered.filter(o=>['completed','atsite'].includes(o.status));
  const iReached=iArrivalEligible.filter(r=>r.date>=iTrackFrom);
  const aReached=aArrivalEligible.filter(o=>o.date>=aTrackFrom);
  const iArr=_anInstallArrivalStats(installs,iTrackFrom,iTo,iReached);
  const aArr=_anAuditArrivalStats(audits,aTrackFrom,aTo,aReached);
  const iArrTot=iArr.agg, aArrTot=aArr.agg;

  // Per-installer / per-auditor
  const installers=_anInstallerMap(iCanon,iRatingMap,iArr.byName);
  const auditors=_anAuditorMap(aFiltered,aRatingMap,aArr.byName);

  // Delivery breakdown
  const origTracked=iCanon.filter(a=>a.originalDelivery).length;
  const confirmedDelayed=iCanon.filter(a=>a.hasDelay).length;

  // Need action — live across all non-deleted install orders
  const naCount=installs.filter(o=>{
    if(['pending','deliv_delayed'].includes(o.status)&&o.delivery_date&&o.delivery_date<=todayStr) return true;
    if((o.subjobs||[]).some(sj=>sj.status==='reschedule')) return true;
    if(o.service&&o.service.follow_up_date&&o.service.follow_up_date<=todayStr) return true;
    return false;
  }).length;

  /* ---- Render helpers ---- */
  const pc=(n,d)=>d>0?Math.round(n/d*100):null;
  const pcc=p=>p===null?'var(--muted)':p>=80?'var(--green)':p>=50?'var(--amber)':'var(--red)';

  function _anDrillAttrs(drillKey){
    return (drillKey&&window._anDrill&&window._anDrill[drillKey])?` style="cursor:pointer" onclick="openAnalyticsDrill('${drillKey}')"`:'';
  }
  function _anDrillHint(drillKey){
    return (drillKey&&window._anDrill&&window._anDrill[drillKey])?`<div style="font-size:11px;color:var(--blue);font-weight:700;margin-top:6px">⤢ View &amp; export rows</div>`:'';
  }
  function pctCard(label,n,d,sub,note,drillKey){
    const p=pc(n,d);const c=pcc(p);
    return `<div class="an-card"${_anDrillAttrs(drillKey)}>
      <div class="an-label">${label}</div>
      <div class="an-val" style="color:${p===null?'var(--muted)':c}">${p!==null?p+'%':'—'}</div>
      ${p!==null?`<div class="an-bar"><div class="an-bar-fill" style="width:${p}%;background:${c}"></div></div>`:''}
      <div class="an-sub">${d>0?n+' of '+d:'No data'}</div>
      ${sub?`<div class="an-sub2">${sub}</div>`:''}
      ${note?`<div class="an-sub2" style="color:var(--amber)">${note}</div>`:''}
      ${_anDrillHint(drillKey)}
    </div>`;
  }
  function ratingCard(label,avg,cnt,drillKey){
    if(avg===null) return `<div class="an-card an-card-na"><div class="an-label">${label}</div><div class="an-val" style="color:var(--muted)">—</div><div class="an-sub">No ratings yet</div></div>`;
    const c=avg>=8?'var(--green)':avg>=6?'var(--amber)':'var(--red)';
    const s=Math.min(5,Math.round(avg/2));
    return `<div class="an-card"${_anDrillAttrs(drillKey)}>
      <div class="an-label">${label}</div>
      <div class="an-val" style="color:${c}">${avg}<span style="font-size:14px;color:var(--muted)">/10</span></div>
      <div class="an-stars">${'★'.repeat(s)+'☆'.repeat(5-s)}</div>
      <div class="an-sub">${cnt} rating${cnt!==1?'s':''} · in range</div>
      ${_anDrillHint(drillKey)}

  }
  function npsCard(label,nps,prom,det,total,drillKey){
    if(nps===null) return `<div class="an-card an-card-na"><div class="an-label">${label}</div><div class="an-val" style="color:var(--muted)">—</div><div class="an-sub">No ratings yet</div></div>`;
    const c=nps>=50?'var(--green)':nps>=0?'var(--amber)':'var(--red)';
    const pass=total-prom-det;
    return `<div class="an-card"${_anDrillAttrs(drillKey)}>
      <div class="an-label">${label}</div>
      <div class="an-val" style="color:${c}">${nps>=0?'+':''}${nps}</div>

      </div>

      ${_anDrillHint(drillKey)}

  }

        ${npsCard('NPS Score',AR_nps,AR_prom,AR_det,AR.length,'aRatings')}

      </div>

      <div style="font-size:11.5px;color:var(--muted);padding:10px 20px;border-bottom:1px solid var(--line)">Note: Rescheduled audits originally scheduled in range but moved to a future date appear under the original date AND the new date. Reschedule Rate counts audits currently in reschedule status within the selected range.</div>

      <div style="padding:14px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;background:${naCount>0?'var(--amberbg)':'var(--greenbg)'}">

      <div class="an-sub-head">Per-Installer Breakdown</div>
      ${installers.length?`<div style="overflow-x:auto"><table class="an-inst-table">
        <thead><tr>
          <th>Installer</th><th>Orders</th><th>Completed</th>
          <th>On-time Arrival %<small>from 2 Jul 2026</small></th>
          <th>Q1 Overall</th><th>Q2 Installer</th><th>Q3 Cleanliness</th><th>Area / Rolls</th>
        </tr></thead>
        <tbody>${instRows}</tbody>
      </table></div>`:`<div class="an-na-note">No installer assignments in this date range.</div>`}
    </div>

    <div class="an-footer">
      <b>Completion %:</b> Audit — completed ÷ total audits in range. Install — (completed + partially completed) ÷ total subjobs in range. Replaces the old separate "Job Card &amp; Signature %" metric.<br>
      <b>Ratings (NPS / Q1 / Q2 / Q3):</b> Attached to each completed order via its own ID (audit: unambiguous; install: matched by assigned-installer email, with a nearest-completion-time fallback) — not an independent date filter on the ratings table. Count is always a subset of that section's completed total. Known limitation: if the same installer completes two subjobs on one order, the rating may occasionally be attributed to the wrong one of the two.<br>
      <b>Arrival on time:</b> Only counted among jobs that actually reached site (audit: completed; install: completed or partially completed), floor 2 Jul 2026 (when tracking began). &gt;3 min late = delayed. N/T = no tracked data in range.<br>
      <b>Material Depot Audit %:</b> Fully automated — phone-number match between install and site-audit orders, no manual "audit type" input is used. Matched against phone numbers for all non-deleted install orders, regardless of creation date.<br>
      <b>Site Audit → Order Conversion %:</b> Of the distinct customers (by phone) audited in this range, the % who placed an install order at any time — including after the range ends.<br>
      <b>Delivery delay (log-based):</b> Any log entry mentioning "delay". <b>Confirmed delayed (new):</b> compares original_delivery_date vs current delivery_date — set for orders created from 2 Jul 2026.<br>
      <b>One row per subjob:</b> reschedule history and multi-day custom installs never produce more than one row per subjob in this section's counts.<br>
      <b>NPS:</b> Promoters Q1 ≥ 9, Detractors Q1 ≤ 7. Range −100 to +100.
    </div>`;
}
