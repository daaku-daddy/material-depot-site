  // days. This init MUST live here: drawAnalytics compares order dates against these strings, and
  // an empty string matches nothing, so an uninitialised range renders a silently empty tab.
  if(!analyticsAuditFrom){
    const t=new Date();analyticsAuditTo=_anDstr(t);t.setDate(t.getDate()-6);analyticsAuditFrom=_anDstr(t);
  }
  if(!analyticsInstallFrom){
    const t=new Date();analyticsInstallTo=_anDstr(t);t.setDate(t.getDate()-6);analyticsInstallFrom=_anDstr(t);
  }
  if(!anCatFrom){
    const t=new Date();
    anCatTo=_anClamp(_anDstr(t));
    anCatFrom=_anClamp(_anDstr(new Date(t.getFullYear(),t.getMonth(),1)));
    if(anCatFrom>anCatTo)anCatFrom=_anClamp(MD_AN_DATA_FROM);
  }
  m.innerHTML=`
    <div class="page-head"><h1>Analytics</h1><p>Category commercial performance and field-operations execution, in one place. Each tab keeps its own definitions visible — no number on this page is left unexplained.</p></div>
    <div class="an-tabs" id="anTabs">${MD_AN_TABS.filter(t=>!(SESSION&&SESSION.role==='service_mgr'&&t.k!=='execution')).map(t=>
      `<button class="an-tab${t.k===anTab?' active':''}" data-antab="${t.k}" onclick="anSetTab('${t.k}')">${t.ico} ${t.label}<small>${t.sub}</small></button>`).join('')}</div>
    <div id="anTabBody"><div class="loading-row"><span class="spinner"></span></div></div>`;
  await anRenderTab();
}
function anSetTab(tab){
  // Defence in depth: the commercial tabs carry revenue and target data a service_mgr does not get.
  // renderAnalytics already forces them onto Execution, and their tab bar only renders that one
  // button — this guard is what stops a stale localStorage value or a stray call from getting past
  // it. (Role gating in this app is client-side throughout, so this is a scoping rule, not a
  // security boundary — same as the .admin-only rail items.)
  if(SESSION&&SESSION.role==='service_mgr'&&tab!=='execution')return;
  anTab=tab;
  try{localStorage.setItem('md_an_tab',tab);}catch(e){}
  document.querySelectorAll('#anTabs .an-tab').forEach(b=>b.classList.toggle('active',b.dataset.antab===tab));

async function anRenderTab(){
  const body=_anBody();
  body.innerHTML='<div class="loading-row"><span class="spinner"></span></div>';
  if(_anIsExec()){
    const ok=await _anFetchData();
    if(!ok){body.innerHTML='<div style="padding:24px;color:var(--red);font-weight:600">⚠ Failed to load operations data — network timeout. Please try again.</div>';return;}
    try{drawAnalytics(body);}catch(e){
      body.innerHTML='<div style="padding:24px;color:var(--red);font-weight:600">⚠ Analytics render error: '+e.message+'. Please reload.</div>';
    }
    _anStartPoll();
    return;
  }
  if(_anPollTid){clearInterval(_anPollTid);_anPollTid=null;}
  try{
    if(!_anCatDs)_anCatDs=await mdAnDataset();
    if(!anTargets){
      const st=await _loadSetting('cat_analytics_targets');
      _anTargetsId=st.id;anTargets=mdAnTargetsMerge(st.value);
    }
  }catch(e){
    body.innerHTML='<div style="padding:24px;color:var(--red);font-weight:600">⚠ Could not load category analytics — '+(e.message||'try again')+'</div>';return;
  }
  anDrawCat();
}
// Auto-refresh only matters for the Execution tab (live ops data). The commercial dataset is a
// fixed snapshot until the Metabase source is wired, so polling it would just burn a redraw.
function _anStartPoll(){
  if(_anPollTid)clearInterval(_anPollTid);
  _anPollTid=setInterval(async()=>{
    if(currentView!=='analytics'||!_anIsExec()||document.hidden)return;
    const active=document.activeElement;
    if(active&&['anAuditFrom','anAuditTo','anInstallFrom','anInstallTo'].includes(active.id))return;
    const fresh=await _anFetchData();
    if(fresh&&currentView==='analytics'&&_anIsExec())drawAnalytics(_anBody());
  },60000);
}

function _anDownloadCsv(name,rows){
  const lines=rows.map(r=>(r||[]).map(_csvEscape).join(','));
  const blob=new Blob(['﻿'+lines.join('\r\n')],{type:'text/csv;charset=utf-8;'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name+'.csv';
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function anDrillCsv(key){
  const d=window.MD_AN_DRILL&&window.MD_AN_DRILL[key];
  if(!d||!d.rows.length){toast('Nothing to export');return;}
  _anDownloadCsv(d.title.replace(/[^a-z0-9]+/gi,'_').toLowerCase(),[d.cols].concat(d.rows));
}
function anCsv(key){

function _anTgtNum(el,max){
  let v=parseFloat(el.value);

  if(max!=null&&v>max)v=max;

}

// Returns one canonical row per subjob within [from,to] — never more than one, regardless of
// reschedule history or multi-day span. Completed/partial: keyed on completion-log date (or latest
// known scheduled date if no log match). Not-done: keyed on current scheduled date(s) — membership
// is "any of its current dates overlaps the range", but only ONE row is ever emitted per subjob.
function _anInstallCanon(installs,from,to){
  const out=[];
  for(const o of installs){
    for(const sj of (o.subjobs||[])){
      const isDone=sj.status==='completed'; // sub-job 'partial' is in-progress (Phase 3), dated by scheduled date
      let repDate=null,matched=false;

      // Scheduled date candidate(s) — always computed, regardless of completion status. Used for
      // display/status/delivery-tracking date (repDate) when not yet done, and separately as the
      // arrival-matching date for done jobs (arrival can land a day before the completion log is
      // written on a multi-day job, so it must not require an exact match against the completion date).
      const schedCand=[];
      if(sj.date) schedCand.push(sj.date);
      for(const a of (sj.assignments||[])){
        if(a.mode==='custom')(a.dates||[]).forEach(d=>schedCand.push(d));
        else if(a.date) schedCand.push(a.date);
      }

      if(isDone){
        const complKey=(sj.type==='wallpaper'?'Wallpaper':'Flooring')+' installation completed';
        let cd=null;
        for(const l of (o.log||[])){
          if(l.t&&l.d&&l.t.startsWith(complKey)){const d=_anDateIST(l.d);if(!cd||d>cd)cd=d;}
        }
        if(!cd) cd=schedCand.length?schedCand.sort().slice(-1)[0]:null;
        repDate=cd;
        matched=!!repDate&&repDate>=from&&repDate<=to;
      }else{
        if(schedCand.length){
          matched=schedCand.some(d=>d>=from&&d<=to);
          const inRange=schedCand.filter(d=>d>=from&&d<=to).sort();
          repDate=inRange.length?inRange[0]:schedCand.sort()[0];
        }
      }
      if(!matched) continue;

      const asgns=(sj.assignments||[]).filter(a=>a.mode==='custom'?(a.dates||[]).includes(repDate):a.date===repDate);
      const useAsgns=asgns.length?asgns:(sj.assignments||[]);
      const primary=useAsgns.find(a=>a.primary)||useAsgns[0]||null;

      out.push({
        pi:o.pi, orderId:o.id, sjId:sj.id, type:sj.type, status:sj.status, date:repDate,
        schedDates:schedCand,
        slot:primary?(primary.slots&&primary.slots[0])||'':sj.slot||'',
        installers:useAsgns, items:sj.items||[],
        hasDelay:!!(o.original_delivery_date&&o.delivery_date&&o.original_delivery_date!==o.delivery_date),
        logDelay:(o.log||[]).some(l=>l.t&&/delay/i.test(l.t)),
        originalDelivery:o.original_delivery_date||null,
        currentDelivery:o.delivery_date||null,
        order:o,
      });
    }
  }
  return out;
}

// Row-level "did this specific job's assigned actor(s) arrive on time?" resolver.
// Matches an "arrived at site" log entry to THIS row only (same date, name among this row's actors) —
// not an independent scan of the whole raw array, so results can never drift from the canonical total.
function _anArrivalBucket(slot,logIso){
  if(!slot||!/^\d{1,2}:\d{2}$/.test(slot)) return null;
  const [sh,sm]=slot.split(':').map(Number);
  return (_anMinsIST(logIso)-(sh*60+sm))>3?'late':'onTime';
}
// Recovers a 24h "HH:MM" from a log message's trailing 12h time (e.g. "...· 2:00 PM") — these are
// the display-formatted strings slotLabel()/fmtDate() write into log text; there is no raw HH:MM
// stored alongside them, so this is the only way to reconstruct what slot was in effect at a given
// point in an order's history. Returns null if no such time is found at the end of the string.
function _anParseSlotTime12h(str){
  const m=str.match(/(\d{1,2}):(\d{2})\s*(AM|PM)\s*$/i);
  if(!m)return null;
  let h=parseInt(m[1],10);const mm=m[2];const ap=m[3].toUpperCase();
  if(ap==='PM'&&h!==12)h+=12;
  if(ap==='AM'&&h===12)h=0;
  return String(h).padStart(2,'0')+':'+mm;
}
// Replays one install order's log chronologically to recover EVERY real "installer arrived at
// site" event, tied to whichever installer+slot were actually in effect at that moment — not just
// the subjob's CURRENT assignment. This matters because reassignment overwrites sj.assignments[]
// in place (SM_Install_Dashboard.html's saveAssign: `sj.assignments=valid`) with no history kept on
// the live document — the only surviving record of "who was assigned before" is the log text itself
// (added 2026-07-29, CLAUDE.md note 79, per explicit user request: a job reassigned mid-flight
// should credit/debit EACH installer's own real attempt at their own assigned time, not silently
// drop the earlier one just because someone else now holds the subjob).
// Returns {flooring:[{name,slot,d,bucket}], wallpaper:[...]} — only for types actually present.
function _anInstallOrderAttempts(order){
  const types=[...new Set((order.subjobs||[]).map(sj=>sj.type).filter(Boolean))];
  if(!types.length)return {};
  const logs=(order.log||[]).slice().sort((a,b)=>new Date(a.d)-new Date(b.d));
  const state={};types.forEach(t=>{state[t]={names:new Set(),slot:null};});
  const out={};types.forEach(t=>{out[t]=[];});
  for(const l of logs){
    if(!l.t)continue;
    const tl=l.t.toLowerCase();
    for(const type of types){
      const st=state[type];
      if(tl.startsWith(type+' slot cleared')){st.names=new Set();st.slot=null;}
      else if(tl.startsWith(type+' assigned')||tl.startsWith(type+' rescheduled')){
        const namePart=l.t.split(': ').slice(1).join(': ');
        st.names=new Set(namePart.split(',').map(s=>s.trim()).filter(Boolean));
      }else if(tl.startsWith(type+' slot booked')||tl.startsWith(type+' slot rescheduled')){
        const slot=_anParseSlotTime12h(l.t);if(slot)st.slot=slot;
      }
    }
    if(l.t.toLowerCase().includes('arrived at site')&&l.who){
      for(const type of types){
        const st=state[type];
        if(!st.names.has(l.who)||!st.slot)continue;
        // Dedupe repeat "arrived at site" writes for the same person on the same day (e.g. a
        // network retry re-firing the confirm) — these are one real visit, not two attempts.
        const dayKey=l.who+'|'+_anDateIST(l.d);
        if(st.seenDays&&st.seenDays.has(dayKey))continue;
        st.seenDays=st.seenDays||new Set();st.seenDays.add(dayKey);
        out[type].push({name:l.who,slot:st.slot,d:l.d,bucket:_anArrivalBucket(st.slot,l.d)});
      }
    }
  }
  return out;
}
// Same idea as _anInstallOrderAttempts but for a single-type audit order — one auditor field, no
// per-type split. Any "slot booked/updated/rebooked" message updates the slot; only ones that
// literally say "auditor cleared" also reset the auditor. Checking the substring rather than a
// fixed prefix matters here: a live order (ENQ2026070177346, found 2026-07-29 while verifying this
// feature) carries a log entry reading "Slot rebooked: Sat, 4 Jul · 9:00 AM — Client preference" —
// an older log-message format from before SM_Audit_Dashboard.html's current wording ("Slot rebooked
// — auditor cleared, reassignment needed: ...") existed. That order's auditor was never actually
// disconnected (confirmed live: auditor_name unchanged throughout), so a bare "slot rebooked" must
// NOT be treated as an auditor-clearing signal, or it wrongly orphans a perfectly real arrival.
function _anAuditOrderAttempts(order){
  const logs=(order.log||[]).slice().sort((a,b)=>new Date(a.d)-new Date(b.d));
  let names=new Set(),slot=null;
  const seenDays=new Set();
  const out=[];
  for(const l of logs){
    if(!l.t)continue;
    const tl=l.t.toLowerCase();
    if(tl.startsWith('auditor assigned')){
      let namePart=l.t.split(': ').slice(1).join(': ');
      namePart=namePart.split(' · ')[0].split(' ⚠')[0].trim();
      names=new Set([namePart].filter(Boolean));
    }else if(tl.startsWith('slot booked')||tl.startsWith('slot updated')||tl.startsWith('slot rebooked')||tl.startsWith('date/time updated')){
      const s=_anParseSlotTime12h(l.t);if(s)slot=s;
      if(tl.includes('auditor cleared'))names=new Set();
    }else if(tl.includes('arrived at site')&&l.who&&names.has(l.who)&&slot){
      // Dedupe repeat writes for the same auditor on the same day — one real visit, not two.
      const dayKey=l.who+'|'+_anDateIST(l.d);
      if(seenDays.has(dayKey))continue;
      seenDays.add(dayKey);
      out.push({name:l.who,slot,d:l.d,bucket:_anArrivalBucket(slot,l.d)});
    }
  }
  return out;
}
// installs: full all-time array (not pre-filtered) — attempts are scoped by from/to on each
// attempt's OWN arrival date, independent of the parent subjob's current status/date, since a real
// visit's punctuality doesn't stop being real just because the job was later reassigned/rescheduled.
// reachedRows: the existing "reached site" canonical rows (note 74) — used ONLY to emit a visible
// "no arrival log matched" placeholder for eligible jobs that got zero real attempts (e.g. an SM
// override or a broken/empty log, see CLAUDE.md note 78) — never counted toward onTime/late.
function _anInstallArrivalStats(installs,from,to,reachedRows){
  const byName={};let onTime=0,late=0;const tagged=[];
  const matchedKeys=new Set();
  for(const order of installs){
    const byType=_anInstallOrderAttempts(order);
    for(const type of Object.keys(byType)){
      for(const att of byType[type]){
        const d=_anDateIST(att.d);
        if(d<from||d>to)continue;
        matchedKeys.add(order.pi+'|'+type);
        tagged.push({pi:order.pi,date:d,order,type,name:att.name,bucket:att.bucket});
        if(!att.bucket)continue;
        if(att.bucket==='late')late++;else onTime++;
        if(!byName[att.name])byName[att.name]={onTime:0,late:0};
        byName[att.name][att.bucket]++;
      }
    }
  }
  for(const row of reachedRows){
    if(matchedKeys.has(row.pi+'|'+row.type))continue;
    tagged.push({pi:row.pi,date:row.date,order:row.order,type:row.type,name:null,bucket:null});
  }
  return {agg:{onTime,late},byName,tagged};
}
// audits: full all-time array; reachedRows: existing "reached site" (completed) canonical rows —
// same placeholder-only role as _anInstallArrivalStats' reachedRows above.
function _anAuditArrivalStats(audits,from,to,reachedRows){
  const byName={};let onTime=0,late=0;const tagged=[];
  const matchedPIs=new Set();
  for(const o of audits){
    const attempts=_anAuditOrderAttempts(o);
    for(const att of attempts){
      const d=_anDateIST(att.d);
      if(d<from||d>to)continue;
      matchedPIs.add(o.pi);
      tagged.push({pi:o.pi,date:d,order:o,name:att.name,bucket:att.bucket});
      if(!att.bucket)continue;
      if(att.bucket==='late')late++;else onTime++;
      if(!byName[att.name])byName[att.name]={onTime:0,late:0};
      byName[att.name][att.bucket]++;
    }
  }
  for(const o of reachedRows){
    if(matchedPIs.has(o.pi))continue;
    tagged.push({pi:o.pi,date:o.date,order:o,name:null,bucket:null});
  }
  return {agg:{onTime,late},byName,tagged};
}

// Ratings join — audit: unambiguous via order_id (1 audit order = 1 rating max).
// Returns a Map from audit-order-row -> rating (only for rows that actually have one).
function _anAttachAuditRatings(completedRows,ratings){
  const byOrder={};
  for(const r of ratings){ if(r.order_type==='audit'&&r.order_id) byOrder[r.order_id]=r; }
  const byPi={}; // legacy fallback for rating rows written before order_id existed
  for(const r of ratings){ if(r.order_type==='audit'&&!r.order_id) byPi[r.pi]=r; }
  const map=new Map();
  for(const o of completedRows){
    const r=byOrder[o.id]||byPi[o.pi];
    if(r) map.set(o,r);
  }
  return map;
}
// Ratings join — install: order_id on a rating is the PARENT order id, shared by every subjob on
// that order, so it does NOT disambiguate which subjob a rating belongs to when 2+ are completed on
// the same order. Disambiguate by matching the rating's staff_email against the row's assigned
// installer emails first; if that's still ambiguous (same installer completed 2 subjobs on one
// order), fall back to nearest completion-timestamp. Known limitation, documented in the footer.
function _anAttachInstallRatings(canonRows,ratings){
  const doneRows=canonRows.filter(r=>r.status==='completed'); // ratings only attach to fully-completed sub-jobs
  const byOrder={};
  for(const r of ratings){ if(r.order_type==='install'){ const k=r.order_id||('pi:'+r.pi); (byOrder[k]=byOrder[k]||[]).push(r); } }
  const byOrderRows={};
  for(const row of doneRows){ (byOrderRows[row.orderId]=byOrderRows[row.orderId]||[]).push(row); }
  const attached=new Map();
  for(const orderId of Object.keys(byOrderRows)){
    const rows=byOrderRows[orderId];
    const cands=(byOrder[orderId]||[]).slice();
    if(!cands.length) continue;
    if(rows.length===1){
      attached.set(rows[0],cands.sort((a,b)=>(b.created_at||'').localeCompare(a.created_at||''))[0]);
      continue;
    }
    for(const row of rows){
      const emails=new Set((row.installers||[]).map(a=>a.installer_email).filter(Boolean));
      const idx=cands.findIndex(c=>emails.has(c.staff_email));
      if(idx>=0) attached.set(row,cands.splice(idx,1)[0]);
    }
    for(const row of rows.filter(r=>!attached.has(r))){
      if(!cands.length) break;
      let bestI=-1,bestDiff=Infinity;
      cands.forEach((c,i)=>{const d=Math.abs(new Date(c.created_at)-new Date(row.date));if(d<bestDiff){bestDiff=d;bestI=i;}});
      if(bestI>=0) attached.set(row,cands.splice(bestI,1)[0]);
    }
  }
  return attached;
}

function _anInstallerMap(canonRows,ratingMap,arrByName){
  const map={};
  for(const row of canonRows){
    for(const inst of row.installers){
      const k=inst.installer_email||inst.installer_name;
      if(!k) continue;
      if(!map[k]) map[k]={name:inst.installer_name||k,email:inst.installer_email||'',orders:0,completed:0,wfQty:0,wpRolls:0,wpSqft:0,q1:[],q2:[],q3:[]};
      map[k].orders++;
      if(row.status==='completed') map[k].completed++; // partial = in-progress, not a completed job
      for(const it of row.items){
        // SKU items now carry a single sqft measurement (no separate flooring qty / wallpaper rolls field).
        // Roll count is always derived: ceil(sqft/57). parseFloat guards against stray legacy non-numeric values.
        const sqft=parseFloat(it.sqft)||0;
        if(row.type==='flooring') map[k].wfQty+=sqft;
        else{map[k].wpSqft+=sqft;map[k].wpRolls+=sqft?Math.ceil(sqft/SQFT_PER_ROLL):0;}
      }
    }
    const r=ratingMap.get(row);
    if(r){
      for(const inst of row.installers){
        const k=inst.installer_email||inst.installer_name;if(!k||!map[k])continue;
        if(r.q1_score)map[k].q1.push(+r.q1_score);
        if(r.q2_score)map[k].q2.push(+r.q2_score);
        if(r.q3_score)map[k].q3.push(+r.q3_score);
      }
    }
  }
  for(const k of Object.keys(map)){
    const ar=arrByName[map[k].name]||{onTime:0,late:0};
    map[k].arrOnTime=ar.onTime; map[k].arrLate=ar.late;
  }
  // An installer reassigned away from every currently-live subjob (note 79) won't appear in
  // canonRows at all, but their real logged arrival attempt(s) still count toward the aggregate
  // % above — surface them here too so the per-installer table doesn't silently disagree with it.
  for(const name of Object.keys(arrByName)){
    if(Object.values(map).some(m=>m.name===name))continue;
    map[name]={name,email:'',orders:0,completed:0,wfQty:0,wpRolls:0,wpSqft:0,q1:[],q2:[],q3:[],arrOnTime:arrByName[name].onTime,arrLate:arrByName[name].late};
  }
  return Object.values(map).sort((a,b)=>b.orders-a.orders);
}

function _anAuditorMap(auditFiltered,ratingMap,arrByName){
  const map={};
  for(const o of auditFiltered){
    const k=o.auditor_email||o.auditor_name;if(!k) continue;
    if(!map[k]) map[k]={name:o.auditor_name||k,email:o.auditor_email||'',orders:0,completed:0,q1:[],q2:[],q3:[]};
    map[k].orders++;
    if(o.status==='completed') map[k].completed++;
    const r=ratingMap.get(o);
    if(r){
      if(r.q1_score)map[k].q1.push(+r.q1_score);
      if(r.q2_score)map[k].q2.push(+r.q2_score);
      if(r.q3_score)map[k].q3.push(+r.q3_score);
    }
  }
  for(const k of Object.keys(map)){
    const ar=arrByName[map[k].name]||{onTime:0,late:0};
    map[k].arrOnTime=ar.onTime; map[k].arrLate=ar.late;
  }
  // Same reasoning as _anInstallerMap above — an auditor reassigned off every audit in
  // auditFiltered still has their own real attempt(s) counted in the aggregate %.
  for(const name of Object.keys(arrByName)){
    if(Object.values(map).some(m=>m.name===name))continue;
    map[name]={name,email:'',orders:0,completed:0,q1:[],q2:[],q3:[],arrOnTime:arrByName[name].onTime,arrLate:arrByName[name].late};
  }
  return Object.values(map).sort((a,b)=>b.orders-a.orders);
}

/* ---- Analytics metric drill-down (which rows make up a metric's numerator/denominator) ---- */
window._anDrill={};
function _anSetDrill(key,title,note,entityType,rows){

}

function downloadDrillCSV(key){
  const d=window._anDrill&&window._anDrill[key];
  if(!d||!d.rows.length){toast('Nothing to export');return;}
  const header=['Enquiry ID','Customer','Phone','BM','Date','Result'];
  const lines=[header.join(',')].concat(d.rows.map(r=>[r.pi||'',r.customer||'',r.phone||'',r.bm||'',r.date||'',r.result].map(_csvEscape).join(',')));
  const blob=new Blob(['﻿'+lines.join('\r\n')],{type:'text/csv;charset=utf-8;'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=(d.title||'metric').replace(/[^a-z0-9]+/gi,'_').toLowerCase()+'.csv';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

// Renders the Apply/Last-7/30/90-days date-range control for one section ('Audit' or 'Install'),
// wired to that section's own analytics{kind}From/To vars — kept as one function instead of two

    <button class="filt-btn" onclick="(function(){const t=new Date();${varT}=_anDstr(t);t.setDate(t.getDate()-29);${varF}=_anDstr(t);drawAnalytics(_anBody())})()">Last 30 days</button>
    <button class="filt-btn" onclick="(function(){const t=new Date();${varT}=_anDstr(t);t.setDate(t.getDate()-89);${varF}=_anDstr(t);drawAnalytics(_anBody())})()">Last 90 days</button>
  </div>`;

/* ────────────────────────────────────────────────────────────────────────────────────────────
   BOOKINGS vs EXECUTIONS and TAT  (Execution tab, added 2026-08-18 with the V3 revamp)
   A booking and its execution are two different days and belong on two different dates: someone
   who buys a ₹999 site audit today for the day after tomorrow is a BOOKING today and an EXECUTION
   the day after tomorrow. Same for an installation — the order is placed on one day and the
   installers turn up on another. So this block counts, per day/week/month in the selected range:
     • bookings  = orders CREATED in the bucket (audit: audit_orders.created_at · install: the
                   parent install order's created_at, counted once per order, not per sub-job)
     • executions= work actually DONE in the bucket (audit: the "Site audit completed" log date,
                   falling back to the scheduled date · install: the canonical per-sub-job
                   completion date already used by every other install metric on this tab)
     • TAT       = execution date − booking date, in days, per executed row
   The two series are never added together and never share an axis scale trick: they are the same
   unit (jobs) on one axis, which is exactly when a grouped column chart is honest.
   Booking-side counts are NOT comparable to the Category tab's order counts: this side counts
   ops rows in Supabase, that side counts order lines in the order book.
   ──────────────────────────────────────────────────────────────────────────────────────────── */
function _anBookExecHtml(cfg){
  const buckets=mdAnBuckets(cfg.from,cfg.to).map(b=>({...b,vals:[
    cfg.bookings.filter(x=>x.date>=b.from&&x.date<=b.to).length,
    cfg.executions.filter(x=>x.date>=b.from&&x.date<=b.to).length]}));
  const nb=cfg.bookings.length, ne=cfg.executions.length;
  const tat=mdAnTatStats(cfg.tats);
  const days=Math.round((new Date(cfg.to)-new Date(cfg.from))/86400000)+1;
  const series=[{label:'Booked ('+cfg.bookLabel+')',color:'#5b3aa6'},{label:'Executed ('+cfg.execLabel+')',color:'#0f6e74'}];
  return `
    <div class="an-sub-head">Bookings vs executions</div>
    <div class="an-deliv-row">
      <div class="an-deliv-stat"><div class="an-deliv-val" style="color:var(--purple)">${nb}</div><div class="an-deliv-lbl">Booked in range<br><span style="font-weight:400">${mdAnNum1(nb/days)} / day</span></div></div>
      <div class="an-deliv-stat"><div class="an-deliv-val" style="color:var(--teal)">${ne}</div><div class="an-deliv-lbl">Executed in range<br><span style="font-weight:400">${mdAnNum1(ne/days)} / day</span></div></div>
      <div class="an-deliv-stat"><div class="an-deliv-val" style="color:${nb-ne>0?'var(--amber)':'var(--green)'}">${nb-ne>0?'+':''}${nb-ne}</div><div class="an-deliv-lbl">Booked minus executed<br><span style="font-weight:400">${nb-ne>0?'work flowing into the queue':'queue drained in this window'}</span></div></div>
      <div style="font-size:11.5px;color:var(--muted);align-self:center;max-width:340px;line-height:1.55">A booking counts on the day it was <b>sold</b>; an execution counts on the day the work was <b>done</b>. The two rarely land in the same bucket, which is the whole point of splitting them.</div>
    </div>
    <div style="padding:14px 20px 4px">${mdAnGrouped(buckets,series,160)}</div>
    <div style="overflow-x:auto;padding:0 0 6px"><table class="an-inst-table">
      <thead><tr><th>${buckets.length&&buckets[0].days===1?'Day':'Bucket'}</th><th style="text-align:right">Days</th>
        <th style="text-align:right">Booked</th><th style="text-align:right">Booked / day</th>
        <th style="text-align:right">Executed</th><th style="text-align:right">Executed / day</th></tr></thead>
      <tbody>${buckets.map(b=>`<tr><td style="font-weight:700;white-space:nowrap">${b.label}</td>
        <td style="text-align:right;color:var(--muted)">${b.days}</td>
        <td style="text-align:right">${b.vals[0]}</td><td style="text-align:right;color:var(--muted)">${mdAnNum1(b.vals[0]/b.days)}</td>
        <td style="text-align:right">${b.vals[1]}</td><td style="text-align:right;color:var(--muted)">${mdAnNum1(b.vals[1]/b.days)}</td></tr>`).join('')}</tbody>
    </table></div>
    <div class="an-sub-head">Turnaround — booking to execution</div>
    ${mdAnTatHtml(tat,cfg.tatLabel)}
    <div style="font-size:11.5px;color:var(--muted);padding:0 20px 14px;line-height:1.6">${cfg.tatNote}</div>`;
}

function drawAnalytics(m){
  window._anDrill={};
  let {installs,audits,ratings}=window._anData||{installs:[],audits:[],ratings:[]};
  // City segregation: scope BOTH sections to the selected city. Null city defaults to Bengaluru
  // (same convention as mapAuditRow/mapInstallRow and the Payouts tab). Filtering the two source
  // arrays here scopes every downstream metric (canonical sets, arrival stats, phone-match
  // conversion/MD-audit %, per-person tables) since they all derive from these two vars.
  if(CITY_ENABLED&&analyticsCity!=='all'){
    installs=installs.filter(o=>(o.city||'Bengaluru')===analyticsCity);
    audits=audits.filter(o=>(o.city||'Bengaluru')===analyticsCity);
  }
  const aFrom=analyticsAuditFrom, aTo=analyticsAuditTo, iFrom=analyticsInstallFrom, iTo=analyticsInstallTo;
  const todayStr=_anDstr(new Date());
  const TRACK_FROM='2026-07-02'; // arrival on time tracking start date

  // Install: one canonical row per subjob in range (no reschedule/multi-day double-counting)
  const iCanon=_anInstallCanon(installs,iFrom,iTo);
  const iTotal=iCanon.length;

  // Audit: completed orders by actual completion date; pending/in-progress by scheduled date
  const aFiltered=audits.filter(o=>o.date&&o.date>=aFrom&&o.date<=aTo);
  const aTotal=aFiltered.length;

  // Install calcs
  const iDone=iCanon.filter(a=>a.status==='completed'); // Completion % numerator — partial is in-progress, excluded (Phase 3)
  // Log-mention count is a distinct, looser signal from confirmedDelayed below (date-field mismatch) —
  // it catches cases logged as delayed where nobody actually updated delivery_date, and vice versa.
  // Previously this reused the exact same hasDelay/date-comparison boolean as confirmedDelayed, so
  // both stats in the Delivery Date Tracking row always showed an identical number (2026-07-18 fix).
  const iDelayed=iCanon.filter(a=>a.logDelay).length;
  // Material Depot Audit % — fully automated phone-number match (no manual "audit_by" input is
  // consulted); denominator is the full canonical total, not a distinct-PI count.
  const auditPhones=new Set(audits.map(o=>o.phone).filter(Boolean));
  const iMDaudit=iCanon.filter(r=>r.order.phone&&auditPhones.has(r.order.phone)).length;
  const avgA=(arr,k)=>{const vs=arr.filter(r=>r[k]!=null).map(r=>+r[k]);return vs.length?+(vs.reduce((s,v)=>s+v,0)/vs.length).toFixed(1):null;};

  // Audit calcs
  const aCompleted=aFiltered.filter(o=>o.status==='completed').length;
  const aRescheduled=aFiltered.filter(o=>o.status==='reschedule').length;
  // Site Audit → Order Conversion %: distinct audit customers (by phone) in this range who
  // eventually placed an install order, any time — even after the range end.
  const aPhonesInRange=new Set(aFiltered.map(o=>o.phone).filter(Boolean));
  const aConvertedPhones=[...aPhonesInRange].filter(p=>installs.some(io=>io.phone===p));

  // Ratings — attached via completion-derived lookup (order_id / installer-email join), not an
  // independently-scoped ratings.created_at date filter. Count is always ⊆ the completed set.
  const aRatingMap=_anAttachAuditRatings(aFiltered.filter(o=>o.status==='completed'),ratings);
  const iRatingMap=_anAttachInstallRatings(iCanon,ratings);
  const AR=[...aRatingMap.values()];
  const IR=[...iRatingMap.values()];
  const IR_q1=avgA(IR,'q1_score'),IR_q2=avgA(IR,'q2_score'),IR_q3=avgA(IR,'q3_score');
  const IR_prom=IR.filter(r=>r.q1_score>=9).length,IR_det=IR.filter(r=>r.q1_score<=7).length;
  const IR_nps=IR.length?Math.round((IR_prom-IR_det)/IR.length*100):null;
  const AR_q1=avgA(AR,'q1_score'),AR_q2=avgA(AR,'q2_score'),AR_q3=avgA(AR,'q3_score');
  const AR_prom=AR.filter(r=>r.q1_score>=9).length,AR_det=AR.filter(r=>r.q1_score<=7).length;
  const AR_nps=AR.length?Math.round((AR_prom-AR_det)/AR.length*100):null;

  // Arrival on time — denominator is the "reached site" subset of the SAME canonical/filtered set
  // used everywhere else in this section (not an independently-scoped scan of the raw arrays).
  // "Reached site" = completed/partial OR atsite — atsite jobs are still in progress but the
  // "arrived at site" log entry (which is what this metric actually matches against) is written
  // the moment status flips to atsite, so an in-progress atsite job already has real arrival data
  // available. Deliberately broader than iDone/aCompleted (which stay completed/partial-only —
  // those drive Completion %, where an in-progress job must NOT count as done).
  const iTrackFrom=iFrom>TRACK_FROM?iFrom:TRACK_FROM;
  const aTrackFrom=aFrom>TRACK_FROM?aFrom:TRACK_FROM;
  const iArrivalEligible=iCanon.filter(a=>['completed','partial','atsite'].includes(a.status));
  const aArrivalEligible=aFiltered.filter(o=>['completed','atsite'].includes(o.status));
  const iReached=iArrivalEligible.filter(r=>r.date>=iTrackFrom);
  const aReached=aArrivalEligible.filter(o=>o.date>=aTrackFrom);
  const iArr=_anInstallArrivalStats(installs,iTrackFrom,iTo,iReached);
  const aArr=_anAuditArrivalStats(audits,aTrackFrom,aTo,aReached);
  const iArrTot=iArr.agg, aArrTot=aArr.agg;

  // Per-installer / per-auditor
  const installers=_anInstallerMap(iCanon,iRatingMap,iArr.byName);
  const auditors=_anAuditorMap(aFiltered,aRatingMap,aArr.byName);

  // Delivery breakdown
  const origTracked=iCanon.filter(a=>a.originalDelivery).length;
  const confirmedDelayed=iCanon.filter(a=>a.hasDelay).length;

  /* ---- bookings / executions / TAT (see _anBookExecHtml above) ---- */
  // Audit execution date: the real "Site audit completed" log entry when there is one, else the
  // scheduled date (orders completed before that log line existed, or with a broken log).
  // Some live log rows carry a `d` that Date() cannot parse (258 such entries in audit_orders on
  // 2026-08-18) — _anDateIST would throw RangeError on those and blank the whole tab, so every
  // date derived from log/DB text goes through this guard first.
  const _anDateSafe=iso=>{const t=iso?new Date(iso):null;return t&&!isNaN(t)?_anDateIST(iso):null;};
  const _aExecDate=o=>{
    let cd=null;
    for(const l of (o.log||[])){
      if(!l.t||!l.d||!/site audit completed/i.test(l.t))continue;
      const d=_anDateSafe(l.d);
      if(d&&(!cd||d>cd))cd=d;
    }
    return cd||o.date||null;
  };
  const _dayDiff=(a,b)=>(!a||!b)?null:Math.round((new Date(a)-new Date(b))/86400000);
  const aBookings=audits.map(o=>({date:_anDateSafe(o.created_at),pi:o.pi}))
    .filter(x=>x.date&&x.date>=aFrom&&x.date<=aTo);
  const aExecs=audits.filter(o=>o.status==='completed').map(o=>({o,date:_aExecDate(o)}))
    .filter(x=>x.date&&x.date>=aFrom&&x.date<=aTo);
  const aTats=aExecs.map(x=>_dayDiff(x.date,_anDateSafe(x.o.created_at)));
  // Install: bookings are ORDERS (created_at, once per order); executions are SUB-JOBS, using the
  // same canonical completion date every other install metric on this tab uses.
  const iBookings=installs.map(o=>({date:_anDateSafe(o.created_at),pi:o.pi}))
    .filter(x=>x.date&&x.date>=iFrom&&x.date<=iTo);
  const iExecs=iCanon.filter(r=>r.status==='completed'||r.status==='partial');
  const iTats=iExecs.map(r=>_dayDiff(r.date,r.order?_anDateSafe(r.order.created_at):null));

  // Need action — live across all non-deleted install orders
  const naCount=installs.filter(o=>{
    if(['pending','deliv_delayed'].includes(o.status)&&o.delivery_date&&o.delivery_date<=todayStr) return true;
    if((o.subjobs||[]).some(sj=>sj.status==='reschedule')) return true;
    if(o.service&&o.service.follow_up_date&&o.service.follow_up_date<=todayStr) return true;
    return false;
  }).length;

  /* ---- Render helpers ---- */
  const pc=(n,d)=>d>0?Math.round(n/d*100):null;
  const pcc=p=>p===null?'var(--muted)':p>=80?'var(--green)':p>=50?'var(--amber)':'var(--red)';

  function _anDrillAttrs(drillKey){
    return (drillKey&&window._anDrill&&window._anDrill[drillKey])?` style="cursor:pointer" onclick="openAnalyticsDrill('${drillKey}')"`:'';
  }
  function _anDrillHint(drillKey){
    return (drillKey&&window._anDrill&&window._anDrill[drillKey])?`<div style="font-size:11px;color:var(--blue);font-weight:700;margin-top:6px">⤢ View &amp; export rows</div>`:'';
  }
  function pctCard(label,n,d,sub,note,drillKey){
    const p=pc(n,d);const c=pcc(p);
    return `<div class="an-card"${_anDrillAttrs(drillKey)}>
      <div class="an-label">${label}</div>
      <div class="an-val" style="color:${p===null?'var(--muted)':c}">${p!==null?p+'%':'—'}</div>
      ${p!==null?`<div class="an-bar"><div class="an-bar-fill" style="width:${p}%;background:${c}"></div></div>`:''}
      <div class="an-sub">${d>0?n+' of '+d:'No data'}</div>
      ${sub?`<div class="an-sub2">${sub}</div>`:''}
      ${note?`<div class="an-sub2" style="color:var(--amber)">${note}</div>`:''}
      ${_anDrillHint(drillKey)}
    </div>`;
  }
  function ratingCard(label,avg,cnt,drillKey){
    if(avg===null) return `<div class="an-card an-card-na"><div class="an-label">${label}</div><div class="an-val" style="color:var(--muted)">—</div><div class="an-sub">No ratings yet</div></div>`;
    const c=avg>=8?'var(--green)':avg>=6?'var(--amber)':'var(--red)';
    const s=Math.min(5,Math.round(avg/2));
    return `<div class="an-card"${_anDrillAttrs(drillKey)}>
      <div class="an-label">${label}</div>
      <div class="an-val" style="color:${c}">${avg}<span style="font-size:14px;color:var(--muted)">/10</span></div>
      <div class="an-stars">${'★'.repeat(s)+'☆'.repeat(5-s)}</div>
      <div class="an-sub">${cnt} rating${cnt!==1?'s':''} · in range</div>
      ${_anDrillHint(drillKey)}
    </div>`;
  }
  function npsCard(label,nps,prom,det,total,drillKey){
    if(nps===null) return `<div class="an-card an-card-na"><div class="an-label">${label}</div><div class="an-val" style="color:var(--muted)">—</div><div class="an-sub">No ratings yet</div></div>`;
    const c=nps>=50?'var(--green)':nps>=0?'var(--amber)':'var(--red)';
    const pass=total-prom-det;
    return `<div class="an-card"${_anDrillAttrs(drillKey)}>
      <div class="an-label">${label}</div>
      <div class="an-val" style="color:${c}">${nps>=0?'+':''}${nps}</div>
      <div class="an-nps-row">
        <span class="an-nps-p">▲ ${total?Math.round(prom/total*100):0}% Promoters (Q1 9–10)</span>
        <span class="an-nps-n">● ${total?Math.round(pass/total*100):0}% Neutral (Q1 = 8)</span>
        <span class="an-nps-d">▼ ${total?Math.round(det/total*100):0}% Detractors (Q1 ≤ 7)</span>
      </div>
      <div class="an-sub">${total} rating${total!==1?'s':''} · in range</div>
      ${_anDrillHint(drillKey)}
    </div>`;
  }

  function arrCell(onTime,late){
    const tot=onTime+late;
    if(!tot) return `<td style="color:var(--muted);font-size:11px">N/T</td>`;
    const p=Math.round(onTime/tot*100);const c=pcc(p);
    return `<td style="color:${c};font-weight:700">${p}%<span style="font-size:10px;color:var(--muted);font-weight:400"> (${tot})</span></td>`;
  }
  function ratingCell(arr){
    if(!arr||!arr.length) return `<td style="color:var(--muted)">—</td>`;
    const avg=+(arr.reduce((s,v)=>s+v,0)/arr.length).toFixed(1);
    const c=avg>=8?'var(--green)':avg>=6?'var(--amber)':'var(--red)';
    return `<td style="color:${c};font-weight:700">${avg}</td>`;
  }

  const instRows=installers.map(inst=>`<tr>
    <td style="font-weight:700">${inst.name}</td>
    <td>${inst.orders}</td>
    <td>${inst.completed}</td>
    ${arrCell(inst.arrOnTime,inst.arrLate)}
    ${ratingCell(inst.q1)}${ratingCell(inst.q2)}${ratingCell(inst.q3)}
    <td style="font-size:11px">${inst.wfQty?`<span style="color:var(--muted)">${Math.round(inst.wfQty)} sq.ft flooring</span>`:''}${inst.wpSqft?`<span style="color:var(--muted)">${inst.wfQty?' · ':''}${Math.round(inst.wpSqft)} sq.ft wallpaper · </span><b style="color:var(--purple)">${inst.wpRolls} roll${inst.wpRolls===1?'':'s'}</b>`:''}${!inst.wfQty&&!inst.wpSqft?'<span style="color:var(--muted)">—</span>':''}</td>
  </tr>`).join('');

  const audRows=auditors.map(aud=>`<tr>
    <td style="font-weight:700">${aud.name}</td>
    <td>${aud.orders}</td>
    <td>${aud.completed}</td>
    ${arrCell(aud.arrOnTime,aud.arrLate)}
    ${ratingCell(aud.q1)}${ratingCell(aud.q2)}${ratingCell(aud.q3)}
  </tr>`).join('');

  const iArrNote=iArrTot.onTime+iArrTot.late===0?'Tracking started 2 Jul 2026':'';
  const aArrNote=aArrTot.onTime+aArrTot.late===0?'Tracking started 2 Jul 2026':'';

  /* ---- Register drill-down data for clickable metric cards ---- */
  // Every row also carries customer/phone/bm for display + CSV export (added 2026-07-25 per
  // user request) — sourced directly from the audit/install order objects, no extra queries.
  const _aRow=o=>({customer:o.customer_name||'',phone:o.phone||'',bm:o.bm||''});
  const _iRow=o=>({customer:o.customer_name||'',phone:o.phone||'',bm:o.bm||''});
  _anSetDrill('aCompletion','Site Audit — Completion %','Every audit scheduled in this date range.','audit',
    aFiltered.map(o=>({pi:o.pi,date:o.date,..._aRow(o),result:o.status==='completed'?'✓ Completed':'✗ Not completed ('+(JOB_STATUS[o.status]?.l||o.status)+')'})));
  _anSetDrill('aArrival','Site Audit — Auditor Arrival On Time %','Every real logged arrival on/after 2 Jul 2026 (when arrival tracking began) — one row per attempt, so a reassigned audit can show up to once per auditor who actually visited. Rows with no matching "arrived at site" log entry are excluded from the % but shown here for visibility.','audit',
    aArr.tagged.map(t=>({pi:t.pi,date:t.date,..._aRow(t.order),result:t.bucket==='onTime'?'✓ On time'+(t.name?' ('+t.name+')':''):t.bucket==='late'?'✗ Late'+(t.name?' ('+t.name+')':''):'— No arrival log matched (excluded from %)'})));
  _anSetDrill('aReschedule','Site Audit — Reschedule Rate %','Every audit scheduled in this date range.','audit',
    aFiltered.map(o=>({pi:o.pi,date:o.date,..._aRow(o),result:o.status==='reschedule'?'✓ In reschedule status':'✗ Not in reschedule ('+(JOB_STATUS[o.status]?.l||o.status)+')'})));
  _anSetDrill('aConversion','Site Audit → Installation Order %','One row per distinct customer phone audited in this range. "Converted" = that phone placed an INSTALLATION order at any time, even after the range ends. Material-only orders are invisible to this tab (they live in the order book, not the ops DB) — the Category tab reports those.','audit',
    [...aPhonesInRange].map(p=>{const rep=aFiltered.find(o=>o.phone===p);return {pi:rep?rep.pi:'',date:rep?rep.date:'',...(rep?_aRow(rep):{customer:'',phone:p,bm:''}),result:aConvertedPhones.includes(p)?'✓ Converted to install order':'✗ Not converted yet'};}));
  _anSetDrill('aRatings','Site Audit — Client Ratings','Every audit with a client rating attached in this range (used by NPS, Q1, Q2, Q3).','audit',
    [...aRatingMap.entries()].map(([o,r])=>({pi:o.pi,date:o.date,..._aRow(o),result:(r.q1_score>=9?'✓ Promoter':r.q1_score<=7?'✗ Detractor':'● Neutral')+' — Q1 '+r.q1_score+' · Q2 '+r.q2_score+' · Q3 '+(r.q3_score??'—')})));
  _anSetDrill('iArrival','Site Installation — Installer Arrival On Time %','Every real logged arrival on/after 2 Jul 2026 (when arrival tracking began) — one row per attempt, so a reassigned subjob can show up to once per installer who actually visited. Rows with no matching "arrived at site" log entry are excluded from the % but shown here for visibility.','install',
    iArr.tagged.map(t=>({pi:t.pi,date:t.date,..._iRow(t.order),result:t.bucket==='onTime'?'✓ On time'+(t.name?' ('+t.name+')':''):t.bucket==='late'?'✗ Late'+(t.name?' ('+t.name+')':''):'— No arrival log matched (excluded from %)'})));
  _anSetDrill('iMDaudit','Site Installation — Material Depot Audit %','Every subjob in range, phone-matched against all-time site audit orders.','install',
    iCanon.map(r=>({pi:r.pi,date:r.date,..._iRow(r.order),result:(r.order.phone&&auditPhones.has(r.order.phone))?'✓ Matched a Material Depot site audit':'✗ No matching site audit'})));
  _anSetDrill('iCompletion','Site Installation — Completion %','Every subjob in this date range.','install',
    iCanon.map(r=>({pi:r.pi,date:r.date,..._iRow(r.order),result:r.status==='completed'?'✓ '+(JOB_STATUS[r.status]?.l||r.status):'✗ Not yet completed ('+(JOB_STATUS[r.status]?.l||r.status)+')'})));
  _anSetDrill('iRatings','Site Installation — Client Ratings','Every subjob with a client rating attached in this range (used by NPS, Q1, Q2, Q3).','install',
    [...iRatingMap.entries()].map(([row,r])=>({pi:row.pi,date:row.date,..._iRow(row.order),result:(r.q1_score>=9?'✓ Promoter':r.q1_score<=7?'✗ Detractor':'● Neutral')+' — Q1 '+r.q1_score+' · Q2 '+r.q2_score+' · Q3 '+(r.q3_score??'—')})));

  const iByStatus={};
  iCanon.forEach(a=>{iByStatus[a.status]=(iByStatus[a.status]||0)+1;});
  const statusDefs=[
    {k:'completed',l:'Completed',c:'var(--green)'},
    {k:'partial',l:'Partially Completed',c:'var(--teal)'},
    {k:'onway',l:'On The Way',c:'var(--blue)'},
    {k:'atsite',l:'At Site',c:'var(--blue)'},
    {k:'reschedule',l:'Rescheduled',c:'var(--red)'},
    {k:'callpending',l:'Call Pending',c:'var(--amber)'},
    {k:'assigned',l:'Assigned',c:'var(--amber)'},
    {k:'scheduled',l:'Scheduled',c:'var(--muted)'},
  ];

  // City segmented toggle (shown only when the city dimension is live) — scopes both sections.
  const anCityToggle=CITY_ENABLED?`
    <div style="display:flex;align-items:center;gap:10px;margin:0 0 16px;flex-wrap:wrap">
      <span style="font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px">City</span>
      <div style="display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden">
        ${[['all','All Cities'],['Bengaluru','Bengaluru'],['Hyderabad','Hyderabad']].map(([c,lbl],i)=>{const on=analyticsCity===c;return `<button onclick="setAnalyticsCity('${c}')" style="padding:8px 16px;border:0;${i?'border-left:1px solid var(--line);':''}cursor:pointer;font-weight:700;font-size:13px;background:${on?'var(--navy)':'#fff'};color:${on?'#fff':'var(--ink)'}">${lbl}</button>`;}).join('')}
      </div>
    </div>`:'';

  m.innerHTML=`
    <div class="page-head"><h1>Analytics</h1><p>Operational metrics. Each subjob counted exactly once per range, using its current status and most relevant date — reschedule history and multi-day spans never duplicate a row. Site Audit and Site Installation each have their own independent date range below.</p></div>

    <div style="color:var(--muted);font-size:11px;margin:0 0 12px">🔄 Auto-refreshing every 60s${window._anLastFetch?(' · Last updated '+new Date(window._anLastFetch).toLocaleTimeString()):''}</div>

    ${anCityToggle}

    <!-- ══ SITE AUDIT ════════════════════════════════════════════════════ -->
    <div class="an-section">
      <div class="an-section-head">
        <span class="an-section-ico">🔍</span>
        <div>
          <div class="an-section-title">Site Audit</div>
          <div class="an-section-sub">One row per audit · ${aFrom} to ${aTo}</div>
        </div>
        <div class="an-hero"><div class="an-hero-val">${aTotal}</div><div class="an-hero-label">Total Audits in Range</div></div>
      </div>

      <div style="padding:14px 20px 0">${_anDateRowHtml('Audit')}</div>

      <div class="an-sub-head">Overview</div>
      <div class="an-grid4">
        ${pctCard('Completion %',aCompleted,aTotal,'Audits that reached completed status','','aCompletion')}
        ${pctCard('Auditor Arrival On Time %',aArrTot.onTime,aArrTot.onTime+aArrTot.late,'&gt; 3 min past slot = delayed — one entry per real logged arrival, so a reassigned audit counts each auditor\'s own attempt',aArrNote,'aArrival')}
        ${pctCard('Reschedule Rate %',aRescheduled,aTotal,'Audits currently in reschedule status','','aReschedule')}
        ${pctCard('Site Audit → Installation Order %',aConvertedPhones.length,aPhonesInRange.size,'Distinct audit customers (by phone) in this range who eventually placed an INSTALLATION order — any time, even after the range end. This tab only sees the ops database, so a customer who bought material and skipped installation does not count here: for the full picture (material-only vs material + installation) use the <b>Category</b> tab’s audit → order conversion, which reads the order book.','','aConversion')}
        ${npsCard('NPS Score',AR_nps,AR_prom,AR_det,AR.length,'aRatings')}
        ${ratingCard('Q1 — Overall Service',AR_q1,AR.length,'aRatings')}
        ${ratingCard('Q2 — Auditor Rating',AR_q2,AR.length,'aRatings')}
        ${ratingCard('Q3 — Site Cleanliness',AR_q3,AR.length,'aRatings')}
      </div>

      <div style="font-size:11.5px;color:var(--muted);padding:10px 20px;border-bottom:1px solid var(--line)">Note: Rescheduled audits originally scheduled in range but moved to a future date appear under the original date AND the new date. Reschedule Rate counts audits currently in reschedule status within the selected range.</div>

      ${_anBookExecHtml({from:aFrom,to:aTo,bookings:aBookings,executions:aExecs,tats:aTats,
        bookLabel:'audit sold',execLabel:'audit done',tatLabel:'site audits',
        tatNote:'One row per completed site audit whose execution lands in this range. Booking date is the audit order\'s created_at (IST); execution date is its “Site audit completed” log entry, falling back to the scheduled date where no such entry exists. A pre-booking made by store staff only appears once it becomes a real audit order — reserved slots are excluded from this tab entirely.'})}

      <div class="an-sub-head">Per-Auditor Breakdown</div>
      ${auditors.length?`<div style="overflow-x:auto"><table class="an-inst-table">
        <thead><tr>
          <th>Auditor</th><th>Orders</th><th>Completed</th>
          <th>On-time Arrival %<small>from 2 Jul 2026</small></th>
          <th>Q1 Overall</th><th>Q2 Auditor</th><th>Q3 Cleanliness</th>
        </tr></thead>
        <tbody>${audRows}</tbody>
      </table></div>`:`<div class="an-na-note">No audits in this date range.</div>`}
    </div>

    <!-- ══ SITE INSTALLATION ══════════════════════════════════════════════ -->
    <div class="an-section">
      <div class="an-section-head">
        <span class="an-section-ico">🔧</span>
        <div>
          <div class="an-section-title">Site Installation</div>
          <div class="an-section-sub">One row per subjob · ${iFrom} to ${iTo}</div>
        </div>
        <div class="an-hero"><div class="an-hero-val">${iTotal}</div><div class="an-hero-label">Total Subjobs in Range</div></div>
      </div>

      <div style="padding:14px 20px 0">${_anDateRowHtml('Install')}</div>

      <div class="an-sub-head">Overview</div>
      <div class="an-grid4">
        ${pctCard('Installer Arrival On Time %',iArrTot.onTime,iArrTot.onTime+iArrTot.late,'&gt; 3 min past slot = delayed — one entry per real logged arrival, so a reassigned job counts each installer\'s own attempt',iArrNote,'iArrival')}
        ${pctCard('Material Depot Audit %',iMDaudit,iTotal,'Install customers who also had an MD site audit','Fully automated — phone-number match, no manual input used','iMDaudit')}
        ${pctCard('Completion %',iDone.length,iTotal,'Completed or partially completed, out of all subjobs in range','','iCompletion')}
        ${npsCard('NPS Score',IR_nps,IR_prom,IR_det,IR.length,'iRatings')}
        ${ratingCard('Q1 — Overall Service',IR_q1,IR.length,'iRatings')}
        ${ratingCard('Q2 — Installer Rating',IR_q2,IR.length,'iRatings')}
        ${ratingCard('Q3 — Site Cleanliness',IR_q3,IR.length,'iRatings')}
      </div>

      <div class="an-sub-head">Status Breakdown</div>
      <div style="display:flex;flex-wrap:wrap;gap:10px;padding:14px 20px;border-bottom:1px solid var(--line)">
        ${statusDefs.filter(sd=>iByStatus[sd.k]).map(sd=>`<div style="background:#f8f9fc;border:1px solid var(--line);border-radius:10px;padding:10px 16px;min-width:120px">
          <div style="font-size:22px;font-weight:800;color:${sd.c}">${iByStatus[sd.k]}</div>
          <div style="font-size:11px;font-weight:700;color:var(--muted);margin-top:2px">${sd.l}</div>
          <div style="font-size:11px;color:var(--muted)">${iTotal?Math.round(iByStatus[sd.k]/iTotal*100)+'%':'—'}</div>
        </div>`).join('')}
      </div>

      ${_anBookExecHtml({from:iFrom,to:iTo,bookings:iBookings,executions:iExecs,tats:iTats,
        bookLabel:'order placed',execLabel:'sub-job done',tatLabel:'installations',
        tatNote:'Bookings are counted once per install ORDER on its created_at; executions are counted per SUB-JOB on its completion date, so an order with a wallpaper and a flooring sub-job books once and executes twice. TAT is measured from the parent order\'s created_at to each sub-job\'s completion date. Orders created before 1 Jul 2026 carry no log in this tab\'s payload, so their completion date falls back to the scheduled date — the same documented limitation as the metrics above.'})}

      <div class="an-sub-head">Delivery Date Tracking</div>
      <div class="an-deliv-row">
        <div class="an-deliv-stat"><div class="an-deliv-val" style="color:var(--red)">${iDelayed}</div><div class="an-deliv-lbl">Delay mentioned in log</div></div>
        <div class="an-deliv-stat"><div class="an-deliv-val" style="color:var(--green)">${iTotal-iDelayed}</div><div class="an-deliv-lbl">No delay mentioned</div></div>
        <div style="width:1px;background:var(--line);margin:0 4px;align-self:stretch"></div>
        <div class="an-deliv-stat"><div class="an-deliv-val" style="color:var(--blue)">${origTracked}</div><div class="an-deliv-lbl">With original date tracked</div></div>
        <div class="an-deliv-stat"><div class="an-deliv-val" style="color:var(--amber)">${confirmedDelayed}</div><div class="an-deliv-lbl">Confirmed delayed (date changed)</div></div>
        ${origTracked===0?`<div style="font-size:11.5px;color:var(--muted);align-self:center;margin-left:8px">Original date tracking started 2 Jul 2026 — no data for this range yet.</div>`:''}
      </div>

      <div class="an-sub-head">Live Operations</div>
      <div style="padding:14px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;background:${naCount>0?'var(--amberbg)':'var(--greenbg)'}">
        <div style="font-size:40px;font-weight:900;line-height:1;color:${naCount>0?'var(--amber)':'var(--green)'}">${naCount}</div>
        <div>
          <div style="font-size:13.5px;font-weight:800;color:${naCount>0?'var(--amber)':'var(--green)'}">${naCount>0?naCount+' install order'+(naCount!==1?'s need':'needs')+' SM attention right now':'All clear — no install orders need action'}</div>
          <div style="font-size:11.5px;color:var(--muted);margin-top:3px">Overdue ops calls + overdue follow-ups + reschedule orders · Live count, not filtered by date range</div>
        </div>
      </div>

      <div class="an-sub-head">Per-Installer Breakdown</div>
      ${installers.length?`<div style="overflow-x:auto"><table class="an-inst-table">
        <thead><tr>
          <th>Installer</th><th>Orders</th><th>Completed</th>
          <th>On-time Arrival %<small>from 2 Jul 2026</small></th>
          <th>Q1 Overall</th><th>Q2 Installer</th><th>Q3 Cleanliness</th><th>Area / Rolls</th>
        </tr></thead>
        <tbody>${instRows}</tbody>
      </table></div>`:`<div class="an-na-note">No installer assignments in this date range.</div>`}
    </div>

    <div class="an-footer">
      <b>Completion %:</b> Audit — completed ÷ total audits in range. Install — (completed + partially completed) ÷ total subjobs in range. Replaces the old separate "Job Card &amp; Signature %" metric.<br>
      <b>Ratings (NPS / Q1 / Q2 / Q3):</b> Attached to each completed order via its own ID (audit: unambiguous; install: matched by assigned-installer email, with a nearest-completion-time fallback) — not an independent date filter on the ratings table. Count is always a subset of that section's completed total. Known limitation: if the same installer completes two subjobs on one order, the rating may occasionally be attributed to the wrong one of the two.<br>
      <b>Arrival on time:</b> Only counted among jobs that actually reached site (audit: completed; install: completed or partially completed), floor 2 Jul 2026 (when tracking began). &gt;3 min late = delayed. N/T = no tracked data in range.<br>
      <b>Material Depot Audit %:</b> Fully automated — phone-number match between install and site-audit orders, no manual "audit type" input is used. Matched against phone numbers for all non-deleted install orders, regardless of creation date.<br>
      <b>Site Audit → Installation Order %:</b> Of the distinct customers (by phone) audited in this range, the % who placed an <b>installation</b> order at any time — including after the range ends. This is the ops-DB view and is deliberately narrower than the <b>Category</b> tab's <b>site audit → order conversion</b>, which reads the order book and therefore also counts customers who bought material only and took no installation from us. Expect the Category figure to be the higher of the two.<br>
      <b>Delivery delay (log-based):</b> Any log entry mentioning "delay". <b>Confirmed delayed (new):</b> compares original_delivery_date vs current delivery_date — set for orders created from 2 Jul 2026.<br>
      <b>One row per subjob:</b> reschedule history and multi-day custom installs never produce more than one row per subjob in this section's counts.<br>
      <b>NPS:</b> Promoters Q1 ≥ 9, Detractors Q1 ≤ 7. Range −100 to +100.
    </div>`;
}

/* ---- LIVE LOCATIONS ---- */
async function renderLiveLocations(m){
  if(_liveLocTimer)clearInterval(_liveLocTimer);
  m.innerHTML='<div class="loading-row"><span class="spinner"></span></div>';
  await _drawLiveLocations(m);
  _liveLocTimer=setInterval(()=>{if(currentView==='live')_drawLiveLocations(m);},30000);
}
async function _drawLiveLocations(m){
  const todayStr=_anDstr(new Date());
  // Fetch today's orders and all field worker profiles in parallel
  const [aOrds,iOrds,allProfs]=await Promise.all([
    sbGet('audit_orders?select=pi,addr,slot,auditor_email,status&date=eq.'+todayStr+'&status=not.in.(deleted,slot_reserved,slot_converted)'),
    sbGet('install_orders?select=pi,addr,subjobs,status&status=not.in.(deleted,pending,deliv_ontime,deliv_delayed)'),
    sbGet('profiles?select=name,email,role,last_lat,last_lng,last_loc_at,last_order_pi&role=in.(site_auditor,installer,auditor_installer)')
  ]);
  if(!Array.isArray(allProfs)){
    m.innerHTML=`<div class="page-head"><h1>Live Locations</h1></div><div style="padding:24px;color:var(--amber);font-weight:600">⚠ Location columns not yet added to the database. Run the SQL from setup instructions to enable this feature.</div>`;
    return;
  }
  // Build profile lookup and today-order lookup
  const profMap={};for(const p of allProfs)profMap[p.email]=p;
  const wOrds={};
  const addOrd=(email,e)=>{if(!email)return;if(!wOrds[email])wOrds[email]=[];wOrds[email].push(e);};
  const parseSlotH=s=>{if(!s)return 99;const r=s.match(/^(\d{1,2}):(\d{2})$/);return r?+r[1]+ +r[2]/60:99;};
  const fmtSlot=s=>{if(!s)return'—';const r=s.match(/^(\d{1,2}):(\d{2})$/);if(!r)return s;const h=+r[1],mn=+r[2],ap=h>=12?'PM':'AM',h12=h%12||12;return h12+':'+(mn<10?'0':'')+mn+' '+ap;};
  if(Array.isArray(aOrds)){
    for(const o of aOrds)addOrd(o.auditor_email,{pi:o.pi,addr:o.addr||'',slot:o.slot,slotH:parseSlotH(o.slot),done:o.status==='completed'});
  }
  if(Array.isArray(iOrds)){
    for(const o of iOrds){
      for(const sj of(o.subjobs||[])){
        for(const a of(sj.assignments||[])){
          const dates=a.dates||(a.date?[a.date]:[]);
          if(!dates.includes(todayStr))continue;
          const slot=(a.slots&&a.slots[0])||sj.slot||null;
          addOrd(a.installer_email,{pi:o.pi,addr:o.addr||'',slot,slotH:parseSlotH(slot),done:sj.status==='completed'});
        }
      }
    }
  }
  for(const e of Object.keys(wOrds))wOrds[e].sort((a,b)=>a.slotH-b.slotH);
  // All workers with orders today; sort: GPS first, then no-GPS; within GPS group by last_loc_at desc
  const todayEmails=Object.keys(wOrds);
  const workers=todayEmails.map(e=>profMap[e]).filter(Boolean);
  workers.sort((a,b)=>{
    const aHasLoc=!!a.last_lat,bHasLoc=!!b.last_lat;
    if(aHasLoc!==bHasLoc)return aHasLoc?-1:1;
    if(a.last_loc_at&&b.last_loc_at)return new Date(b.last_loc_at)-new Date(a.last_loc_at);
    return 0;
  });
  const workerCN=email=>{const ords=wOrds[email]||[];const inc=ords.filter(o=>!o.done);return{cur:inc[0]||null,nxt:inc[1]||null};};
  const ago=d=>{if(!d)return'—';const s=Math.round((Date.now()-new Date(d))/1000);if(s<60)return s+'s ago';if(s<3600)return Math.floor(s/60)+'m ago';return Math.floor(s/3600)+'h ago';};
  const trA=a=>(a||'').length>45?a.slice(0,45)+'…':a||'—';
  const rows=workers.length?workers.map(w=>{
    const{cur,nxt}=workerCN(w.email);
    const openCell=w.last_lat
      ?`<a href="https://maps.google.com/?q=${w.last_lat},${w.last_lng}" target="_blank" rel="noopener" style="color:var(--blue);font-weight:700;text-decoration:none">📍 Open</a>`
      :`<span style="color:var(--muted);font-size:11px">No GPS</span>`;
    return`<tr>
      <td style="font-weight:700">${w.name||w.email}</td>
      <td style="color:var(--muted);font-size:12px">${trA(cur?cur.addr:'')}</td>
      <td style="color:${w.last_lat?'var(--muted)':'var(--red)'}">${w.last_lat?ago(w.last_loc_at):'Not sharing'}</td>
      <td>${cur?cur.pi:(w.last_order_pi||'—')}</td>
      <td style="color:var(--muted)">${cur?fmtSlot(cur.slot):'—'}</td>
      <td style="color:var(--muted)">${nxt?fmtSlot(nxt.slot):'—'}</td>
      <td>${openCell}</td>
    </tr>`;
  }).join(''):`<tr><td colspan="7" style="text-align:center;color:var(--muted);padding:28px">No field workers have orders scheduled for today.</td></tr>`;
  m.innerHTML=`
    <div class="page-head"><h1>Live Locations</h1><p style="color:var(--muted);font-size:13px">All field workers with orders today — auto-refreshes every 30 seconds.</p></div>
    <div id="liveMapEl" style="height:380px;border-radius:14px;overflow:hidden;margin:0 0 20px;border:1px solid var(--line);background:#e8eaed"></div>
    <table style="width:100%;border-collapse:collapse">
      <thead><tr style="font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)">
        <th style="text-align:left;padding:6px 8px">Worker</th><th style="text-align:left;padding:6px 8px">Address</th>
        <th style="text-align:left;padding:6px 8px">Last seen</th><th style="text-align:left;padding:6px 8px">Order</th>
        <th style="text-align:left;padding:6px 8px">Current start</th><th style="text-align:left;padding:6px 8px">Next start</th><th style="padding:6px 8px"></th>
      </tr></thead>
      <tbody style="font-size:13px">${rows}</tbody>
    </table>`;
  const escH=s=>(s||'').replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
  const mkIcon=name=>L.divIcon({className:'',html:`<div style="text-align:center;display:inline-block"><svg width="22" height="32" viewBox="0 0 24 36" style="display:block;margin:0 auto"><path d="M12 0C5.4 0 0 5.4 0 12c0 9 12 24 12 24s12-15 12-24C24 5.4 18.6 0 12 0z" fill="#2E6CA8"/><circle cx="12" cy="12" r="5" fill="#fff"/></svg><div style="background:rgba(31,58,95,0.92);color:#fff;font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px;white-space:nowrap;margin-top:2px;box-shadow:0 1px 4px rgba(0,0,0,0.25)">${name}</div></div>`,iconSize:[80,52],iconAnchor:[40,32]});
  const gpsWorkers=workers.filter(w=>w.last_lat&&w.last_lng);
  if(window.L&&gpsWorkers.length){
    try{
      const center=[gpsWorkers[0].last_lat,gpsWorkers[0].last_lng];
      const lmap=L.map('liveMapEl',{zoomControl:true}).setView(center,13);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors',maxZoom:18}).addTo(lmap);
      gpsWorkers.forEach(w=>{
        const{cur}=workerCN(w.email);
        const nm=escH(w.name||w.email.split('@')[0]);
        L.marker([w.last_lat,w.last_lng],{icon:mkIcon(nm)})
          .bindPopup(`<b>${w.name||w.email}</b><br>${cur?'Order: '+cur.pi+'<br>':''}${cur&&cur.addr?cur.addr+'<br>':''}${ago(w.last_loc_at)}`)
          .addTo(lmap);
      });
      if(gpsWorkers.length>1){const grp=L.featureGroup(gpsWorkers.map(w=>L.marker([w.last_lat,w.last_lng])));lmap.fitBounds(grp.getBounds().pad(0.3));}
    }catch(e){}
  }else if(window.L){
    try{const lmap=L.map('liveMapEl').setView([12.9716,77.5946],11);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors'}).addTo(lmap);}catch(e){}
  }
}
